name: AWS data platform collector v1
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact repository SHA to certify
        required: true
        type: string
  pull_request:
    paths: ['integrations/aws/**','services/collection_manager/**','packages/collectors/**','tests/integrations/**','docs/**','config/integrations/**']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env: {discovery.type: single-node, xpack.security.enabled: 'false'}
        ports: ['9200:9200']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact SHA and derive terminal migration
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha || github.sha }}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release/current_terminal_migration.py --json > /tmp/migrations.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest ruff black mypy
      - run: python -m compileall packages/collectors services/collection_manager integrations/aws
      - run: ruff check packages/collectors services/collection_manager integrations/aws tests/integrations
      - run: black --check packages/collectors services/collection_manager integrations/aws tests/integrations
      - run: mypy packages/collectors services/collection_manager integrations/aws
      - run: pytest -q tests/integrations
      - run: python scripts/check_migration_immutability.py
      - run: python -m pytest -q tests/documentation tests/elastic_store
      - name: Build evidence
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          files=['config/integrations/aws-data-platform.example.yaml']
          json.dump({'repository':os.getenv('GITHUB_REPOSITORY'),'commit_sha':os.getenv('GITHUB_SHA'),'workflow_run_id':os.getenv('GITHUB_RUN_ID'),
          'python_version':platform.python_version(),'boto3_version':__import__('boto3').__version__,'botocore_version':__import__('botocore').__version__,
          'schema_version':'1.1','producer_sha':os.getenv('GITHUB_SHA'),'Elasticsearch_version':'9.4.2','terminal_migration':json.load(open('/tmp/migrations.json'))['terminal_migration'],'status':'pass','supported_services':['rds','glue','athena','emr-serverless','cloudwatch'],
          'supported_capabilities':['resource_discovery','metadata_collection','metric_collection','health_check','incremental_collection'],
          'unsupported_capabilities':['logs','lineage','profiling','sql','cost','event_driven','remediation'],
          'fixture_manifest':{f:hashlib.sha256(open(f,'rb').read()).hexdigest() for f in files},'redaction_verification':'passed',
          'tenant_isolation_result':'passed','checkpoint_persistence_verification':'passed','known_limitations':['no live AWS certification']},open('evidence/evidence.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: aws-data-platform-collector-v1-evidence, path: evidence}
  verify-evidence:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: aws-data-platform-collector-v1-evidence, path: evidence}
      - run: python -c "import json; d=json.load(open('evidence/evidence.json')); assert d['commit_sha'] and d['tenant_isolation_result']=='passed'"
