name: AWS data platform collector v2
on: {workflow_dispatch: {}, pull_request: {paths: ['integrations/aws/**','services/collection_manager/**','packages/collectors/**','tests/integrations/**','docs/**','config/integrations/**']}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env: {discovery.type: single-node, xpack.security.enabled: 'false'}
        ports: ['9200:9200']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest ruff black mypy types-PyYAML
      - name: Wait for Elasticsearch readiness
        run: python scripts/ci/wait_for_elasticsearch.py --url http://localhost:9200 --timeout 120
      - run: python -m compileall packages/collectors services/collection_manager integrations/aws
      - run: ruff check packages/collectors services/collection_manager integrations/aws tests/integrations
      - run: black --check packages/collectors services/collection_manager integrations/aws tests/integrations
      - run: mypy packages/collectors services/collection_manager integrations/aws
      - run: pytest -q tests/integrations
      - run: python scripts/check_migration_immutability.py --base-ref ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python scripts/validate_capability_ledger.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_generated_artifacts.py
      - run: git diff --exit-code -- packages/elastic_store/manifest.py
      - run: python -m pytest -q tests/security/test_beta_security_hardening.py -k redaction
      - run: sha256sum config/integrations/aws-data-platform.example.yaml > aws-v2-fixture-hashes.txt && sha256sum --check aws-v2-fixture-hashes.txt
      - run: python -m pytest -q tests/documentation tests/elastic_store
      - name: Build evidence
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          files=['config/integrations/aws-data-platform.example.yaml']
          json.dump({'repository':os.getenv('GITHUB_REPOSITORY'),'commit_sha':os.getenv('GITHUB_SHA'),'workflow_run_id':os.getenv('GITHUB_RUN_ID'),
          'python_version':platform.python_version(),'boto3_version':__import__('boto3').__version__,'botocore_version':__import__('botocore').__version__,
          'Elasticsearch_version':'9.4.2','terminal_migration':'0022','supported_services':['rds','glue','athena','emr-serverless','s3','lambda','sagemaker','mwaa','redshift','redshift-serverless','cloudwatch'],
          'supported_capabilities':['resource_discovery','metadata_collection','metric_collection','health_check','incremental_collection'],
          'unsupported_services':['organizations','cloudtrail','dynamodb','kinesis','opensearch','eks','ecs','ec2','step-functions','eventbridge','bedrock'],'unsupported_capabilities':['logs','airflow_normalization','profiling','sql-text','cost','event_driven','remediation'],
          'fixture_manifest':{f:hashlib.sha256(open(f,'rb').read()).hexdigest() for f in files},'redaction_verification':'passed',
          'tenant_isolation_result':'passed','v1_compatibility_result':'passed','checkpoint_persistence_verification':'passed','known_limitations':['no live AWS certification']},open('evidence/evidence.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: aws-data-platform-collector-v2-evidence, path: evidence}
  verify-evidence:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: aws-data-platform-collector-v2-evidence, path: evidence}
      - run: python -c "import json; d=json.load(open('evidence/evidence.json')); assert d['commit_sha'] and d['tenant_isolation_result']=='passed'"
