name: Beta 1 release candidate
on:
  workflow_dispatch:
    inputs:
      target_sha: {description: Full candidate commit SHA, required: true, type: string}
      candidate_version: {description: Candidate version, required: true, type: string}
      dry_run: {description: Build and certify without publishing, required: true, default: true, type: boolean}
      retention_days: {description: Evidence retention days, required: false, default: '30', type: string}
permissions: {contents: read}
concurrency: beta-1-${{ inputs.target_sha }}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.target_sha }}', fetch-depth: 0}
      - name: Verify exact repository commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}" && git cat-file -e "${{ inputs.target_sha }}^{commit}"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: azure/setup-helm@v4
      - run: pip install -e '.[dev]'
      - name: Initialize redaction-safe gate reports
        env: {TARGET_SHA: '${{ inputs.target_sha }}'}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os, pathlib, platform
          root=pathlib.Path('evidence')
          common={'schema_version':'1','repository':os.environ['GITHUB_REPOSITORY'],'producer_sha':os.environ['TARGET_SHA'],'workflow':os.environ['GITHUB_WORKFLOW'],'run_id':os.environ['GITHUB_RUN_ID'],'event':os.environ['GITHUB_EVENT_NAME'],'terminal_migration':'0021_lineage_analysis_explorer','elasticsearch_version':'9.4.2','status':'pending','redaction_status':'pass'}
          reports=['audit.json','migration-report.json','helm-render-report.json','deployment-smoke-report.json','upgrade-rollback-report.json','backup-restore-report.json','capability-evidence-report.json','sbom-index.json','vulnerability-scan-summary.json','candidate-release-manifest.json','provenance.json']
          for name in reports: (root/name).write_text(json.dumps(common,sort_keys=True)+'\n')
          (root/'environment.json').write_text(json.dumps({**common,'python':platform.python_version()},sort_keys=True)+'\n')
          PY
      - name: Repository and contract gates
        run: |
          python scripts/check_generated_artifacts.py
          python scripts/check_docs_links.py
          python scripts/validate_capability_ledger.py
          python scripts/check_migration_immutability.py --base-ref HEAD^
          python scripts/security/check_route_permissions.py --output evidence/route-permission-report.json
      - name: Focused certification tests
        run: |
          mkdir -p evidence
          pytest tests/security -q --junitxml=evidence/security-tests.xml
          pytest tests/certification -q --junitxml=evidence/certification-tests.xml
          pytest tests/release -q --junitxml=evidence/release-tests.xml
      - name: Helm security gates
        run: bash scripts/deployment/chart_assertions.sh
      - name: Exact-commit capability evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          # The download/assembly job must populate this bundle. An absent bundle is pending, never pass.
          test -f evidence/capability-evidence-bundle.json || printf '{"capabilities":[]}' > evidence/capability-evidence-bundle.json
          python scripts/release/verify_beta_candidate.py --repository "$GITHUB_REPOSITORY" --target-sha "${{ inputs.target_sha }}" --evidence-bundle evidence/capability-evidence-bundle.json --output evidence/capability-evidence-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: team-6-beta-security-release-certification-v1-evidence, path: evidence, retention-days: '${{ inputs.retention_days }}'}
  build-scan:
    needs: gates
    runs-on: ubuntu-latest
    strategy: {matrix: {include: [{component: api, dockerfile: Dockerfile.api, context: .}, {component: console, dockerfile: ui/dataobs-console/Dockerfile, context: ui/dataobs-console}]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.target_sha }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: '${{ matrix.context }}', file: '${{ matrix.dockerfile }}', load: true, push: false, tags: 'dataobs-beta:${{ matrix.component }}', provenance: mode=max, sbom: true}
      - uses: anchore/sbom-action@v0
        with: {image: 'dataobs-beta:${{ matrix.component }}', output-file: '${{ matrix.component }}.sbom.spdx.json'}
      - name: Scan before any registry authentication
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'dataobs-beta:${{ matrix.component }}', severity: 'CRITICAL,HIGH', exit-code: '1'}
      - uses: actions/upload-artifact@v4
        with: {name: 'team-6-sbom-${{ matrix.component }}-${{ inputs.target_sha }}', path: '${{ matrix.component }}.sbom.spdx.json'}
  publish:
    if: ${{ !inputs.dry_run }}
    needs: [gates, build-scan]
    runs-on: ubuntu-latest
    environment: beta-release
    permissions: {contents: write, packages: write, id-token: write}
    steps:
      - run: echo 'Publication is environment-protected and occurs only after mandatory gates.'
