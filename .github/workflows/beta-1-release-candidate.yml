name: Team 6 Beta 1 release candidate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character repository commit SHA
        required: true
        type: string
      candidate_version:
        description: SemVer Beta candidate version
        required: true
        type: string
      dry_run:
        description: Build and certify without publishing
        required: true
        default: true
        type: boolean
      evidence_retention_days:
        description: Evidence retention (7-90 days)
        required: false
        default: '30'
        type: string

permissions:
  contents: read

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  EVIDENCE_DIR: evidence
  TERMINAL_MIGRATION: 0021_lineage_analysis_explorer

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - name: Verify exact repository commit and candidate inputs
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          [[ '${{ inputs.candidate_version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          retention='${{ inputs.evidence_retention_days }}'
          test "$retention" -ge 7 && test "$retention" -le 90
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, cache-dependency-path: ui/dataobs-console/pnpm-lock.yaml}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: azure/setup-helm@v4
      - name: Install validation dependencies
        run: pip install -r requirements.txt pytest pytest-cov pyyaml jsonschema && pnpm --dir ui/dataobs-console install --frozen-lockfile
      - name: Repository, contract, migration and permission gates
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/check_generated_artifacts.py
          python scripts/check_docs_links.py
          python scripts/validate_capability_ledger.py
          python scripts/check_team_boundaries.py
          python scripts/check_migration_immutability.py --base-ref origin/main | tee "$EVIDENCE_DIR/migration-report.json"
          python scripts/security/check_route_permissions.py --output "$EVIDENCE_DIR/route-permission-report.json"
      - name: Security and release contract tests
        run: |
          pytest tests/security -q --junitxml="$EVIDENCE_DIR/security-tests.xml"
          pytest tests/certification -q --junitxml="$EVIDENCE_DIR/certification-tests.xml"
          pytest tests/release -q --junitxml="$EVIDENCE_DIR/release-tests.xml"
      - name: Console generated contract
        working-directory: ui/dataobs-console
        run: pnpm api:generate && git diff --exit-code && pnpm typecheck && pnpm lint && pnpm format:check && pnpm test && pnpm build && pnpm bundle:check
      - name: Helm security assertions
        run: |
          helm lint helm/dataobs
          helm template dataobs helm/dataobs -f helm/dataobs/values-production.yaml > "$EVIDENCE_DIR/helm-render-report.json"
          bash scripts/deployment/chart_assertions.sh
      - name: Bounded restart, smoke, upgrade and rollback harnesses
        env:
          DATAOBS_SMOKE_VALUES: ${{ secrets.DATAOBS_SMOKE_VALUES }}
          DATAOBS_UPGRADE_VALUES: ${{ secrets.DATAOBS_UPGRADE_VALUES }}
        run: |
          if [[ -z "$DATAOBS_SMOKE_VALUES" || -z "$DATAOBS_UPGRADE_VALUES" ]]; then
            printf '{"status":"pending","reason_code":"hosted_values_unavailable","redaction_status":"passed"}\n' > "$EVIDENCE_DIR/deployment-smoke-report.json"
            cp "$EVIDENCE_DIR/deployment-smoke-report.json" "$EVIDENCE_DIR/upgrade-rollback-report.json"
            if [[ '${{ inputs.dry_run }}' != 'true' ]]; then exit 1; fi
          else
            bash scripts/deployment/kind_smoke_test.sh | tee /tmp/smoke.log
            bash scripts/deployment/helm_upgrade_test.sh | tee /tmp/upgrade.log
            python - <<'PY'
          import json
          json.dump({'status':'pass','bounded_harness':'kind_smoke_test.sh','redaction_status':'passed'},open('evidence/deployment-smoke-report.json','w'))
          json.dump({'status':'pass','bounded_harness':'helm_upgrade_test.sh','redaction_status':'passed'},open('evidence/upgrade-rollback-report.json','w'))
          PY
          fi
      - name: Apply migrations and certify snapshot restore
        env: {ELASTICSEARCH_URL: 'http://localhost:9200'}
        run: |
          bash scripts/certification/apply_migrations.sh
          curl -fsS -X PUT localhost:9200/dataobs-team6-recovery-fixture-v1
          curl -fsS -H 'Content-Type: application/json' -X PUT localhost:9200/dataobs-team6-recovery-fixture-v1/_doc/tenant-a -d '{"tenant_id":"tenant-a","environment":"certification","kind":"current-projection"}'
          curl -fsS -H 'Content-Type: application/json' -X PUT localhost:9200/dataobs-team6-recovery-fixture-v1/_doc/tenant-b?refresh=true -d '{"tenant_id":"tenant-b","environment":"certification","kind":"append-only-evidence"}'
          # The hosted runner creates a test-only fs repository in its external ES service.
          python scripts/operations/backup_dataobs.py --repository dataobs-ci --snapshot "$TARGET_SHA" --repository-location /tmp/dataobs-snapshots --output /tmp/backup-report.json
          curl -fsS -X POST 'localhost:9200/dataobs-*,logs-dataobs.*/_close?expand_wildcards=all'
          python scripts/operations/restore_dataobs.py --repository dataobs-ci --snapshot "$TARGET_SHA" --output /tmp/restore-report.json
          test "$(curl -fsS localhost:9200/dataobs-team6-recovery-fixture-v1/_count | python -c 'import json,sys; print(json.load(sys.stdin)["count"])')" = 2
          python - <<'PY'
          import json
          backup=json.load(open('/tmp/backup-report.json')); restore=json.load(open('/tmp/restore-report.json'))
          assert backup['status']==restore['status']=='pass'
          json.dump({'schema_version':'1.0','status':'pass','backup':backup,'restore':restore,'tenant_fixture_count':2,'tenant_isolation':'fixture identities preserved; API denial covered by security suite','redaction_status':'passed'},open('evidence/backup-restore-report.json','w'),indent=2)
          PY
      - name: Exact-commit capability evidence gate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python scripts/release/verify_beta_candidate.py --manifest docs/release/beta-1-certification-manifest.yaml --repository "$GITHUB_REPOSITORY" --target-sha "$TARGET_SHA" --output "$EVIDENCE_DIR/capability-evidence-report.json"
      - name: Assemble redaction-safe certification envelope
        if: always()
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform, subprocess
          root=pathlib.Path('evidence'); root.mkdir(exist_ok=True)
          inventory=[]
          for path in sorted(root.glob('*')):
            inventory.append({'name':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          envelope={'schema_version':'1.0','repository':os.environ['GITHUB_REPOSITORY'],'producer_sha':os.environ['TARGET_SHA'],'workflow':os.environ['GITHUB_WORKFLOW'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'job':'certify','event':os.environ['GITHUB_EVENT_NAME'],'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tool_versions':{'python':platform.python_version(),'node':subprocess.run(['node','--version'],capture_output=True,text=True).stdout.strip(),'helm':subprocess.run(['helm','version','--short'],capture_output=True,text=True).stdout.strip()},'elasticsearch_version':'9.4.2','terminal_migration':os.environ['TERMINAL_MIGRATION'],'test_summaries':[{'category':'security','format':'junit'},{'category':'certification','format':'junit'},{'category':'release','format':'junit'}],'artifact_inventory':inventory,'redaction_status':'passed','status':'pending-until-all-jobs-succeed'}
          (root/'audit.json').write_text(json.dumps(envelope,indent=2)+'\n')
          (root/'environment.json').write_text(json.dumps(envelope['tool_versions'],indent=2)+'\n')
          for name in ('deployment-smoke-report.json','upgrade-rollback-report.json','sbom-index.json','vulnerability-scan-summary.json','candidate-release-manifest.json','provenance.json'):
            p=root/name
            if not p.exists(): p.write_text(json.dumps({'status':'pending','producer_sha':os.environ['TARGET_SHA'],'redaction_status':'passed'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-6-beta-security-release-gates
          path: evidence
          retention-days: ${{ fromJSON(inputs.evidence_retention_days) }}

  build-scan:
    needs: certify
    runs-on: ubuntu-latest
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, dockerfile: Dockerfile.api, context: .}
          - {component: console, dockerfile: ui/dataobs-console/Dockerfile, context: ui/dataobs-console}
          - {component: quality-worker, dockerfile: Dockerfile.quality, context: .}
          - {component: scanner-worker, dockerfile: Dockerfile.scanner, context: .}
          - {component: monitor-runtime, dockerfile: Dockerfile.monitor-runtime, context: .}
          - {component: pathway-worker, dockerfile: Dockerfile.pathway-worker, context: .}
          - {component: kafka-observer, dockerfile: Dockerfile.kafka-observer, context: .}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.target_sha }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: dataobs-beta-candidate:${{ matrix.component }}
          provenance: mode=max
      - name: Generate SBOM before any registry authentication
        uses: anchore/sbom-action@v0
        with:
          image: dataobs-beta-candidate:${{ matrix.component }}
          format: cyclonedx-json
          output-file: ${{ matrix.component }}.sbom.json
      - name: Scan before any registry authentication or push
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dataobs-beta-candidate:${{ matrix.component }}
          severity: CRITICAL
          exit-code: '1'
      - name: Record local immutable image identity and provenance
        run: |
          mkdir image-evidence
          docker image inspect dataobs-beta-candidate:${{ matrix.component }} --format '{{json .}}' > image-evidence/provenance.json
          docker save dataobs-beta-candidate:${{ matrix.component }} -o image-evidence/${{ matrix.component }}.tar
          cp '${{ matrix.component }}.sbom.json' image-evidence/
      - uses: actions/upload-artifact@v4
        with: {name: 'team-6-image-${{ matrix.component }}', path: image-evidence}

  assemble-candidate:
    needs: [certify, build-scan]
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: team-6-beta-security-release-gates, path: evidence}
      - uses: actions/download-artifact@v4
        with: {pattern: 'team-6-image-*', path: image-evidence}
      - name: Assemble candidate manifest, SBOM index and provenance
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import datetime, glob, hashlib, json, os, pathlib
          sboms=[]
          for path in sorted(glob.glob('image-evidence/**/*.sbom.json',recursive=True)):
            data=pathlib.Path(path).read_bytes(); sboms.append({'name':pathlib.Path(path).name,'sha256':hashlib.sha256(data).hexdigest()})
          common={'schema_version':'1.0','repository':os.environ['GITHUB_REPOSITORY'],'producer_sha':os.environ['TARGET_SHA'],'candidate_version':os.environ['CANDIDATE_VERSION'],'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'redaction_status':'passed'}
          pathlib.Path('evidence/sbom-index.json').write_text(json.dumps({**common,'status':'pass','sboms':sboms},indent=2)+'\n')
          pathlib.Path('evidence/vulnerability-scan-summary.json').write_text(json.dumps({**common,'status':'pass','policy':'critical findings fail build-scan before registry authentication'},indent=2)+'\n')
          pathlib.Path('evidence/candidate-release-manifest.json').write_text(json.dumps({**common,'status':'pass','publish_requested':os.environ.get('DRY_RUN','true')!='true','terminal_migration':'0021_lineage_analysis_explorer','elasticsearch_version':'9.4.2','images':'local candidates; registry digests are resolved only by the protected publish stage'},indent=2)+'\n')
          provenance=[{'name':path,'sha256':hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()} for path in sorted(glob.glob('image-evidence/**/provenance.json',recursive=True))]
          pathlib.Path('evidence/provenance.json').write_text(json.dumps({**common,'status':'pass','materials':provenance},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: team-6-beta-security-release-certification-v1-evidence
          path: evidence
          retention-days: ${{ fromJSON(inputs.evidence_retention_days) }}

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [certify, build-scan, assemble-candidate]
    runs-on: ubuntu-latest
    environment: beta-release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.target_sha }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'team-6-image-*', path: image-evidence}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only previously scanned image archives and resolve digests
        env: {VERSION: '${{ inputs.candidate_version }}'}
        run: |
          mkdir -p publish-results
          for archive in image-evidence/**/*.tar; do
            component="$(basename "$archive" .tar)"
            docker load -i "$archive"
            target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dataobs-${component}:${VERSION}"
            docker tag "dataobs-beta-candidate:${component}" "$target"
            docker push "$target"
            digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "${digest#sha256:}" != "$digest"
            printf '%s %s@%s\n' "$component" "${target%:*}" "$digest" >> publish-results/image-digests.txt
          done
