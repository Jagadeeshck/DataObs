name: Team 0 backup restore resilience
on:
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          path.repo: /tmp/dataobs-snapshots
        ports: ['9200:9200']
        options: --health-cmd "curl -fsS http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install canonical backend CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Wait for Elasticsearch readiness
        run: python scripts/ci/wait_for_elasticsearch.py --url http://localhost:9200 --timeout 120
      - name: Real Elasticsearch snapshot and destructive restore proof
        env: {RUN_BETA_BACKUP_RESTORE: '1', ELASTICSEARCH_URL: 'http://localhost:9200', BETA_RESTORE_REPORT: evidence/results/backup-restore.json}
        run: mkdir -p evidence/results && python -m pytest tests/integration/test_beta_backup_restore.py -q --junitxml=evidence/results/backup-restore.xml
      - run: |
          python scripts/certification/write_evidence_envelope.py --output evidence/evidence.json \
            --repository "$GITHUB_REPOSITORY" --producer-sha "$GITHUB_SHA" --workflow-file beta-backup-restore.yml \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" --status pass --test-category backup --test-category restore \
            --test-category tenant-isolation --supporting-file evidence/results/backup-restore.xml \
            --supporting-file evidence/results/backup-restore.json --tool-version "python=$(python --version | cut -d' ' -f2)"
      - uses: actions/upload-artifact@v4
        with: {name: team-0-backup-restore-v1-evidence, path: evidence, retention-days: 30}
