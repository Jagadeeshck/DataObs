name: Team 0 deployment packaging
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pyyaml jsonschema
      - run: python -m compileall -q scripts && python -m json.tool helm/dataobs/values.schema.json >/dev/null && python -m json.tool docs/release/dataobs-release-manifest.schema.json >/dev/null
      - run: helm lint helm/dataobs
      - run: for f in values.yaml values-minimal.yaml values-production.yaml values-external-otel.yaml values-development.yaml; do helm template dataobs helm/dataobs -f helm/dataobs/$f >/tmp/$f.rendered; done
      - run: bash scripts/deployment/chart_assertions.sh
      - run: python scripts/release/render_helm_values.py --manifest docs/release/dataobs-release-manifest.example.json --output /tmp/release-values.yaml && grep -q '@' <(helm template dataobs helm/dataobs -f /tmp/release-values.yaml)
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - name: Kind smoke (explicitly not passed when unavailable)
        run: bash scripts/deployment/kind_smoke_test.sh
        env: {DATAOBS_SMOKE_VALUES: '${{ secrets.DATAOBS_SMOKE_VALUES }}'}
      - name: Upgrade and rollback
        run: bash scripts/deployment/helm_upgrade_test.sh
        env: {DATAOBS_UPGRADE_VALUES: '${{ secrets.DATAOBS_UPGRADE_VALUES }}'}
      - name: Generate exact-commit evidence
        run: |
          mkdir -p evidence
          python scripts/certification/write_evidence_envelope.py --output evidence/evidence.json \
            --repository "$GITHUB_REPOSITORY" --producer-sha "$GITHUB_SHA" --workflow-file beta-deployment-packaging.yml \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
            --status pass --test-category helm --test-category kind --test-category upgrade --test-category rollback \
            --tool-version "python=$(python --version | cut -d' ' -f2)" --tool-version "helm=$(helm version --short)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: team-0-deployment-packaging-evidence, path: evidence, retention-days: 30}
  independent-verification:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: team-0-deployment-packaging-evidence, path: evidence}
      - run: python -c "import json; d=json.load(open('evidence/evidence.json')); assert d['producer_sha']=='${{ github.sha }}'; assert d['workflow_run_attempt']=='${{ github.run_attempt }}'; assert d['schema_version']=='1.0'; print('independently verified exact commit')"
