name: Team 0 deployment packaging
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: azure/setup-helm@v4
        with: {version: v3.18.6}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pyyaml jsonschema
      - run: python -m compileall -q scripts && python -m json.tool helm/dataobs/values.schema.json >/dev/null && python -m json.tool docs/release/dataobs-release-manifest.schema.json >/dev/null
      - name: Create non-publishable structural digest overrides
        run: python scripts/deployment/write_structural_digest_values.py --output /tmp/structural-digests.yaml
      - name: Helm lint against the certified Kubernetes target
        run: set -o pipefail; mkdir -p gate0-packaging-evidence && helm lint helm/dataobs --kube-version 1.30.0 -f helm/dataobs/values-production.yaml -f /tmp/structural-digests.yaml 2>&1 | tee gate0-packaging-evidence/helm-lint.log
      - name: Render every supported values profile
        run: |
          helm template dataobs helm/dataobs --kube-version 1.30.0 -f helm/dataobs/values-production.yaml -f /tmp/structural-digests.yaml >/tmp/values-production.yaml.rendered
          helm template dataobs helm/dataobs --kube-version 1.30.0 -f helm/dataobs/values-production.yaml -f /tmp/structural-digests.yaml -f helm/dataobs/values-minimal.yaml >/tmp/values-minimal.yaml.rendered
          helm template dataobs helm/dataobs --kube-version 1.30.0 -f helm/dataobs/values-production.yaml -f /tmp/structural-digests.yaml -f helm/dataobs/values-external-otel.yaml >/tmp/values-external-otel.yaml.rendered
          helm template dataobs helm/dataobs --kube-version 1.30.0 -f helm/dataobs/values-development.yaml >/tmp/values-development.yaml.rendered
      - run: bash scripts/deployment/chart_assertions.sh
      - name: Validate release-manifest Helm values shape
        run: |
          python scripts/release/render_helm_values.py --manifest docs/release/dataobs-release-manifest.example.json --output /tmp/release-values.yaml
          grep -q '@' <(helm template dataobs helm/dataobs --kube-version 1.30.0 -f /tmp/release-values.yaml -f /tmp/structural-digests.yaml)
      - name: Verify released migration immutability
        run: |
          set -o pipefail
          printf 'head_sha=%s\n' "$(git rev-parse HEAD)" | tee gate0-packaging-evidence/migration-base.txt
          python scripts/check_migration_immutability.py --base-ref "$(python scripts/resolve_ci_base.py 2> >(tee gate0-packaging-evidence/migration-base-error.log >&2))" 2>&1 | tee gate0-packaging-evidence/migration-immutability.log
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - name: Prepare disposable exact-SHA Kind images and Elasticsearch
        run: bash scripts/deployment/prepare_gate0_kind.sh
      - name: Kind smoke (explicitly not passed when unavailable)
        run: set -o pipefail; bash scripts/deployment/kind_smoke_test.sh 2>&1 | tee gate0-packaging-evidence/kind-smoke.log
        env:
          DATAOBS_KIND_DIAGNOSTICS: gate0-packaging-evidence/kind-diagnostics.txt
      - name: Upgrade and rollback
        run: set -o pipefail; bash scripts/deployment/helm_upgrade_test.sh 2>&1 | tee gate0-packaging-evidence/upgrade-rollback.log
      - name: Generate exact-commit evidence
        run: |
          mkdir -p gate0-packaging-evidence
          python scripts/certification/write_evidence_envelope.py --output gate0-packaging-evidence/evidence.json \
            --repository "$GITHUB_REPOSITORY" --producer-sha "$GITHUB_SHA" --workflow-file beta-deployment-packaging.yml \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
            --status pass --test-category helm --test-category kind --test-category upgrade --test-category rollback \
            --supporting-file gate0-packaging-evidence/kind-smoke.log --supporting-file gate0-packaging-evidence/upgrade-rollback.log --supporting-file gate0-packaging-evidence/kind-image-identities.json \
            --tool-version "python=$(python --version | cut -d' ' -f2)" --tool-version "helm=$(helm version --short)"
      - name: Dispose smoke resources
        if: always()
        run: |
          docker logs dataobs-gate0-es > gate0-packaging-evidence/elasticsearch-smoke.log 2>&1 || true
          kind delete cluster --name dataobs-gate0
          docker rm -f dataobs-gate0-es dataobs-gate0-registry || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: team-0-deployment-packaging-evidence, path: gate0-packaging-evidence, retention-days: 30}
  independent-verification:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with: {name: team-0-deployment-packaging-evidence, path: gate0-packaging-evidence}
      - name: Verify downloaded artifacts with canonical verifiers
        run: |
          python scripts/certification/verify_artifacts.py gate0-packaging-evidence --sentinels-only
          python scripts/certification/check_downloaded_envelope.py --directory gate0-packaging-evidence \
            --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --workflow beta-deployment-packaging.yml \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
            --category helm --category kind --category upgrade --category rollback
