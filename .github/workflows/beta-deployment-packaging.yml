name: Beta deployment packaging
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pyyaml jsonschema
      - run: python -m compileall -q scripts && python -m json.tool helm/dataobs/values.schema.json >/dev/null && python -m json.tool docs/release/dataobs-release-manifest.schema.json >/dev/null
      - run: helm lint helm/dataobs
      - run: for f in values.yaml values-minimal.yaml values-production.yaml values-external-otel.yaml values-development.yaml; do helm template dataobs helm/dataobs -f helm/dataobs/$f >/tmp/$f.rendered; done
      - run: bash scripts/deployment/chart_assertions.sh
      - run: python scripts/release/render_helm_values.py --manifest docs/release/dataobs-release-manifest.example.json --output /tmp/release-values.yaml && grep -q '@' <(helm template dataobs helm/dataobs -f /tmp/release-values.yaml)
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - name: Kind smoke (explicitly not passed when unavailable)
        run: bash scripts/deployment/kind_smoke_test.sh
        env: {DATAOBS_SMOKE_VALUES: '${{ secrets.DATAOBS_SMOKE_VALUES }}'}
      - name: Upgrade and rollback
        run: bash scripts/deployment/helm_upgrade_test.sh
        env: {DATAOBS_UPGRADE_VALUES: '${{ secrets.DATAOBS_UPGRADE_VALUES }}'}
      - name: Generate exact-commit evidence
        if: always()
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os, subprocess
          def cmd(x): return subprocess.run(x,shell=True,text=True,capture_output=True).stdout.strip()
          json.dump({'schema_version':'1.0','repository':os.environ['GITHUB_REPOSITORY'],'producer_sha':os.environ['GITHUB_SHA'],'commit_sha':os.environ['GITHUB_SHA'],'base_sha':cmd('git merge-base HEAD origin/main'),'workflow':os.environ['GITHUB_WORKFLOW'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'job':'validate','event':os.environ['GITHUB_EVENT_NAME'],'chart_version':'0.2.0','application_version':'0.2.0','terminal_migration':'0022_aws_data_platform_collector','elasticsearch_version':'9.4.2','tool_versions':{'python':cmd('python --version'),'helm':cmd('helm version --short'),'kubernetes':cmd('kubectl version --client -o json')},'render_results':'see job steps','schema_validation':'passed','redaction_status':'passed','image_pinning':'passed','kind_smoke_test':'see job conclusion; skipped is not passed','upgrade_result':'see job conclusion','rollback_result':'see job conclusion','migration_result':'immutable','test_summaries':[{'category':'helm','status':'see job conclusion'},{'category':'deployment','status':'see job conclusion'}],'artifact_inventory':['evidence.json'],'independent_verification':'pending separate job'},open('evidence/evidence.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: beta-deployment-packaging-evidence, path: evidence, retention-days: 30}
  independent-verification:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: beta-deployment-packaging-evidence, path: evidence}
      - run: python -c "import json; d=json.load(open('evidence/evidence.json')); assert d['producer_sha']=='${{ github.sha }}'; assert d['terminal_migration']=='0022_aws_data_platform_collector'; assert d['schema_version']=='1.0'; print('independently verified exact commit')"
