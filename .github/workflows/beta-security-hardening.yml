name: Beta security hardening
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
        ports: ['9200:9200']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Apply existing migrations
        run: python -m packages.elastic_store.cli apply
        env: {ELASTICSEARCH_URL: 'http://localhost:9200'}
      - name: Security and certification suites
        run: python -m pytest tests/security tests/certification -q --junitxml=security-junit.xml
      - run: python scripts/security/check_route_permissions.py
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - name: Console OIDC checks
        run: corepack enable && pnpm --dir ui/dataobs-console install --frozen-lockfile && pnpm --dir ui/dataobs-console test
      - name: Helm security render
        run: helm lint helm/dataobs && helm template dataobs helm/dataobs --values helm/dataobs/values-production.yaml > rendered.yaml
      - name: Secret scan
        run: '! grep -RInE "Bearer[[:space:]]+[A-Za-z0-9._-]+|client_secret:[[:space:]]+[^{$\"]|private_key:[[:space:]]+[^{$\"]" tests docs helm/dataobs --exclude-dir=node_modules'
      - name: Exact-commit evidence
        run: |
          mkdir -p beta-security-hardening-evidence
