name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Lint & validate configuration files
  # ---------------------------------------------------------------------------
  validate-configs:
    name: Validate configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Grafana Alloy: install binary ----------------------------------------
      # The official zip contains a single binary named alloy-linux-amd64.
      - name: Install Grafana Alloy
        run: |
          ALLOY_VERSION="v1.8.1"
          curl -fsSL \
            "https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}/alloy-linux-amd64.zip" \
            -o alloy.zip
          unzip -q alloy.zip
          chmod +x alloy-linux-amd64
          sudo mv alloy-linux-amd64 /usr/local/bin/alloy
          alloy --version

      # -- Alloy config: formatting check ----------------------------------------
      # `alloy fmt --test` exits non-zero if the file would be reformatted,
      # which also catches any syntax errors in the River/Alloy config language.
      - name: Validate Alloy config -- fmt check
        run: |
          echo "--- alloy fmt --test (syntax + formatting) ---"
          alloy fmt --test integrations/grafana-alloy/alloy/config.alloy
          echo "Alloy fmt OK"


      # -- YAML lint -------------------------------------------------------------
      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: YAML lint -- OTel collector configs
        run: |
          yamllint -d relaxed config/otel-collector-config.yaml
          yamllint -d relaxed config/otel-ec2-agent-config.yaml
          yamllint -d relaxed integrations/grafana-alloy/grafana/provisioning/datasources/datasources.yaml
          echo "All YAML configs OK"

      # -- docker-compose validation ---------------------------------------------
      # docker compose v2 is pre-installed on ubuntu-latest runners (no pip needed).
      # `docker compose config` parses, resolves anchors, and substitutes env vars.
      # We suppress "variable is not set" warnings for optional .env vars (normal in CI).
      - name: Validate root docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config 2>&1 \
            | grep -v "variable is not set\|is not set\|has no default" \
            | head -30 || true
          echo "Root docker-compose.yml structure OK"

      - name: Validate Alloy integration docker-compose.yml
        run: |
          docker compose -f integrations/grafana-alloy/docker-compose.yml config 2>&1 \
            | grep -v "variable is not set\|is not set\|has no default" \
            | head -30 || true
          echo "Alloy docker-compose.yml structure OK"

      # -- Grafana dashboard JSON lint -------------------------------------------
      - name: Validate Grafana dashboard JSON
        run: |
          python3 -c "
          import json, glob
          dashboards = glob.glob('integrations/grafana-alloy/grafana/provisioning/dashboards/*.json')
          for path in dashboards:
              with open(path) as f:
                  json.load(f)
              print(f'OK: {path}')
          if not dashboards:
              print('No dashboard JSON files found')
          "

      # -- Python syntax check ---------------------------------------------------
      - name: Python syntax check
        run: |
          python3 -m py_compile integrations/grafana-alloy/app/app.py
          python3 -m py_compile src/api/main.py
          echo "Python syntax OK"

  # ---------------------------------------------------------------------------
  # Job 2: Python tests (existing DataObs test suite)
  # ---------------------------------------------------------------------------
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # Match the python:3.11-slim base used in Dockerfile.api / Dockerfile.quality
          # to avoid version-specific dependency surprises.
          python-version: "3.11"
          cache: pip

      - name: Install root dependencies
        run: |
          pip install -r requirements.txt
          # pytest is not in requirements.txt -- install explicitly
          pip install pytest

      - name: Install OTel app dependencies
        run: pip install -r integrations/grafana-alloy/app/requirements.txt

      - name: Run DataObs test suite
        run: python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: Build Docker images
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dataobs-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: dataobs/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build dataobs-quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.quality
          push: false
          tags: dataobs/quality:${{ github.sha }}
          cache-from: type=gha,scope=quality
          cache-to: type=gha,mode=max,scope=quality

      - name: Build sample-python-app image
        uses: docker/build-push-action@v6
        with:
          context: integrations/grafana-alloy/app
          file: integrations/grafana-alloy/app/Dockerfile
          push: false
          tags: dataobs/sample-python-app:${{ github.sha }}
          cache-from: type=gha,scope=sample-app
          cache-to: type=gha,mode=max,scope=sample-app

      # Note: build-push-action with push:false/load:false builds into the
      # buildx cache only and does not populate the local docker image store.
      # We report cache hit confirmation instead of docker images output.
      - name: Report build completion
        run: |
          echo "All three images built and cached successfully:"
          echo "  dataobs/api:${{ github.sha }}"
          echo "  dataobs/quality:${{ github.sha }}"
          echo "  dataobs/sample-python-app:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Job 4: Security scan (Trivy) -- main branch only
  #
  # Pipeline:
  #   1. Build image (fast via GHA layer cache)
  #   2. Trivy -> JSON  (machine-readable, parsed for CVE details)
  #   3. Trivy -> table (human-readable summary in Actions log)
  #   4. Trivy -> SARIF (uploaded to GitHub Security / Code Scanning tab)
  #   5. Python script parses JSON, extracts CRITICALs, builds issue body
  #   6a. CRITICALs found  -> open or comment on existing GitHub Issue
  #   6b. No CRITICALs     -> auto-close the open issue (if any)
  #
  # Permissions used (GITHUB_TOKEN -- no extra secrets needed):
  #   issues: write          -- create / close / comment on CVE issue
  #   security-events: write -- upload SARIF to Code Scanning
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      issues: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- 1. Rebuild image (fast via GHA cache) ---------------------------------
      - name: Build sample-python-app for scanning
        uses: docker/build-push-action@v6
        with:
          context: integrations/grafana-alloy/app
          file: integrations/grafana-alloy/app/Dockerfile
          push: false
          load: true
          tags: dataobs/sample-python-app:scan
          cache-from: type=gha,scope=sample-app

      # -- 2. Trivy scan -> JSON (primary, machine-readable) ---------------------
      # Pinned to 0.35.0 (2026-03). Update intentionally — do not use @master.
      - name: Run Trivy scan -- JSON output
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/sample-python-app:scan
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # -- 3. Trivy scan -> table (visible in the Actions log) ------------------
      - name: Run Trivy scan -- table summary
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/sample-python-app:scan
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # -- 4. Trivy scan -> SARIF (GitHub Security tab) -------------------------
      - name: Run Trivy scan -- SARIF output
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/sample-python-app:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # continue-on-error: SARIF upload requires GitHub Advanced Security (GHAS)
        # or a public repo. On private repos without GHAS this returns 403/404.
        # The rest of the scan (table log, JSON parse, auto-issue) still runs.
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # -- 5. Parse JSON and build issue body ------------------------------------
      - name: Parse Trivy JSON and generate issue body
        id: parse
        run: |
          python3 << 'PYEOF'
          import json, os, sys, textwrap

          with open("trivy-results.json") as f:
              data = json.load(f)

          criticals = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []) or []:
                  if vuln.get("Severity") == "CRITICAL":
                      criticals.append({
                          "pkg":       vuln.get("PkgName", "unknown"),
                          "cve":       vuln.get("VulnerabilityID", "unknown"),
                          "installed": vuln.get("InstalledVersion", "-"),
                          "fixed":     vuln.get("FixedVersion", "no fix"),
                          "title":     vuln.get("Title", "").replace("|", "\\|")[:90],
                          "url":       vuln.get("PrimaryURL", ""),
                      })

          count = len(criticals)
          print(f"CRITICAL CVE count: {count}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"critical_count={count}\n")

          if count == 0:
              print("No CRITICAL CVEs found.")
              sys.exit(0)

          sha       = os.environ.get("GITHUB_SHA", "unknown")[:10]
          run_id    = os.environ.get("GITHUB_RUN_ID", "")
          repo      = os.environ.get("GITHUB_REPOSITORY", "")
          run_url   = f"https://github.com/{repo}/actions/runs/{run_id}"
          commit_url = f"https://github.com/{repo}/commit/{sha}"

          rows = "\n".join(
              f"| `{v['pkg']}` | [{v['cve']}]({v['url']}) | `{v['installed']}` | `{v['fixed']}` | {v['title']} |"
              if v["url"] else
              f"| `{v['pkg']}` | {v['cve']} | `{v['installed']}` | `{v['fixed']}` | {v['title']} |"
              for v in criticals
          )

          body = textwrap.dedent(f"""\
          ## :rotating_light: CRITICAL CVEs detected by Trivy

          **Image:** `dataobs/sample-python-app`
          **Commit:** [{sha}]({commit_url})
          **CI run:** [View full scan log]({run_url})
          **Unfixed vulnerabilities excluded:** yes

          ### CRITICAL vulnerabilities ({count} found)

          | Package | CVE | Installed | Fixed In | Description |
          |---------|-----|-----------|----------|-------------|
          {rows}

          ### Recommended actions
          1. Update the base image in `integrations/grafana-alloy/app/Dockerfile`.
          2. Pin affected packages to their fixed version in `requirements.txt`.
          3. Re-run CI -- this issue will be **automatically closed** when no CRITICALs remain.

          ---
          *Opened automatically by the [CI security-scan job]({run_url}).
          Tool: Trivy (aquasecurity/trivy-action@0.35.0).*
          """)

          with open("issue-body.md", "w") as f:
              f.write(body)

          print("Issue body written to issue-body.md")
          PYEOF

      # -- 6a. Open / update GitHub Issue when CRITICALs are found --------------
      - name: Create or update GitHub Issue for CRITICAL CVEs
        if: steps.parse.outputs.critical_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          LABEL="security:critical-cve"
          TITLE="CRITICAL CVEs detected in sample-python-app image"

          # Ensure label exists (idempotent)
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Automatically opened by Trivy security scan" \
            --repo "$REPO" 2>/dev/null || true

          # Check for an existing open issue with this label
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Existing open issue #$EXISTING -- adding comment"
            gh issue comment "$EXISTING" \
              --repo "$REPO" \
              --body-file issue-body.md
          else
            echo "Creating new CVE issue"
            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body-file issue-body.md \
              --label "$LABEL" \
              --assignee "@me"
          fi

      # -- 6b. Auto-close issue when CRITICALs are resolved --------------------
      - name: Auto-close CVE issue if no CRITICALs remain
        if: steps.parse.outputs.critical_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.sha }}
        run: |
          LABEL="security:critical-cve"
          SHA_SHORT="${SHA:0:10}"

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --repo "$REPO" \
              --comment "No CRITICAL CVEs detected in scan for commit \`${SHA_SHORT}\`. Auto-closing."
            echo "Issue #$EXISTING closed"
          else
            echo "No open CVE issue -- all clear"
          fi
