name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & validate configuration files
  # ─────────────────────────────────────────────────────────────────────────────
  validate-configs:
    name: Validate configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Grafana Alloy config syntax check ─────────────────────────────────────
      - name: Install Grafana Alloy
        run: |
          ALLOY_VERSION="v1.8.1"
          curl -fsSL \
            "https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}/alloy-linux-amd64.zip" \
            -o alloy.zip
          unzip -q alloy.zip
          chmod +x alloy-linux-amd64
          sudo mv alloy-linux-amd64 /usr/local/bin/alloy
          alloy --version

      - name: Validate Alloy config syntax
        run: |
          echo "── Checking integrations/grafana-alloy/alloy/config.alloy ──"
          alloy fmt --write=false integrations/grafana-alloy/alloy/config.alloy
          echo "Alloy config syntax OK"

      # ── YAML lint ─────────────────────────────────────────────────────────────
      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: YAML lint — OTel collector configs
        run: |
          yamllint -d relaxed config/otel-collector-config.yaml
          yamllint -d relaxed config/otel-ec2-agent-config.yaml
          yamllint -d relaxed integrations/grafana-alloy/grafana/provisioning/datasources/datasources.yaml
          echo "All YAML configs OK"

      # ── Validate docker-compose files ─────────────────────────────────────────
      - name: Install docker-compose validate tool
        run: pip install --quiet docker-compose

      - name: Validate root docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config --quiet 2>&1 | head -5 || true
          echo "Root docker-compose.yml validated"

      - name: Validate Alloy integration docker-compose.yml
        run: |
          docker compose -f integrations/grafana-alloy/docker-compose.yml config --quiet 2>&1 | head -5 || true
          echo "Alloy docker-compose.yml validated"

      # ── Dashboard JSON lint ───────────────────────────────────────────────────
      - name: Validate Grafana dashboard JSON
        run: |
          python3 -c "
          import json, glob
          dashboards = glob.glob('integrations/grafana-alloy/grafana/provisioning/dashboards/*.json')
          for path in dashboards:
              with open(path) as f:
                  json.load(f)
              print(f'OK: {path}')
          if not dashboards:
              print('No dashboard JSON files found')
          "

      # ── Python syntax check ───────────────────────────────────────────────────
      - name: Python syntax check
        run: |
          python3 -m py_compile integrations/grafana-alloy/app/app.py
          python3 -m py_compile src/api/main.py
          echo "Python syntax OK"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Python tests (existing DataObs test suite)
  # ─────────────────────────────────────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root dependencies
        run: pip install -r requirements.txt

      - name: Install OTel app dependencies
        run: pip install -r integrations/grafana-alloy/app/requirements.txt

      - name: Run DataObs test suite
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Docker images
  # ─────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dataobs-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: dataobs/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build dataobs-quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.quality
          push: false
          tags: dataobs/quality:${{ github.sha }}
          cache-from: type=gha,scope=quality
          cache-to: type=gha,mode=max,scope=quality

      - name: Build sample-python-app image
        uses: docker/build-push-action@v6
        with:
          context: integrations/grafana-alloy/app
          file: integrations/grafana-alloy/app/Dockerfile
          push: false
          tags: dataobs/sample-python-app:${{ github.sha }}
          cache-from: type=gha,scope=sample-app
          cache-to: type=gha,mode=max,scope=sample-app

      - name: Report built image sizes
        run: docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep dataobs

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Security scan (Trivy) — runs on main branch only
  #
  # Pipeline:
  #   1. Build image (fast — GHA cache hit)
  #   2. Run Trivy → JSON output  (parseable, full detail)
  #   3. Run Trivy → table output (human-readable summary in logs)
  #   4. Run Trivy → SARIF output (uploaded to GitHub Security tab)
  #   5. Parse JSON → extract CRITICAL CVEs
  #   6. If CRITICALs found → open / update a GitHub Issue with full detail table
  #
  # Permissions needed:
  #   issues: write        — to create/update the CVE issue
  #   security-events: write — to upload SARIF to Code Scanning
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      issues: write
      security-events: write   # GitHub Code Scanning / SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 1. Rebuild image (fast via GHA cache) ─────────────────────────────────
      - name: Build sample-python-app for scanning
        uses: docker/build-push-action@v6
        with:
          context: integrations/grafana-alloy/app
          file: integrations/grafana-alloy/app/Dockerfile
          push: false
          load: true
          tags: dataobs/sample-python-app:scan
          cache-from: type=gha,scope=sample-app

      # ── 2. Trivy scan → JSON (primary, machine-readable) ─────────────────────
      - name: Run Trivy scan — JSON output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dataobs/sample-python-app:scan
          format: json
          output: trivy-results.json
          exit-code: "0"           # never fail the step — we handle logic below
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # ── 3. Trivy scan → table (visible in the Actions log) ───────────────────
      - name: Run Trivy scan — table summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dataobs/sample-python-app:scan
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # ── 4. Trivy scan → SARIF (uploaded to GitHub Security tab) ──────────────
      - name: Run Trivy scan — SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dataobs/sample-python-app:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # ── 5. Parse JSON — count CRITICALs, build issue body ────────────────────
      - name: Parse Trivy JSON and generate issue body
        id: parse
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          with open("trivy-results.json") as f:
              data = json.load(f)

          criticals = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []) or []:
                  if vuln.get("Severity") == "CRITICAL":
                      criticals.append({
                          "pkg":        vuln.get("PkgName", "unknown"),
                          "cve":        vuln.get("VulnerabilityID", "unknown"),
                          "installed":  vuln.get("InstalledVersion", "—"),
                          "fixed":      vuln.get("FixedVersion", "no fix"),
                          "title":      vuln.get("Title", "").replace("|", "\\|")[:90],
                          "url":        vuln.get("PrimaryURL", ""),
                          "target":     result.get("Target", ""),
                      })

          count = len(criticals)
          print(f"CRITICAL CVE count: {count}")

          # Write count so next step can gate on it
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"critical_count={count}\n")

          if count == 0:
              print("No CRITICAL CVEs found — skipping issue creation.")
              sys.exit(0)

          # Build markdown issue body
          sha        = os.environ.get("GITHUB_SHA", "unknown")[:10]
          run_id     = os.environ.get("GITHUB_RUN_ID", "")
          repo       = os.environ.get("GITHUB_REPOSITORY", "")
          run_url    = f"https://github.com/{repo}/actions/runs/{run_id}"
          commit_url = f"https://github.com/{repo}/commit/{sha}"

          body = f"""## :rotating_light: CRITICAL CVEs detected by Trivy

          **Image:** `dataobs/sample-python-app`
          **Commit:** [{sha}]({commit_url})
          **CI run:** [View full scan log]({run_url})
          **Unfixed vulnerabilities excluded:** yes

          ### CRITICAL vulnerabilities ({count} found)

          | Package | CVE | Installed | Fixed In | Description |
          |---------|-----|-----------|----------|-------------|
          """

          for v in criticals:
              cve_link = f"[{v['cve']}]({v['url']})" if v["url"] else v["cve"]
              body += f"| `{v['pkg']}` | {cve_link} | `{v['installed']}` | `{v['fixed']}` | {v['title']} |\n"

          body += f"""
          ### Recommended actions
          1. Update the base image in `integrations/grafana-alloy/app/Dockerfile` to the latest patch.
          2. Pin affected packages to the fixed version in `requirements.txt`.
          3. Re-run CI — this issue will be **automatically closed** once no CRITICALs remain.

          ---
          *Opened automatically by the [CI security-scan job]({run_url}).
          Trivy version: latest (aquasecurity/trivy-action@master).*
          """

          # Dedent (strip leading spaces from heredoc indentation)
          import textwrap
          body = textwrap.dedent(body)

          with open("issue-body.md", "w") as f:
              f.write(body)

          print("Issue body written to issue-body.md")
          PYEOF

      # ── 6a. Open or update GitHub Issue when CRITICALs are found ─────────────
      #
      # Strategy:
      #   - Search for an existing open issue with the label "security:critical-cve"
      #   - If one exists → add a comment with the new scan results (avoids duplicates)
      #   - If none exists → create a fresh issue
      #   - If CRITICALs are GONE on a subsequent run → close the issue automatically
      #
      - name: Create or update GitHub Issue for CRITICAL CVEs
        if: steps.parse.outputs.critical_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          COUNT:    ${{ steps.parse.outputs.critical_count }}
          SHA:      ${{ github.sha }}
        run: |
          LABEL="security:critical-cve"
          TITLE="🚨 CRITICAL CVEs detected in sample-python-app image"

          # Ensure label exists (idempotent — gh ignores "already exists" exit code)
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Automatically opened by Trivy security scan" \
            --repo "$REPO" 2>/dev/null || true

          # Check for an existing open issue with this label
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Found existing open issue #$EXISTING — adding comment with new scan results"
            gh issue comment "$EXISTING" \
              --repo "$REPO" \
              --body-file issue-body.md
            echo "Comment added to issue #$EXISTING"
          else
            echo "No open CVE issue found — creating new issue"
            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body-file issue-body.md \
              --label "$LABEL" \
              --assignee "@me"
            echo "New issue created"
          fi

      # ── 6b. Auto-close the issue if CRITICALs are now resolved ───────────────
      - name: Auto-close CVE issue if no CRITICALs remain
        if: steps.parse.outputs.critical_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.sha }}
        run: |
          LABEL="security:critical-cve"
          SHA_SHORT="${SHA:0:10}"

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "No CRITICALs found — closing issue #$EXISTING"
            gh issue close "$EXISTING" \
              --repo "$REPO" \
              --comment "✅ No CRITICAL CVEs detected in scan for commit \`${SHA_SHORT}\`. Auto-closing this issue."
            echo "Issue #$EXISTING closed"
          else
            echo "No open CVE issue to close — all clear"
          fi
