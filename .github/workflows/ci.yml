  certification-browser:
    name: Certification browser
    needs: [certification-contracts]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.certification_scope == 'all' || inputs.certification_scope == 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with: {node-version: "24.15.0", cache: pnpm, cache-dependency-path: ui/dataobs-console/pnpm-lock.yaml}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: cd ui/dataobs-console && pnpm install --frozen-lockfile && pnpm api:generate && pnpm typecheck && pnpm lint && pnpm format:check && pnpm test && pnpm build && pnpm bundle:check
      - name: Start production Console stack
        run: CERTIFICATION_PROFILE=cert-browser ./scripts/certification/compose.sh up
      - name: Apply and verify released migrations
        run: |
          ./scripts/certification/apply_migrations.sh
          ./bin/dataobs elastic status
          curl -fsS http://127.0.0.1:19200/_mapping >/dev/null
          curl -fsS http://127.0.0.1:19200/_alias >/dev/null
      - name: Run browser live assertions
        run: ./scripts/certification/run_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser, path: "ui/dataobs-console/playwright-report\nui/dataobs-console/test-results", retention-days: 30}
      - if: always()
        run: ./scripts/certification/compose.sh down

  certification-summary:
    name: Certification summary
    runs-on: ubuntu-latest
    if: always()
    needs: [certification-contracts, certification-migrations-incidents, certification-postgres, certification-kafka, certification-openlineage-product, certification-browser, certification-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate requested scope and job results
        env:
          REQUESTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.certification_scope || 'all' }}
          JOB_RESULTS: '{"contracts":"${{ needs.certification-contracts.result }}","migrations-incidents":"${{ needs.certification-migrations-incidents.result }}","postgres":"${{ needs.certification-postgres.result }}","kafka":"${{ needs.certification-kafka.result }}","openlineage-product":"${{ needs.certification-openlineage-product.result }}","browser":"${{ needs.certification-browser.result }}","security":"${{ needs.certification-security.result }}"}'
        run: |
          python scripts/certification/validate_job_results.py "$REQUESTED_SCOPE" "$JOB_RESULTS" | tee artifacts/job-results.json
          python scripts/certification/redact_artifacts.py artifacts
          python scripts/certification/verify_artifacts.py artifacts --sentinels-only
          python scripts/certification/build_manifest.py artifacts
          python scripts/certification/verify_artifacts.py artifacts
      - uses: actions/upload-artifact@v4
        with: {name: certification-summary, path: artifacts, retention-days: 30}
