name: CI

on:
  workflow_dispatch:
    inputs:
      certification_scope:
        description: Focused hosted certification gate
        required: true
        default: all
        type: choice
        options: [all, postgres, kafka, openlineage, product, browser, security]
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-product-membership-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall -q packages/domain_model/data_product.py services/data_products src/api/data_product_routes.py tests/data_products
      - run: python -m pytest tests/data_products/test_membership_dependency_closure.py tests/data_products/test_cursors.py -q
  incident-migration-occ-gate:
    name: Incident migration and OCC gate
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - name: Migration immutability against main
        run: python scripts/check_migration_immutability.py --base-ref HEAD
      - name: Install focused dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff black mypy
      - name: Focused quality checks
        run: |
          python scripts/check_generated_artifacts.py
          python -m compileall -q packages/elastic_store services/incident_manager src/api tests
          ruff check packages/elastic_store services/incident_manager src/api tests/unit/test_incident_occ.py
          black --check packages/elastic_store services/incident_manager src/api tests/unit/test_incident_occ.py
          mypy packages/elastic_store services/incident_manager
      - name: Capture migration plan
        run: |
          python -m packages.elastic_store.cli plan > incident-migration-plan.json
          curl -fsS http://localhost:9200/_mapping > incident-mappings-before.json
      - name: Unit migration and incident tests
        run: python -m pytest tests/elastic_store tests/unit/test_incident_automation.py tests/unit/test_incident_occ.py tests/unit/test_incident_workbench_safety.py -q --junitxml=incident-unit.xml
      - name: Elasticsearch 9.4.2 migration and concurrency tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          python -m pytest tests/integration/incident_migration_occ -q --junitxml=incident-migration-occ.xml | tee concurrency-test-summary.txt
      - name: Capture redacted mapping snapshots
        if: always()
        run: |
          curl -fsS http://localhost:9200/_mapping > incident-mappings-after.json
      - name: Capture redacted Elasticsearch diagnostics on failure
        if: failure()
        run: curl -fsS http://localhost:9200/_cluster/health > incident-elasticsearch-redacted.log
      - name: Upload incident gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-migration-occ-artifacts
          path: |
            incident-migration-plan.json
            incident-mappings-before.json
            incident-mappings-after.json
            incident-unit.xml
            incident-migration-occ.xml
            concurrency-test-summary.txt
            replay-sequence-number-evidence.json
            incident-elasticsearch-redacted.log

  python-quality:
    name: Python quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests ruff black mypy pip-audit types-requests
      - name: Ruff lint
        run: ruff check .
      - name: Black check
        run: black --check .
      - name: Compile Python
        run: python -m compileall -q src packages services integrations tests
      - name: Reject tracked generated dependency and browser artifacts
        run: python scripts/check_generated_artifacts.py
      - name: Type check product foundations
        run: mypy packages/domain_model packages/elastic_store services/collection_manager packages/agent_sdk services/scanner_worker
      - name: Migration plan artifact
        run: python -m packages.elastic_store.cli plan > migration-plan.json
      - name: OpenAPI generation consistency check
        run: |
          python - <<'PYOPENAPI'
          from src.api.app import create_app
          import json
          open('openapi.json','w').write(json.dumps(create_app().openapi(), sort_keys=True, indent=2))
          PYOPENAPI
      - name: JSON schema snapshot check
        run: |
          python - <<'PYSCHEMA'
          from packages.domain_model import Asset, Source, Tenant
          import json, pathlib
          out={'Tenant': Tenant.model_json_schema(), 'Source': Source.model_json_schema(), 'Asset': Asset.model_json_schema()}
          pathlib.Path('domain-schemas.json').write_text(json.dumps(out, sort_keys=True, indent=2))
          PYSCHEMA
      - name: Docs link validation
        run: |
          python - <<'PYDOCS'
          import pathlib, re, sys
          missing=[]
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts: continue
              for link in re.findall(r'\[[^\]]+\]\(([^):#]+)(?:#[^)]+)?\)', md.read_text(errors='ignore')):
                  target=(md.parent/link).resolve()
                  if not target.exists(): missing.append(f'{md}: {link}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          PYDOCS
      - uses: actions/upload-artifact@v4
        with:
          name: migration-plan-and-schemas
          path: |
            migration-plan.json
            openapi.json
            domain-schemas.json
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q --ignore=tests/integration

  docker-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
                      - name: Validate compose files
          env:
            ELASTIC_PASSWORD: ci-placeholder-password
            OPENSEARCH_PASSWORD: ci-placeholder-password
          run: |
            docker compose -f docker-compose.yml config
          docker compose -f docker-compose.certification.yml --profile full config
          docker compose -f docker-compose.poc.yml config
          docker compose -f tests/integration/docker-compose.test.yml config
          docker compose -f integrations/grafana-alloy/docker-compose.yml config

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [python-quality, docker-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests
      - name: Start integration stack
        run: docker compose -f tests/integration/docker-compose.test.yml up -d --build
      - name: Wait for health
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:9200/_cluster/health; do sleep 5; done'
          timeout 180 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 5; done'
      - name: Run integration tests
        run: RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration -q --junitxml=integration-test-results.xml
      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            integration-test-results.xml
            tests/integration/*.yaml
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.test.yml logs --no-color > integration-compose.log
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: integration-compose.log
      - name: Tear down integration stack
        if: always()
        run: docker compose -f tests/integration/docker-compose.test.yml down -v

  postgres-vertical-slice:
    name: PostgreSQL vertical slice completion gate
    runs-on: ubuntu-latest
    needs: [python-quality, docker-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests ruff black mypy pip-audit types-requests
      - name: Focused PostgreSQL and scanner checks
        run: |
          python -m compileall -q services/scanner_worker integrations/databases/postgres tests
          ruff check integrations/databases/postgres services/scanner_worker tests/integration/postgres_vertical_slice
          black --check integrations/databases/postgres services/scanner_worker tests/integration/postgres_vertical_slice
          mypy services/scanner_worker integrations/databases/postgres
      - name: Build API and scanner images
        run: |
          docker build -f Dockerfile.api -t dataobs/api:${{ github.sha }} .
          docker build -f Dockerfile.scanner -t dataobs/scanner:${{ github.sha }} .
      - name: Validate demo compose
        run: docker compose -f docker-compose.postgres-demo.yml config
      - name: Start PostgreSQL vertical slice stack
        run: docker compose -f docker-compose.postgres-demo.yml up -d --build
      - name: Wait for health
        run: |
          timeout 240 bash -c 'until curl -fsS http://localhost:9200/_cluster/health; do sleep 5; done'
          timeout 240 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 5; done'
      - name: Apply and validate migrations
        run: |
          ./bin/dataobs elastic plan
          ./bin/dataobs elastic apply
          ./bin/dataobs elastic status
      - name: Run PostgreSQL vertical slice demo
        run: ./scripts/demo_postgres_vertical_slice.sh
      - name: Run PostgreSQL integration tests
        run: RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration/postgres_vertical_slice -q --junitxml=postgres-vertical-slice.xml
      - name: Validate Kibana saved objects and sentinel secrets
        run: |
          python -m json.tool /tmp/dataobs-connection.json >/dev/null
          python - <<'PY'
          import json, pathlib
          for line in pathlib.Path('kibana/saved_objects/postgres_vertical_slice.ndjson').read_text().splitlines():
              if line.strip(): json.loads(line)
          PY
          ! rg -n 'DATAOBS_SENTINEL_PASSWORD_DO_NOT_PERSIST' /tmp/dataobs-*.json
      - name: Trivy scanner image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/scanner:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Scanner SBOM
        run: trivy image --format cyclonedx --output sbom-scanner.cdx.json dataobs/scanner:${{ github.sha }}
      - name: Capture Compose logs
        if: always()
        run: docker compose -f docker-compose.postgres-demo.yml logs --no-color > postgres-demo.log
      - name: Upload PostgreSQL vertical slice artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-vertical-slice-artifacts
          path: |
            postgres-vertical-slice.xml
            postgres-demo.log
            sbom-scanner.cdx.json
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.postgres-demo.yml down -v

  terraform-helm:
    name: Terraform and Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate roots/modules
        run: |
          for dir in $(find infra/terraform -name '*.tf' -printf '%h\n' | sort -u); do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
      - name: Helm lint
        run: helm lint helm/dataobs
      - name: Helm template
        run: helm template dataobs helm/dataobs

  image-security:
    name: Production image security and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        run: |
          docker build -f Dockerfile.api -t dataobs/api:${{ github.sha }} .
          docker build -f Dockerfile.quality -t dataobs/quality:${{ github.sha }} .
          docker build -f Dockerfile.api -t dataobs/collection-manager:${{ github.sha }} .
          docker build -f Dockerfile.scanner -t dataobs/scanner:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/api:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Scan quality worker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/quality:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Generate SBOMs
        run: |
          trivy image --format cyclonedx --output sbom-api.cdx.json dataobs/api:${{ github.sha }}
          trivy image --format cyclonedx --output sbom-quality.cdx.json dataobs/quality:${{ github.sha }}
          trivy image --format cyclonedx --output sbom-collection-manager.cdx.json
          trivy image --format cyclonedx --output sbom-scanner.cdx.json dataobs/scanner:${{ github.sha }} dataobs/collection-manager:${{ github.sha }}
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: production-image-sboms
          path: sbom-*.cdx.json


  incident-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Validate workflow YAML
        run: ./bin/dataobs workflows validate
      - name: Compile incident automation packages
        run: python -m compileall -q src packages services integrations tests
      - name: Run unit tests
        run: python -m pytest -q --ignore=tests/integration
      - name: Validate compose
        run: docker compose -f docker-compose.incident-automation-demo.yml config
      - name: Sentinel secret scan
                run: 'rg "DATAOBS_SENTINEL_SECRET_DO_NOT_LEAK" --glob "!scripts/demo_incident_automation.sh" && exit 1 || exit 0'

  console-quality:
    name: Console type, test, build and contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with: {node-version: '24.15.0', cache: pnpm, cache-dependency-path: ui/dataobs-console/pnpm-lock.yaml}
      - name: Install from lockfile
        working-directory: ui/dataobs-console
        run: pnpm install --frozen-lockfile
      - name: Generated client drift
        working-directory: ui/dataobs-console
        run: pnpm api:generate && git diff --exit-code src/api/generated/schema.ts
      - name: Console quality gate
        working-directory: ui/dataobs-console
        run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test && pnpm build && pnpm bundle:check
      - name: Dependency audit
        working-directory: ui/dataobs-console
        run: pnpm audit --audit-level high
      - name: Build production image
        run: docker build -t dataobs/console:${{ github.sha }} ui/dataobs-console
      - name: Bundle secret and source-map policy
        run: |
          ! rg -n 'DATAOBS_SENTINEL_PASSWORD_DO_NOT_PERSIST' ui/dataobs-console/dist
          ! find ui/dataobs-console/dist -name '*.map' | grep .

  console-backend-contract:
    name: Console backend contract gate
    runs-on: ubuntu-latest
    needs: [python-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt && pip install pytest
      - name: Migration, isolation and paging contracts
        run: python -m pytest -q tests/elastic_store/test_migrations.py tests/unit/product_query tests/unit/test_pathway_worker_paging.py
      - name: Demo compose contract
        run: docker compose -f docker-compose.console-demo.yml config

  documentation-truth-gate:
    name: Documentation truth gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install documentation dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff black
      - name: Validate and render capability source of truth
        run: |
          python scripts/validate_capability_ledger.py
          python scripts/render_capability_docs.py
          git diff --exit-code
          python scripts/check_generated_artifacts.py
          python scripts/check_docs_links.py
      - name: Documentation truth tests
        run: >-
          python -m pytest
          tests/documentation/test_capability_ledger.py
          tests/documentation/test_generated_capability_docs.py
          tests/documentation/test_product_claims.py -q
      - name: Resolve documentation comparison base
        id: docs-base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: echo "base=$(python scripts/resolve_ci_base.py --event-file "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"
      - name: Migration immutability
        run: python scripts/check_migration_immutability.py --base-ref "${{ steps.docs-base.outputs.base }}"
      - name: Capability diff
        run: python scripts/capability_diff.py --base-ref "${{ steps.docs-base.outputs.base }}" > capability-diff-report.txt
      - name: Upload documentation truth reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-truth-reports
          path: |
            docs/product/feature-matrix.md
            capability-validation-report.json
            capability-state-counts.json
            capability-diff-report.txt
            broken-link-report.txt

  certification-contracts:
    name: Certification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: raven-actions/actionlint@v2
      - run: pip install -r requirements.txt pytest jsonschema pyyaml ruff black
      - name: Validate contracts and certification depth
        run: |
          ./scripts/certification/bootstrap.sh
          source certification/runtime-secrets/compose.env
          export CERTIFICATION_POSTGRES_PASSWORD_FILE
          for profile in cert-migrations cert-postgres cert-kafka cert-jobs cert-product cert-browser cert-security; do docker compose -f docker-compose.certification.yml --profile "$profile" config >/dev/null; done
          python -m pytest tests/certification/test_certification_depth.py tests/certification/test_runtime_contracts.py tests/certification/test_evidence_manifest.py tests/certification/test_capability_promotion.py -q --junitxml=artifacts-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: contracts, path: artifacts-contracts.xml, retention-days: 30}

  certification-migrations-incidents:
    name: Certification migrations and incidents
    needs: [certification-contracts]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.certification_scope == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest requests psycopg[binary] confluent-kafka
      - name: Start focused stack
        run: CERTIFICATION_PROFILE=cert-migrations ./scripts/certification/compose.sh up
      - name: Apply and verify released migrations
        run: |
          ./scripts/certification/apply_migrations.sh
          ./bin/dataobs elastic status
          curl -fsS http://127.0.0.1:19200/_mapping >/dev/null
          curl -fsS http://127.0.0.1:19200/_alias >/dev/null
      - name: Prove migration apply is idempotent
        run: ./scripts/certification/apply_migrations.sh
      - name: Run live assertions
        env:
          RUN_CERTIFICATION_TESTS: "1"
          CERTIFICATION_POSTGRES_DSN: postgresql://dataobs_fixture@127.0.0.1:15432/orders
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
          CONNECT_URL: http://127.0.0.1:18083
          SCHEMA_REGISTRY_URL: http://127.0.0.1:18081
        run: source certification/runtime-secrets/compose.env; export CERTIFICATION_POSTGRES_PASSWORD_FILE; mkdir -p artifacts/migrations-incidents && python -m pytest tests/certification/test_migrations.py tests/certification/test_incidents.py -q --junitxml=artifacts/migrations-incidents/results.xml
      - name: Diagnostics and memory
        if: always()
        run: docker stats --no-stream > artifacts/migrations-incidents/container-memory.txt || true; docker compose -f docker-compose.certification.yml --profile cert-migrations logs --no-color > artifacts/migrations-incidents/redacted.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: migrations-incidents, path: artifacts/migrations-incidents, retention-days: 30}
      - if: always()
        run: ./scripts/certification/compose.sh down

  certification-postgres:
    name: Certification PostgreSQL
    needs: [certification-contracts]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.certification_scope == 'all' || inputs.certification_scope == 'postgres' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest requests psycopg[binary] confluent-kafka
      - name: Start focused stack
        run: CERTIFICATION_PROFILE=cert-postgres ./scripts/certification/compose.sh up
      - name: Apply and verify released migrations
        run: |
          ./scripts/certification/apply_migrations.sh
          ./bin/dataobs elastic status
          curl -fsS http://127.0.0.1:19200/_mapping >/dev/null
          curl -fsS http://127.0.0.1:19200/_alias >/dev/null
      - name: Run live assertions
        env:
          RUN_CERTIFICATION_TESTS: "1"
          CERTIFICATION_POSTGRES_DSN: postgresql://dataobs_fixture@127.0.0.1:15432/orders
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
          CONNECT_URL: http://127.0.0.1:18083
          SCHEMA_REGISTRY_URL: http://127.0.0.1:18081
        run: source certification/runtime-secrets/compose.env; export CERTIFICATION_POSTGRES_PASSWORD_FILE; mkdir -p artifacts/postgres && python -m pytest tests/certification/test_postgres.py -q --junitxml=artifacts/postgres/results.xml
      - name: Diagnostics and memory
        if: always()
        run: docker stats --no-stream > artifacts/postgres/container-memory.txt || true; docker compose -f docker-compose.certification.yml --profile cert-postgres logs --no-color > artifacts/postgres/redacted.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: postgres, path: artifacts/postgres, retention-days: 30}
      - if: always()
        run: ./scripts/certification/compose.sh down

  certification-kafka:
    name: Certification Kafka
    needs: [certification-contracts]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.certification_scope == 'all' || inputs.certification_scope == 'kafka' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest requests psycopg[binary] confluent-kafka
      - name: Start focused stack
        run: CERTIFICATION_PROFILE=cert-kafka ./scripts/certification/compose.sh up
      - name: Apply and verify released migrations
        run: |
          ./scripts/certification/apply_migrations.sh
          ./bin/dataobs elastic status
          curl -fsS http://127.0.0.1:19200/_mapping >/dev/null
          curl -fsS http://127.0.0.1:19200/_alias >/dev/null
      - name: Seed deterministic Kafka fixtures
        run: |
          ./scripts/certification/kafka/create_topics.sh
          ./scripts/certification/kafka/register_schemas.sh
          ./scripts/certification/kafka/create_connectors.sh
          python scripts/certification/kafka/run_producers.py
          python scripts/certification/kafka/run_consumers.py
          ./scripts/certification/wait_for_kafka_observer.sh
      - name: Run live assertions
        env:
          RUN_CERTIFICATION_TESTS: "1"
          CERTIFICATION_POSTGRES_DSN: postgresql://dataobs_fixture@127.0.0.1:15432/orders
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
          CONNECT_URL: http://127.0.0.1:18083
          SCHEMA_REGISTRY_URL: http://127.0.0.1:18081
        run: source certification/runtime-secrets/compose.env; export CERTIFICATION_POSTGRES_PASSWORD_FILE; mkdir -p artifacts/kafka && python -m pytest tests/certification/test_kafka.py tests/certification/test_otel.py -q --junitxml=artifacts/kafka/results.xml
      - name: Diagnostics and memory
        if: always()
        run: docker stats --no-stream > artifacts/kafka/container-memory.txt || true; docker compose -f docker-compose.certification.yml --profile cert-kafka logs --no-color > artifacts/kafka/redacted.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kafka, path: artifacts/kafka, retention-days: 30}
      - if: always()
        run: ./scripts/certification/compose.sh down

