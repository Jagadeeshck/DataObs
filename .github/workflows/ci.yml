name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests ruff black mypy pip-audit types-requests
      - name: Ruff lint
        run: ruff check .
      - name: Black check
        run: black --check .
      - name: Compile Python
        run: python -m compileall -q src packages services integrations tests
      - name: Type check product foundations
        run: mypy packages/domain_model packages/elastic_store services/collection_manager packages/agent_sdk services/scanner_worker
      - name: Migration plan artifact
        run: python -m packages.elastic_store.cli plan > migration-plan.json
      - name: OpenAPI generation consistency check
        run: |
          python - <<'PYOPENAPI'
          from src.api.app import create_app
          import json
          open('openapi.json','w').write(json.dumps(create_app().openapi(), sort_keys=True, indent=2))
          PYOPENAPI
      - name: JSON schema snapshot check
        run: |
          python - <<'PYSCHEMA'
          from packages.domain_model import Asset, Source, Tenant
          import json, pathlib
          out={'Tenant': Tenant.model_json_schema(), 'Source': Source.model_json_schema(), 'Asset': Asset.model_json_schema()}
          pathlib.Path('domain-schemas.json').write_text(json.dumps(out, sort_keys=True, indent=2))
          PYSCHEMA
      - name: Docs link validation
        run: |
          python - <<'PYDOCS'
          import pathlib, re, sys
          missing=[]
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts: continue
              for link in re.findall(r'\[[^\]]+\]\(([^):#]+)(?:#[^)]+)?\)', md.read_text(errors='ignore')):
                  target=(md.parent/link).resolve()
                  if not target.exists(): missing.append(f'{md}: {link}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          PYDOCS
      - uses: actions/upload-artifact@v4
        with:
          name: migration-plan-and-schemas
          path: |
            migration-plan.json
            openapi.json
            domain-schemas.json
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q --ignore=tests/integration

  docker-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.poc.yml config
          docker compose -f tests/integration/docker-compose.test.yml config
          docker compose -f integrations/grafana-alloy/docker-compose.yml config

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [python-quality, docker-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests
      - name: Start integration stack
        run: docker compose -f tests/integration/docker-compose.test.yml up -d --build
      - name: Wait for health
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:9200/_cluster/health; do sleep 5; done'
          timeout 180 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 5; done'
      - name: Run integration tests
        run: RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration -q --junitxml=integration-test-results.xml
      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            integration-test-results.xml
            tests/integration/*.yaml
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.test.yml logs --no-color > integration-compose.log
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: integration-compose.log
      - name: Tear down integration stack
        if: always()
        run: docker compose -f tests/integration/docker-compose.test.yml down -v

  postgres-vertical-slice:
    name: PostgreSQL vertical slice completion gate
    runs-on: ubuntu-latest
    needs: [python-quality, docker-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests ruff black mypy pip-audit types-requests
      - name: Focused PostgreSQL and scanner checks
        run: |
          python -m compileall -q services/scanner_worker integrations/databases/postgres tests
          ruff check integrations/databases/postgres services/scanner_worker tests/integration/postgres_vertical_slice
          black --check integrations/databases/postgres services/scanner_worker tests/integration/postgres_vertical_slice
          mypy services/scanner_worker integrations/databases/postgres || true
      - name: Build API and scanner images
        run: |
          docker build -f Dockerfile.api -t dataobs/api:${{ github.sha }} .
          docker build -f Dockerfile.scanner -t dataobs/scanner:${{ github.sha }} .
      - name: Validate demo compose
        run: docker compose -f docker-compose.postgres-demo.yml config
      - name: Start PostgreSQL vertical slice stack
        run: docker compose -f docker-compose.postgres-demo.yml up -d --build
      - name: Wait for health
        run: |
          timeout 240 bash -c 'until curl -fsS http://localhost:9200/_cluster/health; do sleep 5; done'
          timeout 240 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 5; done'
      - name: Apply and validate migrations
        run: |
          ./bin/dataobs elastic plan
          ./bin/dataobs elastic apply
          ./bin/dataobs elastic status
      - name: Run PostgreSQL vertical slice demo
        run: ./scripts/demo_postgres_vertical_slice.sh
      - name: Run PostgreSQL integration tests
        run: RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration/postgres_vertical_slice -q --junitxml=postgres-vertical-slice.xml
      - name: Validate Kibana saved objects and sentinel secrets
        run: |
          python -m json.tool /tmp/dataobs-connection.json >/dev/null
          python - <<'PY'
          import json, pathlib
          for line in pathlib.Path('kibana/saved_objects/postgres_vertical_slice.ndjson').read_text().splitlines():
              if line.strip(): json.loads(line)
          PY
          ! rg -n 'DATAOBS_SENTINEL_PASSWORD_DO_NOT_PERSIST' /tmp/dataobs-*.json
      - name: Trivy scanner image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/scanner:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Scanner SBOM
        run: trivy image --format cyclonedx --output sbom-scanner.cdx.json dataobs/scanner:${{ github.sha }}
      - name: Capture Compose logs
        if: always()
        run: docker compose -f docker-compose.postgres-demo.yml logs --no-color > postgres-demo.log
      - name: Upload PostgreSQL vertical slice artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-vertical-slice-artifacts
          path: |
            postgres-vertical-slice.xml
            postgres-demo.log
            sbom-scanner.cdx.json
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.postgres-demo.yml down -v

  terraform-helm:
    name: Terraform and Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate roots/modules
        run: |
          for dir in $(find infra/terraform -name '*.tf' -printf '%h\n' | sort -u); do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
      - name: Helm lint
        run: helm lint helm/dataobs
      - name: Helm template
        run: helm template dataobs helm/dataobs

  image-security:
    name: Production image security and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        run: |
          docker build -f Dockerfile.api -t dataobs/api:${{ github.sha }} .
          docker build -f Dockerfile.quality -t dataobs/quality:${{ github.sha }} .
          docker build -f Dockerfile.api -t dataobs/collection-manager:${{ github.sha }} .
          docker build -f Dockerfile.scanner -t dataobs/scanner:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/api:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Scan quality worker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dataobs/quality:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
      - name: Generate SBOMs
        run: |
          trivy image --format cyclonedx --output sbom-api.cdx.json dataobs/api:${{ github.sha }}
          trivy image --format cyclonedx --output sbom-quality.cdx.json dataobs/quality:${{ github.sha }}
          trivy image --format cyclonedx --output sbom-collection-manager.cdx.json
          trivy image --format cyclonedx --output sbom-scanner.cdx.json dataobs/scanner:${{ github.sha }} dataobs/collection-manager:${{ github.sha }}
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: production-image-sboms
          path: sbom-*.cdx.json
