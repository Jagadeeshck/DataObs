name: Data Product runtime implementation gate
on:
  pull_request:
    paths:
      - 'services/data_products/**'
      - 'tests/data_products/**'
      - 'packages/domain_model/data_product.py'
      - 'docs/development/data-product-reconciliation-runtime-closure.md'
      - '.github/workflows/data-product-runtime.yml'
jobs:
  data-product-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - run: python scripts/check_docs_links.py
      - run: ruff check services/data_products tests/data_products
      - run: black --check services/data_products tests/data_products
      - run: mypy services/data_products/reconciliation.py services/data_products/membership_service.py services/data_products/dependency_service.py services/data_products/service.py services/data_products/repository.py services/data_products/memory_repository.py
      - run: python -m pytest tests/data_products/test_membership_service.py tests/data_products/test_dependency_service.py tests/data_products/test_data_product_service.py tests/data_products/test_operation_reconciliation.py -q
  data-product-runtime-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/data_products -q
  data-product-runtime-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [data-product-runtime-contracts, data-product-runtime-unit]
    steps:
      - name: Require runtime jobs
        env:
          CONTRACTS: ${{ needs.data-product-runtime-contracts.result }}
          UNIT: ${{ needs.data-product-runtime-unit.result }}
        run: test "$CONTRACTS" = success && test "$UNIT" = success
