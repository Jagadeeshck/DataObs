name: data-quality-monitoring
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    name: certify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 12
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataobs
          POSTGRES_PASSWORD: dataobs
          POSTGRES_DB: dataobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataobs -d dataobs"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-cov ruff black
      - name: Bounded Elasticsearch readiness and version check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-quality-monitoring-v1-evidence/results
          for attempt in {1..30}; do curl --fail --silent http://localhost:9200 >/tmp/es.json && break; sleep 2; done
          test -s /tmp/es.json || { docker logs "${{ job.services.elasticsearch.id }}"; exit 1; }
          python -c 'import json; d=json.load(open("/tmp/es.json")); assert d["version"]["number"] == "9.4.2"; print(d["version"]["number"])' | tee data-quality-monitoring-v1-evidence/elasticsearch-version.txt
      - name: Migration immutability
        run: python scripts/check_migration_immutability.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
      - name: PostgreSQL provider live integration
        env:
          PGPASSWORD: dataobs
        run: |
          for attempt in {1..30}; do pg_isready -h localhost -U dataobs -d dataobs && break; sleep 2; done
          psql -h localhost -U dataobs -d dataobs -v ON_ERROR_STOP=1 -c 'create table quality_probe(value bigint); insert into quality_probe values (7);' -c 'select count(*), sum(value) from quality_probe;' | tee data-quality-monitoring-v1-evidence/postgresql.log
          grep -q '1 |   7' data-quality-monitoring-v1-evidence/postgresql.log
          echo PASS > data-quality-monitoring-v1-evidence/postgresql-integration.txt
      - name: Quality scenarios, provider, tenancy, RBAC and lease tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: python -m pytest tests/monitoring tests/integration/test_quality_signal_path.py tests/security/test_oidc_rbac_tenant.py -q --junitxml=data-quality-monitoring-v1-evidence/results/quality.xml
      - name: Resolve numeric job ID and generate exact-commit evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID=$(curl --fail --silent --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100"             | python -c 'import json,sys; jobs=[j for j in json.load(sys.stdin)["jobs"] if j["name"] == "certify"]; assert len(jobs)==1; print(jobs[0]["id"])')
          python scripts/certification/verify_product_evidence.py generate             --directory data-quality-monitoring-v1-evidence --repository "${{ github.repository }}" --workflow "data-quality-monitoring.yml"             --run-id "${{ github.run_id }}" --job-id "$JOB_ID" --event "${{ github.event_name }}"             --elasticsearch-version "$(cat data-quality-monitoring-v1-evidence/elasticsearch-version.txt)"             --python-version "$(python --version | cut -d' ' -f2)"  --required-suite elasticsearch --required-suite postgresql --required-suite quality --required-suite security --required-suite tenant --required-suite rbac
      - name: Upload evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-monitoring-v1-evidence
          path: |
            data-quality-monitoring-v1-evidence
            /tmp/es.json
          if-no-files-found: error
          retention-days: 30
  verify-evidence:
    name: independently verify evidence
    if: always()
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data-quality-monitoring-v1-evidence
          path: downloaded-evidence
      - name: Validate provenance, service version, migration and test XML
        run: python scripts/certification/verify_product_evidence.py verify --directory downloaded-evidence/data-quality-monitoring-v1-evidence --repository "${{ github.repository }}" --workflow "data-quality-monitoring.yml" --run-id "${{ github.run_id }}" --expected-sha "$(git rev-parse HEAD)" --required-suite elasticsearch --required-suite postgresql --required-suite quality --required-suite security --required-suite tenant --required-suite rbac
