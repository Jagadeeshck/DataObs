name: Guarded final repair for run 30304590400

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/run-30304590400-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest black ruff pyyaml
      - name: Apply atomic repair or retain diagnostic
        shell: bash
        run: |
          set +e
          python -c 'import runpy,sys; sys.path.insert(0, "."); runpy.run_path(".github/scripts/final_repair_30304590400.py", run_name="__main__")' > .github/final-repair.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          cat .github/final-repair.log
          git config user.name "dataobs-ci"
          git config user.email "dataobs-ci@users.noreply.github.com"
          git add .github/final-repair.log
          git commit -m "chore: retain final repair failure diagnostic" || true
          git push origin "HEAD:${HEAD_REF}"
          exit "$rc"
