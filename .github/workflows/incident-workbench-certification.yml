name: Incident Workbench certification
on:
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest
      - run: mkdir -p evidence/results && python -m pytest tests/unit/test_incident_occ.py tests/unit/test_incident_workbench_safety.py tests/security -q --junitxml=evidence/results/incident.xml
      - run: |
          python scripts/certification/write_evidence_envelope.py --output evidence/evidence.json \
            --repository "$GITHUB_REPOSITORY" --producer-sha "$GITHUB_SHA" \
            --workflow-file incident-workbench-certification.yml --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" --status pass \
            --test-category occ --test-category append-semantics --test-category redaction \
            --test-category tenant-isolation --supporting-file evidence/results/incident.xml \
            --tool-version "python=$(python --version | cut -d' ' -f2)"
      - uses: actions/upload-artifact@v4
        with: {name: incident-workbench-v1-evidence, path: evidence, retention-days: 30}
