name: job-run-backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/job_run tests/test_data_observability.py
      - name: Retain backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-run-backend-evidence
          path: |
            capability-validation-report.json
            capability-state-counts.json
