name: Final repair for hosted foundation run 30304590400

on:
  push:
    branches:
      - fix/run-30304590400-final

permissions:
  contents: write

jobs:
  repair-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/run-30304590400-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest black ruff pyyaml
      - name: Apply, validate, and clean final repair
        run: >-
          python -c
          'import runpy,sys; sys.path.insert(0, ".");
          runpy.run_path(".github/scripts/final_repair_30304590400.py", run_name="__main__")'
