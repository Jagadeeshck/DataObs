name: Python Fmt Fix # trigger retry 2

on:
  workflow_dispatch: {}
  push:
    branches:
      - fix/data-product-decision-reason-mapping-collision
    paths:
      - '.github/workflows/python-fmt-fix.yml'

permissions:
  contents: write

jobs:
  py-fmt-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Run ruff --fix
        run: ruff check . --fix || true

      - name: Run black
        run: black . || true

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            git add -A
            git commit -m "chore: ruff --fix and black auto-format"
            git push origin HEAD:${{ github.ref_name }}
          fi
