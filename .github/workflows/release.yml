name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  checks: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  PRODUCT_DESCRIPTION: Elasticsearch-native Data Observability and Data Streams Monitoring platform

jobs:
  certification-gate:
    name: Verify exact-SHA Beta release authorization
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.locate.outputs.result }}
    steps:
      - uses: actions/checkout@v6.0.2
        with: {fetch-depth: 0}
      - name: Validate semantic tag target on protected main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          tagged_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}^{commit}")"
          test -n "$tagged_sha"
          test "$tagged_sha" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tagged_sha" origin/main
          test "$(git show "$tagged_sha:.github/workflows/release.yml" | sha256sum | cut -d' ' -f1)" = "$(sha256sum .github/workflows/release.yml | cut -d' ' -f1)"
      - name: Locate unique successful authoritative workflow run
        id: locate
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const response = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'beta-1-release-candidate.yml', head_sha: context.sha, status: 'success', per_page: 100});
            const runs = response.data.workflow_runs.filter(r => r.head_sha === context.sha && r.conclusion === 'success');
            if (runs.length !== 1) core.setFailed(`expected exactly one successful authorization run; found ${runs.length}`);
            return String(runs[0]?.id || '');
      - uses: actions/download-artifact@v4
        with:
          name: dataobs-release-authorization
          path: authorization
          run-id: ${{ steps.locate.outputs.result }}
          github-token: ${{ github.token }}
      - name: Validate immutable authorization before build or registry access
        run: |
          python scripts/release/verify_release_authorization.py authorization/dataobs-release-authorization.json \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --workflow-run-id '${{ steps.locate.outputs.result }}'
          python scripts/release/current_terminal_migration.py --json > terminal-migration.json


  build-scan-push:
    name: Build, scan & attest (${{ matrix.component }})
    needs: certification-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, image: dataobs-api, dockerfile: Dockerfile.api, context: .}
          - {component: console, image: dataobs-console, dockerfile: ui/dataobs-console/Dockerfile, context: ui/dataobs-console}
          - {component: quality-worker, image: dataobs-quality-worker, dockerfile: Dockerfile.quality, context: .}
          - {component: scanner-worker, image: dataobs-scanner-worker, dockerfile: Dockerfile.scanner, context: .}
          - {component: monitor-runtime, image: dataobs-monitor-runtime, dockerfile: Dockerfile.monitor-runtime, context: .}
          - {component: pathway-worker, image: dataobs-pathway-worker, dockerfile: Dockerfile.pathway-worker, context: .}
          - {component: kafka-observer, image: dataobs-kafka-observer, dockerfile: Dockerfile.kafka-observer, context: .}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v4.0.0
      - id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.description=${{ env.PRODUCT_DESCRIPTION }}
            org.opencontainers.image.vendor=KJC InfoTech Limited
            org.opencontainers.image.licenses=LicenseRef-Proprietary
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: dataobs-release-candidate:${{ matrix.component }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@v0.21.0
        with:
          image: dataobs-release-candidate:${{ matrix.component }}
          format: cyclonedx-json
          output-file: ${{ matrix.component }}.sbom.cdx.json
      - name: Fail on critical vulnerabilities before publication
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dataobs-release-candidate:${{ matrix.component }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned candidate and resolve immutable digest
        id: publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE: dataobs-release-candidate:${{ matrix.component }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag "$CANDIDATE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          image="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          digest="$(docker buildx imagetools inspect "$image:sha-${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable image result
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p image-result
          python - <<'PY'
          import json, os
          result = {"component": os.environ["COMPONENT"], "image": os.environ["IMAGE"], "digest": os.environ["DIGEST"], "sbom": f"{os.environ['COMPONENT']}.sbom.cdx.json"}
          open("image-result/image.json", "w").write(json.dumps(result, indent=2) + "\n")
          PY
          cp "${COMPONENT}.sbom.cdx.json" image-result/
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.component }}
          path: image-result
          retention-days: 90

  release-manifest:
    name: Publish release manifest
    needs: [certification-gate, build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-images
      - name: Generate machine-readable release manifest
        env:
          AUTHORIZATION_RUN_ID: ${{ needs.certification-gate.outputs.run_id }}
        run: |
          python - <<'PY'
          import datetime, glob, json, os
          migration=json.loads(os.popen('python scripts/release/current_terminal_migration.py --json').read())
          images = [json.load(open(path)) for path in sorted(glob.glob("release-images/**/image.json", recursive=True))]
          expected = {"api", "console", "quality-worker", "scanner-worker", "monitor-runtime", "pathway-worker", "kafka-observer"}
          components = [image.get("component") for image in images]
          if set(components) != expected or len(components) != len(expected):
              raise SystemExit(f"release image inventory must contain every component exactly once: {components}")
          if any(not image.get("digest", "").startswith("sha256:") for image in images):
              raise SystemExit("release image inventory contains a missing or invalid digest")
          manifest = {
              "product": "DataObs",
              "product_version": os.environ["GITHUB_REF_NAME"].removeprefix("v"),
              "git_commit_sha": os.environ["GITHUB_SHA"],
              "build_timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "elastic_stack_compatibility": "9.4.2",
              "migration_range": {"first": migration["ordered_migration_ids"][0], "latest": migration["terminal_migration"]},
              "openapi_version": json.load(open("openapi.json"))["info"]["version"],
              "console_version": json.load(open("ui/dataobs-console/package.json"))["version"],
              "component_images": images,
              "licence": "Proprietary - All Rights Reserved, KJC InfoTech Limited",
              "certification_workflow_runs": [os.environ["AUTHORIZATION_RUN_ID"]],
              "authorization_artifact": "dataobs-release-authorization",
              "security_release_status": "PASS",
              "certification_artifacts": ["incident-migration-occ-artifacts", "e2e-signal-path", "data-product-foundation", "data-product-reconciliation-evidence"],
              "known_limitations": [],
          }
          open("dataobs-release-manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: DataObs ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            dataobs-release-manifest.json
            release-images/**/*.sbom.cdx.json
          body: |
            ## Proprietary release candidate
            ${{ env.PRODUCT_DESCRIPTION }} — Copyright KJC InfoTech Limited. All Rights Reserved.

            Pin every component to `${{ github.ref_name }}`, the immutable `sha-${{ github.sha }}` tag, or the digest recorded in `dataobs-release-manifest.json`. The Helm chart is a foundation and is not production-ready. Demo/sample applications are not production images.
