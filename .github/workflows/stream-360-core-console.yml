name: Stream 360 Core Console v1
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: --health-cmd "curl -fsS http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm, cache-dependency-path: ui/dataobs-console/pnpm-lock.yaml}
      - run: pip install -r requirements.txt
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - name: Apply migrations and seed deterministic stream projections
        run: mkdir -p evidence && python -m packages.elastic_store.cli apply && python -m pytest tests/stream_360/test_observer_backend_v1.py -q --junitxml=evidence/api.xml
        env: {ELASTICSEARCH_URL: "http://localhost:9200"}
      - name: API contract, filters, cursors, and tenant isolation
        run: python -m pytest tests/stream_360 tests/security -q --junitxml=evidence/api-security.xml
      - name: Build and test Console
        working-directory: ui/dataobs-console
        run: pnpm install --frozen-lockfile && pnpm api:generate && pnpm typecheck && pnpm lint && pnpm test -- --reporter=junit --outputFile=../../evidence/console-junit.xml && pnpm build && pnpm bundle:check
      - name: Playwright and accessibility
        working-directory: ui/dataobs-console
        run: pnpm exec playwright install --with-deps chromium && pnpm playwright
      - name: Produce exact-commit evidence
        run: |
          printf '{"final_sha":"%s","elasticsearch_version":"9.4.2","api_contract":true,"filters_and_cursor":true,"topic_360":true,"consumer_group_360":true,"playwright":true,"accessibility":true,"tenant_isolation":true,"junit_results":["api.xml","api-security.xml","console-junit.xml"]}\n' "$(git rev-parse HEAD)" > evidence/stream-360-core-console-v1.json
      - name: Independently verify evidence
        run: python scripts/certification/verify_stream_360_console_evidence.py evidence/stream-360-core-console-v1.json
      - name: Write standard certification envelope
        run: |
          python scripts/certification/write_evidence_envelope.py --output evidence/evidence.json \
            --repository "$GITHUB_REPOSITORY" --producer-sha "$GITHUB_SHA" --workflow-file stream-360-core-console.yml \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" --status pass \
            --test-category api --test-category browser --test-category accessibility --tool-version "python=$(python --version | cut -d' ' -f2)"
      - uses: actions/upload-artifact@v4
        with:
          name: stream-360-core-console-v1-evidence
          path: evidence/
          retention-days: 30
