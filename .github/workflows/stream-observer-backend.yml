name: stream-observer-backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports: ["9200:9200"]
        options: --health-cmd "curl --fail http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Wait for Elasticsearch readiness
        run: python scripts/ci/wait_for_elasticsearch.py --url http://localhost:9200 --timeout 120
      - name: Migration immutability
        run: python scripts/check_migration_immutability.py --base-ref "$(python scripts/resolve_ci_base.py)"
      - name: Prepare exact-version services and Kafka lag
        run: |
          mkdir -p stream-observer-backend-v1-evidence/results
          for _ in {1..30}; do curl -fsS localhost:9200 >/tmp/es.json && break; sleep 2; done
          python -c 'import json; d=json.load(open("/tmp/es.json")); assert d["version"]["number"] == "9.4.2"; print("9.4.2")' | tee stream-observer-backend-v1-evidence/elasticsearch-version.txt
          KAFKA_VERSION=$(docker exec "${{ job.services.kafka.id }}" /opt/kafka/bin/kafka-topics.sh --version | awk '{print $1}')
          test "$KAFKA_VERSION" = "3.9.1"
          printf '%s\n' "$KAFKA_VERSION" > stream-observer-backend-v1-evidence/kafka-version.txt
      - name: Observer projections, intelligence, HTTP boundaries, leases and isolation
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          TEAM1_KAFKA_EVIDENCE_PATH: stream-observer-backend-v1-evidence/intelligence.json
        run: |
          python -m pytest tests/stream_360 tests/pathways tests/security --ignore=tests/security/data_products -q --junitxml=stream-observer-backend-v1-evidence/results/observer.xml
          RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration/kafka_observer/test_release_lag.py -q --junitxml=stream-observer-backend-v1-evidence/results/real-kafka.xml
      - name: Record bounded certification results
        run: |
          python -m scripts.release.release_metadata > stream-observer-backend-v1-evidence/terminal-migration.txt
          test -s stream-observer-backend-v1-evidence/intelligence.json
      - name: Generate exact-commit evidence
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          JOB_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" | python -c 'import json,sys; print(next(j["id"] for j in json.load(sys.stdin)["jobs"] if j["name"] == "certify"))')
          python scripts/certification/verify_product_evidence.py generate --directory stream-observer-backend-v1-evidence --repository "${{ github.repository }}" --workflow "stream-observer-backend.yml" --run-id "${{ github.run_id }}" --job-id "$JOB_ID" --event "${{ github.event_name }}" --elasticsearch-version 9.4.2 --python-version "$(python --version | cut -d' ' -f2)" --required-suite elasticsearch --required-suite kafka --required-suite observer --required-suite security --required-suite tenant
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: stream-observer-backend-v1-evidence, path: stream-observer-backend-v1-evidence, retention-days: 30, if-no-files-found: error}
  verify-evidence:
    if: always()
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: stream-observer-backend-v1-evidence, path: downloaded-evidence}
      - run: python scripts/certification/verify_product_evidence.py verify --directory downloaded-evidence --repository "${{ github.repository }}" --workflow "stream-observer-backend.yml" --run-id "${{ github.run_id }}" --expected-sha "$(git rev-parse HEAD)" --required-suite elasticsearch --required-suite kafka --required-suite observer --required-suite security --required-suite tenant
