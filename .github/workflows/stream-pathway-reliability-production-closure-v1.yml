name: Stream pathway reliability production closure v1
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/streaming/**', 'services/kafka_observer/reliability_*', 'src/api/reliability_routes.py', 'packages/elastic_store/**', 'ui/dataobs-console/**']
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/check_merge_conflict_markers.py
      - run: python scripts/check_team_boundaries.py
      - run: python scripts/check_generated_artifacts.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/validate_capability_ledger.py
      - run: python scripts/release/check_release_metadata.py
      - run: python scripts/check_migration_immutability.py --base-ref origin/main
      - run: python scripts/security/check_route_permissions.py
      - run: ruff check . && black --check .
      - run: python -m pytest tests/stream_360 tests/pathways tests/security -q
  elasticsearch-9-4-2:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env: {discovery.type: single-node, xpack.security.enabled: 'false'}
        ports: ['9200:9200']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/migrate_to_es.py
        env: {ELASTICSEARCH_URL: 'http://localhost:9200'}
      - run: RUN_RELIABILITY_ELASTICSEARCH_TESTS=1 python -m pytest tests/integration/stream_pathway_reliability -q
  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui/dataobs-console}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate && pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test && pnpm build && pnpm bundle:check && pnpm playwright
  evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: [python-contracts, elasticsearch-9-4-2, console]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hosted exact-commit evidence generation must use the standard Team 0 envelope contract.' > evidence-status.txt
      - uses: actions/upload-artifact@v4
        with: {name: stream-pathway-reliability-production-closure-v1-evidence, path: evidence-status.txt, retention-days: 30}
