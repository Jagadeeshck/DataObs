name: Team 0 privileged access and credential lifecycle v1
on:
  workflow_dispatch:
    inputs:
      producer_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.producer_sha }}
          fetch-depth: 0
      - name: Enforce exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.producer_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src services packages
      - run: ruff check src/security tests/security services/security
      - run: black --check src/security tests/security services/security
      - run: pytest -q tests/security
      - run: bash scripts/check_merge_conflict_markers.py 2>/dev/null || python scripts/check_merge_conflict_markers.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_migration_immutability.py --base-ref c5b7dff6573b6fd0ce76122e7112b726c35d431d
      - run: python scripts/validate_capability_ledger.py
      - name: Record truthfully pending hosted evidence
        shell: bash
        run: |
          mkdir -p evidence
          reports='iam-persistence last-admin-concurrency effective-access audit-read service-principal break-glass-state-machine break-glass-authorization strong-auth credential-inventory credential-rotation dual-key elasticsearch-credential-rotation jwks-rotation tls-rotation redaction backup-restore-security game-day'
          for report in $reports; do printf '{"status":"pending","producer_sha":"%s","prerequisite":"disposable secured Elasticsearch, OIDC and Kind"}\n' "$GITHUB_SHA" > "evidence/$report-report.json"; done
          printf '{"status":"pending","producer_sha":"%s","workflow_run_id":"%s","attempt":"%s","terminal_migration":"0025_stream_pathway_reliability_production_closure"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/evidence.json
          python -VV > evidence/tool-versions.txt
          (cd evidence && sha256sum * > artifact-checksums.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: team-0-privileged-access-credential-lifecycle-v1-evidence
          path: evidence/
