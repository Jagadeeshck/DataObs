name: Team 0 Sprint 3 formatter diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact Black 26.10.1 diff
        run: |
          python -m pip install black==26.10.1
          black --diff --color=false             src/api/es_store.py             src/api/store.py             src/api/app.py             tests/elastic_store/test_migrations.py             tests/monitoring/test_runtime_services.py             tests/security/test_gate0_oidc_runtime.py             packages/elastic_store/registry.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Exact pinned Prettier diff
        working-directory: ui/dataobs-console
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write             e2e/console.spec.ts             e2e/fixtures/release.ts             e2e/release-critical-journeys.spec.ts
          git diff --             e2e/console.spec.ts             e2e/fixtures/release.ts             e2e/release-critical-journeys.spec.ts
