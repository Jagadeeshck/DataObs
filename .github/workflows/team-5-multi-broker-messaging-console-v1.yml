name: Team 5 - Multi-Broker Messaging Console v1
on:
  pull_request:
    paths:
      [
        "ui/dataobs-console/**",
        "docs/**",
        ".github/workflows/team-5-multi-broker-messaging-console-v1.yml",
      ]
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/dataobs-console
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: ui/dataobs-console/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: API generation and drift
        run: pnpm api:generate && git diff --exit-code -- src/api/generated/schema.ts
      - name: Type, lint, format
        run: pnpm typecheck && pnpm lint && pnpm format:check
      - name: Unit, terminology, capability, semantics, privacy and isolation contracts
        run: pnpm test && pnpm messaging:check
      - name: Visualization, build, bundle and performance contracts
        run: pnpm visualization:check && pnpm build && pnpm bundle:check && pnpm performance:check
      - name: Playwright and Axe journeys
        run: pnpm playwright
      - name: Repository security, boundaries, artifacts, docs, capability and migration gates
        working-directory: .
        run: |
          python scripts/check_merge_conflict_markers.py
          python scripts/security/check_route_permissions.py
          python scripts/check_team_boundaries.py
          python scripts/check_generated_artifacts.py
          python scripts/check_docs_links.py
          python scripts/validate_capability_ledger.py
          python scripts/check_migration_immutability.py --base-ref "${{ github.event.pull_request.base.sha }}"
          python scripts/release/current_terminal_migration.py
      - name: Secret-field scan
        run: '! rg -i "(sasl_password|aws_secret_access_key|client_secret|rabbitmq_password|pulsar_token|message_payload)" src/messaging src/features/streams/MessagingOverview.tsx'
      - name: Exact-commit evidence
        working-directory: .
        run: |
          terminal=$(python scripts/release/current_terminal_migration.py)
          cat > team-5-multi-broker-messaging-console-v1-evidence <<EVIDENCE
          Team = Team 5
          repository = ${{ github.repository }}
          audited base SHA = ${{ github.event.pull_request.base.sha }}
          producer SHA = ${{ github.sha }}
          workflow = ${{ github.workflow }}
          run/attempt = ${{ github.run_id }}/${{ github.run_attempt }}
          Console version = 0.1.0
          supported provider count = 8
          provider registry systems = kafka,kinesis,sqs,rabbitmq,google_pubsub,azure_event_hubs,azure_service_bus,pulsar
          provider capability API status = passed
          provider terminology validation = passed
          legacy Kafka compatibility = passed
          non-Kafka semantic validation = passed
          measured-zero validation = passed
          missing-value validation = passed
          partial-provider validation = passed
          tenant isolation = passed
          environment isolation = passed
          accessibility result = Playwright/Axe passed
          Playwright result = passed
          build result = passed
          bundle result = passed
          performance result = passed
          privacy result = passed
          secret scan = passed
          terminal migration = $terminal
          warnings = none
          skipped gates = none
          EVIDENCE
      - uses: actions/upload-artifact@v4
        with:
          name: team-5-multi-broker-messaging-console-v1-evidence
          path: team-5-multi-broker-messaging-console-v1-evidence
