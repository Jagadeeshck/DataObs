name: Trino SQL Engine Collector v1
on: [pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-trino.txt ruff black mypy pip-audit
      - run: '! git grep -nE "^(<<<<<<<|=======|>>>>>>>)"'
      - run: python -m compileall integrations/sql_engine integrations/trino services/collection_manager
      - run: ruff check integrations/sql_engine integrations/trino tests/integrations/test_sql_engine_foundation.py tests/integrations/test_trino_provider.py
      - run: black --check integrations/sql_engine integrations/trino tests/integrations/test_sql_engine_foundation.py tests/integrations/test_trino_provider.py
      - run: mypy --ignore-missing-imports integrations/sql_engine integrations/trino
      - run: pytest -q tests/integrations tests/elastic_store/test_migrations.py
      - run: pytest -q tests/integrations/test_sql_engine_foundation.py tests/integrations/test_trino_provider.py
      - run: python scripts/check_migration_immutability.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
      - run: python scripts/release/current_terminal_migration.py && python scripts/release/check_release_metadata.py
      - run: python scripts/validate_capability_ledger.py && pip-audit -r requirements-trino.txt
      - run: python scripts/check_docs_links.py
      - name: Secret-pattern scan
        run: '! git grep -nE "(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*=[[:space:]]*[^$])" -- . ":!tests" ":!docs"'
      - name: Evidence envelope
        run: mkdir -p trino-sql-engine-collector-v1-evidence && python scripts/trino_evidence.py > trino-sql-engine-collector-v1-evidence/envelope.json
      - uses: actions/upload-artifact@v4
        with: {name: trino-sql-engine-collector-v1-evidence, path: trino-sql-engine-collector-v1-evidence}
      - run: python scripts/verify_trino_evidence.py trino-sql-engine-collector-v1-evidence/envelope.json
