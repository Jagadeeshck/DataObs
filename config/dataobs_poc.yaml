# ============================================================
#  DataObs POC — Primary Configuration
#  Unified Elasticsearch cluster for observability + test data
# ============================================================

tenant: poc
environment: poc

# ── Elasticsearch (UNIFIED cluster) ───────────────────────────
# Single cluster hosts both observability indices and test data.
#
#  Observability indices (auto-created by OTel/APM):
#    traces-apm-*          → APM distributed traces
#    metrics-apm-*         → APM metrics (Spark, pipeline)
#    logs-*                → Agent-collected logs
#
#  Test / pipeline data indices (created by es-setup):
#    dataobs-test-data     → synthetic pipeline test records
#    dataobs-spark-results → Spark transformation output
#    dataobs-lineage       → data lineage events
elasticsearch:
  # Single-node POC cluster (discovery.type=single-node).
  # Production / AWS reference architecture uses multi-node with transport TLS;
  # see docs/poc-setup.md for the upgrade path.
  host: "${ELASTICHOST:-http://es01:9200}"
  hosts:
    - "${ELASTICHOST:-http://es01:9200}"
  username: elastic
  password: "${ELASTIC_PASSWORD:-changeme}"
  # Index prefix for custom DataObs indices
  data_index_prefix: dataobs
  # APM / observability indices (auto-created by Elastic APM Server)
  apm_traces_index: traces-apm-*
  apm_metrics_index: metrics-apm-*
  # Data-observability indices (Soda / Monte Carlo / Acceldata patterns).
  # See config/elasticsearch/poc-templates.json for the full mappings.
  indices:
    raw:          dataobs-poc-raw
    curated:      dataobs-poc-curated
    quality:      dataobs-quality
    freshness:    dataobs-freshness
    volume:       dataobs-volume
    schema:       dataobs-schema
    lineage:      dataobs-lineage
    assets:       dataobs-assets
    alerts:       dataobs-alerts
    ranger_audit: dataobs-ranger-audit

# ── OpenTelemetry ─────────────────────────────────────────────
# Default POC path: Elastic APM only. OTel is isolated behind
# the `otel` Compose profile (docker compose --profile otel ...).
#
# IMPORTANT: endpoint MUST be an empty string (not the otel-collector
# hostname) in the default config. TelemetryEmitter reads this value
# at construction time — before OTEL_SDK_DISABLED is checked — so a
# non-empty value causes the OTel bootstrap log even when the SDK is
# disabled.  Only set this when running with --profile otel.
otel:
  endpoint: ""
  service_name: "${OTEL_SERVICE_NAME:-dataobs-pipeline}"
  # Resource attributes propagated to all signals
  resource_attributes:
    deployment.environment: poc
    service.namespace: dataobs
    telemetry.source: dataobs-poc

# ── Spark ─────────────────────────────────────────────────────
spark:
  master: "${SPARK_MASTER:-local[*]}"
  app_name: DataObs-POC
  # OTel instrumentation disabled in the default POC path.
  # Enabling this causes Spark to resolve and download the OTel Java agent
  # (io.opentelemetry:opentelemetry-api:1.38.0) via ivy on every run.
  # Spark app-level spans are emitted via Python SparkApmInstrumentation
  # context managers (see src/poc/spark_instrumentation.py).
  # Container-level logs/metrics/traces flow through Elastic Agent / APM.
  # Set to true ONLY when running with: docker compose --profile otel
  otel_instrumentation_enabled: false
  # The Java OTel agent requires the otel-collector to be running.
  # Disabled by default; enable only with the `otel` Compose profile.
  java_agent_enabled: false

# ── Pipeline ──────────────────────────────────────────────────
pipeline:
  runner: src.poc.pipeline_runner.DataObsPipelineRunner
  stages:
    - ingest
    - spark_transform
    - lineage
  tenant: poc

# ── Data Quality ──────────────────────────────────────────────
quality:
  enabled: true
  rules:
    - name: null_check
      type: completeness
      threshold: 0.99
    - name: freshness_check
      type: freshness
      max_age_minutes: 60

# ── Data Freshness ─────────────────────────────────────────────
freshness:
  enabled: true
  check_interval_minutes: 15
  datasets:
    - name: dataobs-test-data
      max_age_minutes: 60
    - name: dataobs-spark-results
      max_age_minutes: 30

# ── Data Lineage ──────────────────────────────────────────────
lineage:
  enabled: true
  index: dataobs-lineage
  track_spark_jobs: true
  track_es_writes: true

# ── Kibana ────────────────────────────────────────────────────
kibana:
  url: "${KIBANA_URL:-http://kibana:5601}"
  username: elastic
  password: "${ELASTIC_PASSWORD:-changeme}"
