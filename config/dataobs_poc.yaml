# ============================================================
#  DataObs POC — Primary Configuration
#  Unified Elasticsearch cluster for observability + test data
# ============================================================

tenant: poc
environment: poc

# ── Elasticsearch (UNIFIED cluster) ───────────────────────────
# Single cluster hosts both observability indices and test data.
#
#  Observability indices (auto-created by OTel/APM):
#    traces-apm-*          → APM distributed traces
#    metrics-otel-poc-*    → OTel metrics (Spark, pipeline, Docker)
#    logs-otel-poc-*       → OTel logs
#
#  Test / pipeline data indices (created by es-setup):
#    dataobs-test-data     → synthetic pipeline test records
#    dataobs-spark-results → Spark transformation output
#    dataobs-lineage       → data lineage events
elasticsearch:
  host: "${ELASTICHOST:-http://elasticsearch:9200}"
  username: elastic
  password: "${ELASTIC_PASSWORD:-changeme}"
  # Index prefix for custom DataObs indices
  data_index_prefix: dataobs
  # OTel metrics index (written by OTel Collector ES exporter)
  otel_metrics_index: metrics-otel-poc
  otel_logs_index: logs-otel-poc
  otel_traces_index: traces-otel-poc

# ── OpenTelemetry ─────────────────────────────────────────────
otel:
  endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
  service_name: "${OTEL_SERVICE_NAME:-dataobs-pipeline}"
  # Resource attributes propagated to all signals
  resource_attributes:
    deployment.environment: poc
    service.namespace: dataobs
    telemetry.source: dataobs-poc

# ── Spark ─────────────────────────────────────────────────────
spark:
  master: "${SPARK_MASTER:-local[*]}"
  app_name: DataObs-POC
  # OTel instrumentation — wraps every Spark job
  otel_instrumentation_enabled: true
  # Java agent injected via SPARK_SUBMIT_OPTS in docker-compose
  java_agent_enabled: true

# ── Pipeline ──────────────────────────────────────────────────
pipeline:
  runner: src.poc.pipeline_runner.DataObsPipelineRunner
  stages:
    - ingest
    - spark_transform
    - lineage
  tenant: poc

# ── Data Quality ──────────────────────────────────────────────
quality:
  enabled: true
  rules:
    - name: null_check
      type: completeness
      threshold: 0.99
    - name: freshness_check
      type: freshness
      max_age_minutes: 60

# ── Data Freshness ─────────────────────────────────────────────
freshness:
  enabled: true
  check_interval_minutes: 15
  datasets:
    - name: dataobs-test-data
      max_age_minutes: 60
    - name: dataobs-spark-results
      max_age_minutes: 30

# ── Data Lineage ──────────────────────────────────────────────
lineage:
  enabled: true
  index: dataobs-lineage
  track_spark_jobs: true
  track_es_writes: true

# ── Kibana ────────────────────────────────────────────────────
kibana:
  url: "${KIBANA_URL:-http://kibana:5601}"
  username: elastic
  password: "${ELASTIC_PASSWORD:-changeme}"
