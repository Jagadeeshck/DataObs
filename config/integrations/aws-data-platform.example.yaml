schema_version: v1 # configuration envelope remains backward compatible; AWS provider implementation is v3
integration_id: aws-data-platform-dev
provider_type: aws
enabled: false
timeout_seconds: 300
allowed_capabilities: [resource_discovery, metadata_collection, metric_collection, health_check, incremental_collection]
provider:
  expected_account_id: "000000000000"
  assume_role:
    role_arn: arn:aws:iam::000000000000:role/DataObsReadOnly
    external_id_ref: env:DATAOBS_AWS_EXTERNAL_ID
    session_duration_seconds: 3600
  regions: [eu-west-1, eu-west-2]
  services: [rds, glue, athena, emr-serverless, s3, lambda, sagemaker, mwaa, redshift, redshift-serverless, kinesis, sqs]
  service_options:
    s3:
      include_buckets: [synthetic-data-bucket]
      prefix_assets: [{bucket: synthetic-data-bucket, prefix: curated/}]
      maximum_prefix_samples: 100
      maximum_prefix_pages: 10
    lambda: {include_function_patterns: [data-platform-*]}
    sagemaker: {include_training_jobs: true, include_processing_jobs: true, include_pipeline_executions: true, include_endpoints: true, history_lookback_seconds: 86400}
    mwaa: {collect_environment_metrics: true}
    redshift: {include_query_summaries: false, query_history_lookback_seconds: 3600}
    kinesis:
      include_streams: []
      include_shards: true
      include_metrics: true
      include_shard_metrics_if_enabled: false
      maximum_streams: 500
      maximum_stream_pages: 50
      maximum_shards_per_stream: 1000
      maximum_shard_pages: 100
    sqs:
      include_queues: []
      include_metrics: true
      include_dlq_relationships: true
      maximum_queues: 1000
      maximum_queue_pages: 100
  cloudwatch: {enabled: true, lookback_seconds: 900, period_seconds: 300}
  ownership_tag_keys: [Owner, Team, Application, DataProduct]
