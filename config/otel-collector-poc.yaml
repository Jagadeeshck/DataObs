# ============================================================
#  OpenTelemetry Collector — POC Configuration
#  Elastic Stack 9.3.3 / OTel Collector Contrib 0.99.0
#
#  Signal routing:
#
#    OTLP (pipeline)
#      ├─ traces  ───►  Elastic Agent APM :8200  (OTLP gRPC)
#      ├─ metrics ───►  Elasticsearch :9200       (dataobs-poc-telemetry-metrics)
#      └─ logs    ───►  Elasticsearch :9200       (dataobs-poc-telemetry-logs)
#
#  APM Server (running inside Elastic Agent) stores traces in
#  the .apm-* and traces-apm-* data streams in Elasticsearch.
#  They are visible in Kibana → Observability → APM.
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://kibana:*"
            - "http://pipeline:*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    check_interval: 5s
    limit_mib: 300
    spike_limit_mib: 75

  # Tag all telemetry with POC environment metadata
  resource:
    attributes:
      - key: deployment.environment
        value: poc
        action: insert
      - key: service.namespace
        value: dataobs
        action: insert
      - key: elastic.stack.version
        value: "9.3.3"
        action: insert

  # Enrich spans with data pipeline context attributes
  attributes:
    actions:
      - key: pipeline.name
        value: dataobs-poc
        action: insert
      - key: data.tenant
        value: poc
        action: insert

exporters:

  # -----------------------------------------------------------
  # TRACES → Elastic Agent APM Server (port 8200)
  # Uses OTLP/gRPC natively supported by Elastic Agent 9.x.
  # Traces appear in Kibana → Observability → APM → Services.
  # -----------------------------------------------------------
  otlp/apm:
    endpoint: "${APM_SERVER_URL:-http://elastic-agent:8200}"
    tls:
      insecure: true
    headers:
      # APM secret token for authentication
      Authorization: "Bearer ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}"

  # -----------------------------------------------------------
  # METRICS → Elasticsearch directly
  # Stored in dataobs-poc-telemetry-metrics index.
  # -----------------------------------------------------------
  elasticsearch/metrics:
    endpoints: ["${ELASTICHOST:-http://elasticsearch:9200}"]
    user: elastic
    password: "${ELASTIC_PASSWORD}"
    metrics_index: dataobs-poc-telemetry-metrics
    tls:
      insecure: true
    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  # -----------------------------------------------------------
  # LOGS → Elasticsearch directly
  # Stored in dataobs-poc-telemetry-logs index.
  # -----------------------------------------------------------
  elasticsearch/logs:
    endpoints: ["${ELASTICHOST:-http://elasticsearch:9200}"]
    user: elastic
    password: "${ELASTIC_PASSWORD}"
    logs_index: dataobs-poc-telemetry-logs
    tls:
      insecure: true
    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  # Also print to stdout for easy local debugging
  debug:
    verbosity: basic

service:
  extensions: [health_check, pprof]
  pipelines:

    # Traces go to Elastic Agent APM (full distributed tracing in Kibana APM UI)
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters:  [otlp/apm, debug]

    # Metrics go directly to Elasticsearch
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [elasticsearch/metrics, debug]

    # Logs go directly to Elasticsearch
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [elasticsearch/logs, debug]
