# ============================================================
#  OpenTelemetry Collector — POC Configuration (macOS-safe)
#  otel-collector-contrib:0.99.0  /  Elastic Stack 9.3.3
#
#  IMPORTANT:
#  Docker Desktop on macOS does not expose Linux host internals
#  the same way as native Linux. The two biggest sources of OTel
#  collector crashes in Docker Desktop are:
#
#    1. docker_stats receiver → docker.sock access/runtime issues
#    2. hostmetrics.processes scraper → /proc visibility issues
#
#  To keep the POC stable on macOS while still giving container
#  observability, this config uses:
#
#    - cAdvisor (Prometheus scrape) for container metrics
#    - hostmetrics WITHOUT processes scraper
#    - no docker_stats receiver
#
#  This still gives:
#    ✔ container CPU / memory / network / filesystem via cAdvisor
#    ✔ host CPU / memory / disk / network via hostmetrics
#    ✔ pipeline + Spark traces / metrics / logs via OTLP
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      load: {}

  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 5s
    send_batch_size: 512

  resource/common:
    attributes:
      - key: deployment.environment
        value: poc
        action: upsert
      - key: service.namespace
        value: dataobs
        action: upsert

  resource/docker:
    attributes:
      - key: telemetry.source
        value: docker-desktop
        action: upsert
      - key: monitoring.layer
        value: infrastructure
        action: upsert

  resource/pipeline:
    attributes:
      - key: telemetry.source
        value: spark-pipeline
        action: upsert
      - key: monitoring.layer
        value: data-pipeline
        action: upsert

exporters:
  otlp/apm:
    endpoint: ${env:APM_SERVER_URL}
    tls:
      insecure: true
    headers:
      Authorization: Bearer ${env:APM_SECRET_TOKEN}

  debug:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    metrics/pipeline:
      receivers: [otlp]
      processors: [memory_limiter, resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource/common, resource/docker, batch]
      exporters: [otlp/apm]

    metrics/containers:
      receivers: [prometheus]
      processors: [memory_limiter, resource/common, resource/docker, batch]
      exporters: [otlp/apm]
