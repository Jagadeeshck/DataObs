# ============================================================
#  OpenTelemetry Collector — POC Configuration
#  OTel Collector Contrib 0.99.0  /  Elastic Stack 9.3.3
#
#  Signal routing:
#
#    OTLP (pipeline)
#      ├─ traces  ───►  Elastic Agent APM :8200  (OTLP/gRPC)
#      │                → stored in traces-apm-* data streams
#      │                → visible in Kibana → Observability → APM
#      ├─ metrics ───►  Elastic Agent APM :8200  (OTLP/gRPC)
#      └─ logs    ───►  Elastic Agent APM :8200  (OTLP/gRPC)
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://kibana:*"
            - "http://pipeline:*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    check_interval: 5s
    limit_mib: 300
    spike_limit_mib: 75

  # Tag all telemetry with POC deployment metadata
  resource:
    attributes:
      - key: deployment.environment
        value: poc
        action: insert
      - key: service.namespace
        value: dataobs
        action: insert
      - key: elastic.stack.version
        value: "9.3.3"
        action: insert

  # Enrich spans with pipeline context
  attributes:
    actions:
      - key: pipeline.name
        value: dataobs-poc
        action: insert
      - key: data.tenant
        value: poc
        action: insert

exporters:

  # ──────────────────────────────────────────────────────────
  # TRACES → Elastic Agent APM Server (port 8200)
  # Elastic Agent 9.x accepts OTLP natively on port 8200.
  # Traces appear in: Kibana → Observability → APM → Services
  # Data streams: traces-apm-*, spans-apm-*
  # ──────────────────────────────────────────────────────────
  otlp/apm:
    endpoint: "${env:APM_SERVER_URL}"
    tls:
      insecure: true
    headers:
      Authorization: "Bearer ${env:APM_SECRET_TOKEN}"

  # stdout debug (easy local inspection)
  debug:
    verbosity: basic

service:
  extensions: [health_check, pprof]
  pipelines:

    # Traces → Elastic Agent APM (full distributed tracing in Kibana APM)
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters:  [otlp/apm, debug]

    # Metrics → Elasticsearch
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/apm, debug]

    # Logs → Elastic Agent APM
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/apm, debug]
