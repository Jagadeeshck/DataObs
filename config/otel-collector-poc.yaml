# ============================================================
#  OpenTelemetry Collector — POC Configuration
#  otel-collector-contrib:0.99.0  /  Elastic Stack 9.3.3
#
#  Signal routing:
#
#    Infrastructure / Docker host
#      ├─ hostmetrics  ──► Elastic Agent APM :8200 (OTLP/gRPC)
#      ├─ docker_stats ──► Elastic Agent APM :8200 (OTLP/gRPC)
#      └─ prometheus   ──► Elastic Agent APM :8200 (cAdvisor)
#
#    Pipeline / Spark
#      ├─ traces  ──► Elastic Agent APM :8200
#      ├─ metrics ──► Elastic Agent APM :8200
#      └─ logs    ──► Elastic Agent APM :8200
#
#  All signals flow through the single APM endpoint and are
#  stored in Elasticsearch by Elastic Agent:
#    traces  → traces-apm-*       (APM Services view)
#    metrics → metrics-apm-*      (Metrics Explorer)
#    logs    → logs-apm-*         (Logs view)
#
#  Kibana Infrastructure / Containers view picks up
#  hostmetrics and docker_stats automatically via ECS mapping.
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  # ── OTLP: pipeline, Spark jobs send here ──────────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://kibana:*"
            - "http://pipeline:*"

  # ── Host metrics (Docker host CPU/mem/disk/net/load) ───────
  # NOTE: in 0.99.0 the scrapers block does NOT support
  # a nested metrics: { enabled: true } block — just list
  # the scraper names as empty maps.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      load: {}
      processes: {}

  # ── Docker container stats ─────────────────────────────────
  # api_version field does NOT exist in 0.99.0 — removed.
  # Only endpoint + collection_interval + timeout are valid.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s

  # ── Prometheus: scrape cAdvisor + collector self-metrics ───
  # metric_relabel_configs is a Prometheus server concept;
  # OTel prometheus receiver only supports relabel_configs.
  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]

        - job_name: otel_collector_self
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  # Tag every signal with deployment metadata
  resource:
    attributes:
      - key: deployment.environment
        value: poc
        action: insert
      - key: service.namespace
        value: dataobs
        action: insert
      - key: elastic.stack.version
        value: "9.3.3"
        action: insert

  # Pipeline / Spark extra attributes
  attributes:
    actions:
      - key: pipeline.name
        value: dataobs-poc
        action: insert
      - key: data.tenant
        value: poc
        action: insert

  # Docker / infra source tag
  resource/docker:
    attributes:
      - key: telemetry.source
        value: docker-host
        action: insert
      - key: monitoring.layer
        value: infrastructure
        action: insert

  # Spark / pipeline source tag
  resource/spark:
    attributes:
      - key: telemetry.source
        value: spark-pipeline
        action: insert
      - key: monitoring.layer
        value: data-pipeline
        action: insert

exporters:
  # ── ALL signals → Elastic Agent APM (OTLP/gRPC port 8200) ──
  # This is the most reliable path in otel-contrib 0.99.0.
  # Elastic Agent 9.x accepts OTLP natively and maps:
  #   traces  → traces-apm-*   → Kibana APM Services
  #   metrics → metrics-apm-*  → Kibana Metrics Explorer
  #   logs    → logs-apm-*     → Kibana Logs
  otlp/apm:
    endpoint: "${env:APM_SERVER_URL}"
    tls:
      insecure: true
    headers:
      Authorization: "Bearer ${env:APM_SECRET_TOKEN}"

  # ── stdout debug (tail docker logs dataobs-poc-otel) ───────
  debug:
    verbosity: basic

service:
  extensions: [health_check, pprof]
  pipelines:

    # Pipeline / Spark TRACES → APM
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, resource/spark, attributes, batch]
      exporters:  [otlp/apm, debug]

    # Pipeline / Spark METRICS → APM
    metrics/pipeline:
      receivers:  [otlp]
      processors: [memory_limiter, resource, resource/spark, batch]
      exporters:  [otlp/apm, debug]

    # Pipeline / Spark LOGS → APM
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/apm, debug]

    # Docker host metrics → APM (Infrastructure view)
    metrics/docker:
      receivers:  [hostmetrics, docker_stats]
      processors: [memory_limiter, resource, resource/docker, batch]
      exporters:  [otlp/apm]

    # cAdvisor container metrics → APM
    metrics/cadvisor:
      receivers:  [prometheus]
      processors: [memory_limiter, resource, resource/docker, batch]
      exporters:  [otlp/apm]
