# ============================================================
#  OpenTelemetry Collector — POC Configuration (macOS-safe)
#  otel-collector-contrib:0.99.0  /  Elastic Stack 9.3.3
#
#  IMPORTANT:
#  Docker Desktop on macOS does not expose Linux host internals
#  the same way as native Linux. The two biggest sources of OTel
#  collector crashes in Docker Desktop are:
#
#    1. docker_stats receiver → docker.sock access/runtime issues
#    2. hostmetrics.processes scraper → /proc visibility issues
#
#  To keep the POC stable on macOS while still giving container
#  observability, this config uses:
#
#    - cAdvisor (Prometheus scrape) for container metrics
#    - hostmetrics WITHOUT processes scraper
#    - no docker_stats receiver
#
#  This still gives:
#    ✔ container CPU / memory / network / filesystem via cAdvisor
#    ✔ host CPU / memory / disk / network via hostmetrics
#    ✔ pipeline + Spark traces / metrics / logs via OTLP
#    ✔ container stdout/stderr logs via filelog receiver
#    ✔ AWS cloud resource attributes on every telemetry signal
#
#  Fixes applied (2026-05-05):
#    FIX-1: APM exporter endpoint now includes http:// scheme.
#            Without it the collector crashed before health_check
#            could bind port 13133 — causing the misleading
#            "no healthcheck configured" compose error.
#    FIX-2: otlp/apm exporter now declares protocol: http/protobuf.
#            Elastic APM Server only accepts HTTP intake, not gRPC.
#    FIX-3: Added explicit `protocol` field and corrected endpoint
#            so the collector does not attempt a gRPC dial.
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # pprof exposes Go profiling at :1888/debug/pprof — useful for collector
  # memory/CPU debugging. Disable in production.
  pprof:
    endpoint: 0.0.0.0:1888

  # zpages exposes internal OTel debug pages at :55679/debug/tracez etc.
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    # root_path tells the hostmetrics receiver to resolve /proc, /sys, etc.
    # relative to /hostfs rather than the container root. The /hostfs bind-mount
    # must be set in docker-compose (- /:/hostfs:ro) for this to work.
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: ["/dev", "/proc", "/sys", "/run/lock"]
          match_type: strict
        exclude_fs_types:
          fs_types: ["autofs", "binfmt_misc", "cgroup", "configfs",
                     "debugfs", "devpts", "devtmpfs", "fusectl",
                     "hugetlbfs", "mqueue", "nsfs", "overlay",
                     "proc", "procfs", "pstore", "rpc_pipefs",
                     "securityfs", "selinuxfs", "squashfs",
                     "sysfs", "tracefs"]
          match_type: strict
      network:
        exclude:
          interfaces: ["lo"]
          match_type: strict
      load: {}
      # NOTE: processes scraper is intentionally omitted — it requires
      # /proc visibility that Docker Desktop on macOS does not provide.
      # To enable on native Linux / EC2 / EKS worker nodes, uncomment:
      # processes: {}

  # filelog receiver — collects container stdout/stderr logs written by
  # Docker's json-file logging driver to:
  #   /var/lib/docker/containers/<id>/<id>-json.log
  # The /var/lib/docker/containers volume is mounted :ro in compose.
  # On macOS Docker Desktop the path lives inside the HyperKit/VZ VM;
  # Docker Desktop 4.x+ exposes it via the gRPC FUSE layer so the mount
  # works correctly even on Apple Silicon.
  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    include_file_name: false
    start_at: beginning
    operators:
      # Parse Docker json-file log format: {"log":"...","stream":"stdout","time":"..."}
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%fZ"
      - type: move
        from: attributes.log
        to: body
      - type: add
        field: attributes.log.source
        value: docker-container
      # Extract container ID from the file path and set as resource attribute
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        on_error: send
      - type: move
        from: attributes.container_id
        to: resource["container.id"]

  # Prometheus scrape of cAdvisor container metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]

processors:
  memory_limiter:
    check_interval: 5s
    # Aligned to actual collector startup log (limit_mib: 400, spike_limit_mib: 100)
    # Container mem_limit in compose is 768m so this leaves ~268 MiB headroom
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 512

  resource/common:
    attributes:
      - key: deployment.environment
        value: poc
        action: upsert
      - key: service.namespace
        value: dataobs
        action: upsert

  resource/docker:
    attributes:
      - key: telemetry.source
        value: docker-desktop
        action: upsert
      - key: monitoring.layer
        value: infrastructure
        action: upsert

  resource/pipeline:
    attributes:
      - key: telemetry.source
        value: spark-pipeline
        action: upsert
      - key: monitoring.layer
        value: data-pipeline
        action: upsert

  resource/logs:
    attributes:
      - key: telemetry.source
        value: container-logs
        action: upsert
      - key: monitoring.layer
        value: system
        action: upsert

  # resourcedetection adds host.* and cloud.* attributes automatically.
  # Detectors run in order; the first match wins.
  #   env   — reads OTEL_RESOURCE_ATTRIBUTES env var (set host.name via HOST_NAME)
  #   system — adds host.name, host.arch, os.type from the container
  # On EC2/EKS add "ec2" or "eks" to the list to get cloud.provider,
  # cloud.region, cloud.account.id, host.id etc. from the instance metadata.
  resourcedetection/system:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 5s
    override: false

  # Enrich every signal with cloud context for AWS observability.
  # Values come from env vars set in docker-compose (CLOUD_PROVIDER, etc.).
  resource/cloud:
    attributes:
      - key: cloud.provider
        value: ${env:CLOUD_PROVIDER}
        action: upsert
      - key: cloud.region
        value: ${env:CLOUD_REGION}
        action: upsert
      - key: host.name
        value: ${env:HOST_NAME}
        action: upsert

exporters:
  otlp/apm:
    # FIX-1: endpoint MUST include the http:// scheme.
    # Previously this was `elastic-agent:8200` (no scheme), which caused
    # the collector to attempt a gRPC TLS dial and crash immediately —
    # before the health_check extension could bind port 13133. That
    # manifests in `docker compose run` as:
    #   "container dataobs-poc-otel has no healthcheck configured"
    # even though the healthcheck stanza IS present in the compose file.
    #
    # FIX-2: protocol must be http/protobuf.
    # Elastic APM Server only accepts HTTP/protobuf on port 8200.
    # The default OTel exporter protocol is grpc, which is incompatible.
    endpoint: http://${env:APM_SERVER_URL}
    protocol: http/protobuf
    tls:
      insecure: true
    headers:
      Authorization: Bearer ${env:APM_SECRET_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  debug:
    verbosity: normal

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    metrics/pipeline:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [otlp/apm, debug]

    # System integration pipeline — host CPU/mem/disk/net/load metrics.
    # Scrapers: cpu, memory, disk, filesystem, network, load.
    # NOTE: processes scraper omitted for macOS Docker Desktop compatibility.
    # Enable `processes: {}` in the hostmetrics receiver on Linux / EC2 / EKS.
    metrics/system:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/docker, batch]
      exporters: [otlp/apm]

    # Container metrics from cAdvisor (Prometheus scrape)
    metrics/containers:
      receivers: [prometheus]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/docker, batch]
      exporters: [otlp/apm]

    # Container logs pipeline — stdout/stderr from all Docker containers
    logs/containers:
      receivers: [filelog]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/logs, batch]
      exporters: [otlp/apm, debug]
