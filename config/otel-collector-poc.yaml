# ============================================================
#  OpenTelemetry Collector — POC Configuration (macOS-safe)
#  otel-collector-contrib:0.99.0  /  Elastic Stack 9.4.0
#
#  Notes on Elastic 9.4 + EDOT (Elastic Distribution of OpenTelemetry):
#  - From Elastic 9.2 the Elastic Agent ships an embedded EDOT collector
#    runtime; Fleet-managed agents can run OTel inputs.
#  - The standalone EDOT collector is NOT Fleet-managed yet, so for the
#    POC we keep otel-collector-contrib here, while the Fleet-managed
#    `elastic-agent` service in docker-compose.poc.yml provides the
#    Fleet-style "OTel agent" view in Kibana → Fleet.
#  - APM Server (inside elastic-agent) speaks OTLP/HTTP on :8200, so we
#    use the `otlphttp` exporter (component id `otlphttp/apm`). The
#    `otlp` exporter is gRPC-only and rejects a `protocol:` key — that
#    mistake produces the startup error
#       'has invalid keys: protocol' under exporter 'otlp/apm'.
#  - Routing:
#      traces  → otlphttp/apm + dataobs-otel-traces
#      metrics → otlphttp/apm + dataobs-otel-metrics
#      logs    → otlphttp/apm + dataobs-otel-logs
#      docker  → dataobs-otel-container-logs
# ============================================================

file_format: yaml

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1888

  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: ["/dev", "/proc", "/sys", "/run/lock"]
          match_type: strict
        exclude_fs_types:
          fs_types: ["autofs", "binfmt_misc", "cgroup", "configfs",
                     "debugfs", "devpts", "devtmpfs", "fusectl",
                     "hugetlbfs", "mqueue", "nsfs", "overlay",
                     "proc", "procfs", "pstore", "rpc_pipefs",
                     "securityfs", "selinuxfs", "squashfs",
                     "sysfs", "tracefs"]
          match_type: strict
      network:
        exclude:
          interfaces: ["lo"]
          match_type: strict
      load: {}

  # Docker stats receiver — container CPU/mem/net/block-IO metrics from Docker API
  # Requires /var/run/docker.sock mounted in the collector container (see compose).
  # Falls back gracefully if the socket is not available.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 10s
    # MUST be quoted: the docker_stats receiver requires `api_version` to
    # be a string, not a YAML float. An unquoted `1.44` parses as the
    # float 1.44 and the collector aborts with `cannot unmarshal !!float
    # `1.44` into string` on startup (exit 1). 1.44 matches the Docker
    # Engine 25.x API and is the default in recent collector releases.
    api_version: "1.44"
    # Collect all containers (stopped ones have no live stats, safely skipped)
    excluded_images: []
    metrics:
      container.cpu.usage.system:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true

  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    include_file_name: false
    start_at: beginning
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%fZ"
      - type: move
        from: attributes.log
        to: body
      - type: add
        field: attributes.log.source
        value: docker-container
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        on_error: send
      - type: move
        from: attributes.container_id
        to: resource["container.id"]

  # Prometheus scrape of cAdvisor container metrics (supplementary)
  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 512

  resource/common:
    attributes:
      - key: deployment.environment
        value: poc
        action: upsert
      - key: service.namespace
        value: dataobs
        action: upsert

  resource/docker:
    attributes:
      - key: telemetry.source
        value: docker-desktop
        action: upsert
      - key: monitoring.layer
        value: infrastructure
        action: upsert

  resource/pipeline:
    attributes:
      - key: telemetry.source
        value: spark-pipeline
        action: upsert
      - key: monitoring.layer
        value: data-pipeline
        action: upsert

  resource/logs:
    attributes:
      - key: telemetry.source
        value: container-logs
        action: upsert
      - key: monitoring.layer
        value: system
        action: upsert

  resourcedetection/system:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 5s
    override: false

  resource/cloud:
    attributes:
      - key: cloud.provider
        value: ${env:CLOUD_PROVIDER}
        action: upsert
      - key: cloud.region
        value: ${env:CLOUD_REGION}
        action: upsert
      - key: host.name
        value: ${env:HOST_NAME}
        action: upsert

exporters:
  # Primary: APM Server (embedded in elastic-agent) — feeds Kibana APM UI.
  # APM Server accepts OTLP/HTTP on :8200, so we use the `otlphttp`
  # exporter. Do NOT use `otlp` here: that component id is gRPC-only
  # and has no `protocol` field, which is what produced
  #   "'' has invalid keys: protocol" under exporters.otlp/apm.
  otlphttp/apm:
    endpoint: http://${env:APM_SERVER_URL}
    tls:
      insecure: true
    headers:
      Authorization: Bearer ${env:APM_SECRET_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  # Secondary: Direct Elasticsearch — feeds Kibana Discover / Dashboards
  # This ensures ALL signals (traces, metrics, logs) are visible in Kibana
  # even without APM-specific dashboards. Uses ECS-compatible index names
  # so the data appears in the correct data streams.
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_URL}
    user: elastic
    password: ${env:ELASTIC_PASSWORD}
    tls:
      insecure: true
    # Map OTel signals to dedicated dataobs indices
   # traces_index: dataobs-otel-traces
   # logs_index: dataobs-otel-logs
   # metrics_index: dataobs-otel-metrics
    # Use ECS-compatible document structure
    mapping:
      mode: ecs
    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  debug:
    verbosity: normal

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    # Pipeline traces → APM (APM UI) + ES (Discover)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [otlphttp/apm]

    # Pipeline metrics → APM + ES
    metrics/pipeline:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [ elasticsearch]

    # Pipeline/service logs → APM + ES
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/pipeline, batch]
      exporters: [elasticsearch]

    # Host system metrics (CPU/mem/disk/net/load) → APM + ES
    metrics/system:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/docker, batch]
      exporters: [elasticsearch]

    # Docker container metrics via docker_stats receiver → APM + ES
    metrics/docker:
      receivers: [docker_stats]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/docker, batch]
      exporters: [elasticsearch]

    # Container metrics from cAdvisor (Prometheus scrape) → APM + ES
    metrics/containers:
      receivers: [prometheus]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/docker, batch]
      exporters: [elasticsearch]

    # Container stdout/stderr logs → APM + ES
    logs/containers:
      receivers: [filelog]
      processors: [memory_limiter, resourcedetection/system, resource/cloud,
                   resource/common, resource/logs, batch]
      exporters: [elasticsearch]
