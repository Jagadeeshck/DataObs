# ============================================================================
# DataObs — OTel Collector EC2 Agent Configuration
# ============================================================================
# Deploy this on each EC2 host as a sidecar / system service.
# The agent ships telemetry to the centralized DataObs gateway collector.
#
# OTel Semantic Conventions: https://opentelemetry.io/docs/specs/semconv/
# ============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Application telemetry from OTel SDKs / auto-instrumentation
  # SDKs should set via OTEL_RESOURCE_ATTRIBUTES or SDK Resource:
  #   service.name, service.version, service.namespace, service.instance.id
  #   deployment.environment.name
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # AWS X-Ray legacy ingestion
  awsxray:
    endpoint: 0.0.0.0:2000
    transport: udp

  # Host-level metrics — semconv system.* names
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.physical.count:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      network:
      processes:
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true

  # Application + system log collection
  filelog:
    include:
      - /var/log/*.log
      - /var/log/messages
      - /var/log/syslog
      - /var/log/spark/*.log
      - /opt/spark/logs/*.out
    exclude:
      - /var/log/lastlog
      - /var/log/wtmp
    start_at: beginning
    operators:
      - type: regex_parser
        regex: '^(?P<ts>\d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}:\d{2}(?:[\.,]\d+)?)\s+(?P<level>[A-Z]+)\s+(?P<body>.*)$'
        parse_from: body
        if: 'body matches "^\\d{4}-\\d{2}-\\d{2}"'
      - type: move
        from: attributes.body
        to: body
        if: "attributes.body != nil"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 10s
    send_batch_size: 1024

  # ── AWS Resource Detection ─────────────────────────────────────────────
  # Populates cloud.provider, cloud.platform, cloud.region, host.id, host.type
  # cloud.availability_zone, and EC2 tag→attribute mappings (semconv compliant).
  resourcedetection/aws:
    detectors: [env, system, ec2, ecs]
    timeout: 30s
    override: false
    ec2:
      resource_attributes:
        cloud.account.id:
          enabled: true
        cloud.availability_zone:
          enabled: true
        cloud.region:
          enabled: true
        host.id:
          enabled: true
        host.image.id:
          enabled: true
        host.name:
          enabled: true
        host.type:
          enabled: true
      tags:
        - ^Name$
        - ^Environment$
        - ^Team$
        - ^Service$
        - ^dataobs:.*

  # ── Semconv Resource Enrichment ──────────────────────────────────────────
  resource/semconv:
    attributes:
      - key: service.namespace
        value: "${SERVICE_NAMESPACE:-dataobs}"
        action: upsert
      # Semconv 1.24+: deployment.environment.name is canonical.
      # Insert from env var if not already provided by the SDK.
      - key: deployment.environment.name
        value: "${DEPLOY_ENV:-production}"
        action: insert
      # Back-fill legacy attribute for backward compat with ES ECS / older dashboards
      - key: deployment.environment
        from_attribute: deployment.environment.name
        action: insert
      - key: dataobs.agent
        value: "ec2-agent"
        action: insert

  # ── Semconv normalization (old attribute name → new) ────────────────────
  transform/semconv_normalize:
    trace_statements:
      - context: span
        statements:
          - set(attributes["http.request.method"], attributes["http.method"]) where attributes["http.request.method"] == nil and attributes["http.method"] != nil
          - set(attributes["http.response.status_code"], attributes["http.status_code"]) where attributes["http.response.status_code"] == nil and attributes["http.status_code"] != nil
          - set(attributes["server.address"], attributes["net.peer.name"]) where attributes["server.address"] == nil and attributes["net.peer.name"] != nil

exporters:
  # Ship everything to the centralized DataObs gateway collector via OTLP/gRPC.
  # The gateway handles backend routing (ES / OpenSearch / OSIS / AMP).
  otlp:
    endpoint: "${OTEL_GATEWAY_ENDPOINT:-http://dataobs-otel-gateway:4317}"
    tls:
      insecure: "${OTEL_GATEWAY_INSECURE:-true}"
    headers:
      x-tenant-id: "${OTEL_TENANT_ID:-default}"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp, awsxray]
      processors: [memory_limiter, resourcedetection/aws, resource/semconv, transform/semconv_normalize, batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resourcedetection/aws, resource/semconv, batch]
      exporters: [otlp]

    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resourcedetection/aws, resource/semconv, transform/semconv_normalize, batch]
      exporters: [otlp]
