# DataObs POC — Default data sources (data.gov.uk / CKAN)
# ─────────────────────────────────────────────────────────
# These are used as a reference catalogue when auto-discovery is enabled
# but a more stable known-good URL is preferred over live CKAN search.
# The pipeline will fall back to CKAN live-search when these are not
# explicitly set in poc.data_sources.
#
# To use: copy selected entries into poc.data_sources in config/dataobs.yaml.
# ─────────────────────────────────────────────────────────

default_sources:

  - name: road-safety
    theme: transport
    title: "Road Safety Data — Casualties Great Britain"
    source_type: data.gov.uk
    dataset_id: road-safety-data
    resource_url: "https://data.gov.uk/dataset/road-safety-data/datapackage.csv"
    format: csv
    publisher: "Department for Transport"
    description: >
      Annual road casualty statistics for Great Britain including accident
      circumstances, vehicle details, and casualty characteristics.
    tags: [road, safety, accidents, transport, gb]

