  - name: local-authority-profile
    theme: government
    title: "Local Authority District to Region Lookup"
    source_type: data.gov.uk
    dataset_id: local-authority-district-to-region-april-2019-lookup-in-england
    resource_url: "https://opendata.arcgis.com/datasets/0892f9a891614aaf82ea0fca5dc8b4d7_0.csv"
    format: csv
    publisher: "Office for National Statistics (ONS)"
    description: >
      ONS lookup table mapping local authority districts (LADs) to regions
      and countries for England, Wales, Scotland, and Northern Ireland.
    tags: [local-authority, reference, ons, geography, lookup]
