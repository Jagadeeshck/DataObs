services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment: [discovery.type=single-node, xpack.security.enabled=false, ES_JAVA_OPTS=-Xms1g -Xmx1g]
    ports: ["9200:9200"]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health"], interval: 10s, timeout: 5s, retries: 30}
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    environment: [ELASTICSEARCH_HOSTS=http://elasticsearch:9200]
    ports: ["5601:5601"]
    depends_on: {elasticsearch: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment: [DATAOBS_STORE_BACKEND=elasticsearch, ELASTICSEARCH_URL=http://elasticsearch:9200, DATAOBS_ALLOW_UNAUTHENTICATED_DEV=true]
    ports: ["8000:8000"]
    depends_on: {elasticsearch: {condition: service_healthy}}
  console:
    build: ui/dataobs-console
    ports: ["8080:8080"]
    depends_on: [api]
