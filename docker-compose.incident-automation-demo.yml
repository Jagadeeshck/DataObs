services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dataobs_demo_password
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  dataobs-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STORE_BACKEND: elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on: [elasticsearch]
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    depends_on: [postgres, dataobs-api]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
  mock-itsm:
    image: mendhak/http-https-echo:35
