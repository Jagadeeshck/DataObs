services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment: [discovery.type=single-node, xpack.security.enabled=false]
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    depends_on: [elasticsearch]
  postgres:
    image: postgres:16.9
    environment: [POSTGRES_PASSWORD=dataobs]
  airflow:
    image: apache/airflow:3.1.7
    profiles: [airflow-dbt]
    environment: [AIRFLOW__OPENLINEAGE__DISABLED=false]
