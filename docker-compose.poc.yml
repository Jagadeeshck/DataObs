# ============================================================
#  DataObs — POC Docker Compose  (Elastic Stack 9.3.3)
#  macOS-safe runtime profile for Docker Desktop
# ============================================================

x-es-env: &es-env
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
  ES_JAVA_OPTS:     "-Xms1g -Xmx1g"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es
    mem_limit: 3g
    environment:
      <<: *es-env
      node.name: es-poc
      cluster.name: dataobs-poc-unified
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.auto_create_index: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_poc_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks: [dataobs-poc]

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es-setup
    mem_limit: 512m
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        HOST=http://elasticsearch:9200
        AUTH="elastic:$${ELASTIC_PASSWORD}"
        curl -sf -X POST -u "$$AUTH" -H 'Content-Type: application/json' "$$HOST/_security/user/kibana_system/_password" -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" || true
        curl -sf -X PUT -u "$$AUTH" -H 'Content-Type: application/json' "$$HOST/_index_template/dataobs-test-data" -d '{"index_patterns":["dataobs-test-data*","dataobs-spark-results*","dataobs-lineage*"],"template":{"settings":{"number_of_shards":1,"number_of_replicas":0}}}' || true
    networks: [dataobs-poc]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-kibana
    mem_limit: 2g
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      SERVER_NAME: dataobs-poc-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "true"
      XPACK_FLEET_ENABLED: "true"
      XPACK_APM_ENABLED: "true"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["http://fleet-server:8220"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "dataobspoc9x32charenckey12345678"
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_poc_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks: [dataobs-poc]

  kibana-setup:
    image: curlimages/curl:latest
    container_name: dataobs-poc-kibana-setup
    mem_limit: 256m
    user: root
    restart: "no"
    networks: [dataobs-poc]
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELK_VERSION: ${ELK_VERSION:-9.3.3}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    volumes:
      - fleet_token:/fleet_token
      - agent_enrollment_token:/agent_enrollment_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KIBANA="http://kibana:5601"
        AUTH="elastic:$$ELASTIC_PASSWORD"
        i=0; until [ $$i -ge 30 ]; do HTTP=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$AUTH" -X POST "$$KIBANA/api/fleet/setup" -H "kbn-xsrf: true"); [ "$$HTTP" = "200" ] || [ "$$HTTP" = "201" ] && break; i=$$(($$i+1)); sleep 5; done
        curl -sf -u "$$AUTH" -X PUT "$$KIBANA/api/fleet/outputs/fleet-default-output" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"name":"default","type":"elasticsearch","hosts":["http://elasticsearch:9200"],"is_default":true,"is_default_monitoring":true}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/fleet_server_hosts" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"id":"default-fleet-server","name":"default","host_urls":["http://fleet-server:8220"],"is_default":true}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/agent_policies" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","monitoring_enabled":[],"is_default_fleet_server":true}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/epm/packages/fleet_server/1.6.0" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/package_policies" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"name":"fleet-server-1","namespace":"default","policy_id":"fleet-server-policy","package":{"name":"fleet_server","version":"1.6.0"},"inputs":[{"type":"fleet-server","enabled":true,"streams":[],"vars":{"max_agents":{"value":1000},"custom":{"value":""}}}]}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/agent_policies" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"id":"apm-agent-policy","name":"APM Agent Policy","namespace":"default","monitoring_enabled":[]}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/epm/packages/apm/$${ELK_VERSION}" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/package_policies" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"name\":\"apm-1\",\"namespace\":\"default\",\"policy_id\":\"apm-agent-policy\",\"package\":{\"name\":\"apm\",\"version\":\"$${ELK_VERSION}\"},\"inputs\":[{\"type\":\"apm\",\"enabled\":true,\"streams\":[],\"vars\":{\"host\":{\"value\":\"0.0.0.0:8200\"},\"url\":{\"value\":\"http://elastic-agent:8200\"},\"secret_token\":{\"value\":\"$${APM_SECRET_TOKEN}\"},\"api_key_enabled\":{\"value\":false},\"enable_rum\":{\"value\":true},\"tls_enabled\":{\"value\":false},\"tail_sampling_enabled\":{\"value\":false}}}]}" || true
        RESPONSE=$$(curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/enrollment_api_keys" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"name\":\"apm-agent-token-$$(date +%s)\",\"policy_id\":\"apm-agent-policy\"}")
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')
        printf '%s' "$$TOKEN" > /agent_enrollment_token/token.txt
        RESPONSE=$$(curl -sf -u "$$AUTH" -X POST "$$KIBANA/api/fleet/service_tokens" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"remote":false}')
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
        printf '%s' "$$TOKEN" > /fleet_token/token.txt

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-fleet-server
    mem_limit: 1g
    depends_on:
      es-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /fleet_token/token.txt
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      FLEET_SERVER_INSECURE_HTTP: true
    volumes:
      - fleet_token:/fleet_token:ro
      - fleet_data:/usr/share/elastic-agent/data
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [dataobs-poc]

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-elastic-agent
    mem_limit: 2g
    depends_on:
      fleet-server:
        condition: service_healthy
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "1"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_APM_SERVER_URL: http://0.0.0.0:8200
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - agent_data:/usr/share/elastic-agent/data
      - agent_enrollment_token:/agent_enrollment_token:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export FLEET_ENROLLMENT_TOKEN="$$(cat /agent_enrollment_token/token.txt)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8200/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [dataobs-poc]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dataobs-poc-cadvisor
    mem_limit: 512m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks: [dataobs-poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: dataobs-poc-otel
    mem_limit: 768m
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-poc.yaml:/etc/otel/config.yaml:ro
      # Mount host root so hostmetrics can report real host stats (not container-scoped)
      - /:/hostfs:ro
      # Mount Docker socket for container log tailing (filelog receiver)
      # On macOS Docker Desktop this path is inside the VM — logs are still captured
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      # Expose health check port for debugging: curl http://localhost:13133/
      - "13133:13133"
    environment:
      # NOTE: APM_SERVER_URL must NOT include http:// here — the
      # otel-collector-poc.yaml exporter prepends the scheme:
      #   endpoint: http://${env:APM_SERVER_URL}
      # The value below is the docker-compose service name + port only.
      APM_SERVER_URL: ${APM_SERVER_URL:-elastic-agent:8200}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      # Force Docker client API version negotiation to >= 1.40
      # Resolves: "client version 1.25 is too old. Minimum supported API version is 1.40"
      DOCKER_API_VERSION: "1.40"
      # Cloud resource attributes — set for AWS context even in local POC
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-aws}
      CLOUD_REGION: ${CLOUD_REGION:-eu-west-1}
      HOST_NAME: ${HOST_NAME:-dataobs-poc-host}
    depends_on:
      elastic-agent:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      # FIX: start_period bumped 20s → 90s and retries 8 → 15 to allow
      # the health_check extension time to bind port 13133 on cold starts.
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks: [dataobs-poc]

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: dataobs-poc-pipeline
    mem_limit: 4g
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      # FIX: changed otel-collector dependency from service_healthy → service_started.
      # The pipeline connects to OTLP ports 4317/4318 which are bound almost
      # immediately on startup — waiting for the health extension (port 13133)
      # to pass can cause `docker compose run --rm pipeline` to fail if the
      # collector is already Running but not yet Healthy.
      # The pipeline's OTLP SDK has built-in retry logic (OTEL_EXPORTER_OTLP_RETRY_*)
      # so occasional early-start misses are handled gracefully.
      otel-collector:
        condition: service_started
    environment:
      ELASTICHOST: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_URL: http://kibana:5601
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # FIX: explicitly set http/protobuf protocol so the Python OTLP SDK
      # matches the exporter protocol used by the collector → APM Server.
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: dataobs-pipeline
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc,service.namespace=dataobs
      # OTLP exporter retry settings — ensures pipeline traces are not lost
      # if the collector is still warming up when the pipeline starts.
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_LOGS_TIMEOUT: 30000
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 512
      OTEL_BSP_SCHEDULE_DELAY: 5000
      DATAOBS_CONFIG: /app/config/dataobs_poc.yaml
      DATAOBS_TENANT_ID: poc
      DATAOBS_STORE_BACKEND: elasticsearch
      SPARK_MASTER: local[*]
      PYTHONPATH: /app
      DEPLOYMENT_ENV: poc
      SPARK_SUBMIT_OPTS: >-
        -Dotel.service.name=spark-driver
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4318
        -Dotel.exporter.otlp.protocol=http/protobuf
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.resource.attributes=deployment.environment=poc,service.namespace=dataobs
    volumes:
      - ./config:/app/config:ro
      - ./kibana:/app/kibana:ro
      - poc_pipeline_tmp:/tmp/dataobs
    command: ["python", "-m", "src.poc.pipeline_runner"]
    restart: "no"
    networks: [dataobs-poc]

volumes:
  es_poc_data: { driver: local }
  kibana_poc_data: { driver: local }
  fleet_token: { driver: local }
  agent_enrollment_token: { driver: local }
  fleet_data: { driver: local }
  agent_data: { driver: local }
  poc_pipeline_tmp: { driver: local }

networks:
  dataobs-poc:
    driver: bridge
    name: dataobs-poc
