# ============================================================
#  DataObs — POC Docker Compose  (Elastic Stack 9.3.3)
#  macOS-safe runtime profile for Docker Desktop
#
#  FIX-SUMMARY (fix/elastic-agent-docker-monitoring-and-otel-network):
#  1. pipeline service: added explicit `networks: [dataobs-poc]` so
#     otel-collector hostname resolves correctly (was on default bridge).
#  2. elastic-agent: added Docker socket + privileged mode for Docker
#     integration metrics/logs collection via Fleet.
#  3. kibana-setup: installs Docker + System integrations on agent policy
#     so container telemetry flows into native .ds-metrics-*/logs-* streams.
#  4. otel-collector: docker_stats receiver added; elasticsearch exporter
#     added alongside APM so ALL signals are visible in Kibana Discover.
# ============================================================

x-es-env: &es-env
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
  ES_JAVA_OPTS:     "-Xms1g -Xmx1g"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es
    mem_limit: 3g
    environment:
      <<: *es-env
      node.name: es-poc
      cluster.name: dataobs-poc-unified
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.auto_create_index: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_poc_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks: [dataobs-poc]

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es-setup
    mem_limit: 512m
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        HOST=http://elasticsearch:9200
        AUTH="elastic:$${ELASTIC_PASSWORD}"
        # Set kibana_system password
        curl -sf -X POST -u "$$AUTH" -H 'Content-Type: application/json' \
          "$$HOST/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" || true
        # Index templates for pipeline data
        curl -sf -X PUT -u "$$AUTH" -H 'Content-Type: application/json' \
          "$$HOST/_index_template/dataobs-poc-data" \
          -d '{"index_patterns":["dataobs-test-data*","dataobs-spark-results*","dataobs-lineage*","dataobs-otel-*"],"template":{"settings":{"number_of_shards":1,"number_of_replicas":0}}}' || true
        # ILM policy for OTel signals (metrics, traces, logs)
        curl -sf -X PUT -u "$$AUTH" -H 'Content-Type: application/json' \
          "$$HOST/_ilm/policy/dataobs-otel-ilm" \
          -d '{"policy":{"phases":{"hot":{"actions":{"rollover":{"max_size":"5gb","max_age":"7d"}}},"delete":{"min_age":"30d","actions":{"delete":{}}}}}}' || true
    networks: [dataobs-poc]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-kibana
    mem_limit: 2g
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      SERVER_NAME: dataobs-poc-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "true"
      XPACK_FLEET_ENABLED: "true"
      XPACK_APM_ENABLED: "true"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["http://fleet-server:8220"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "dataobspoc9x32charenckey12345678"
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_poc_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks: [dataobs-poc]

  kibana-setup:
    image: curlimages/curl:latest
    container_name: dataobs-poc-kibana-setup
    mem_limit: 256m
    user: root
    restart: "no"
    networks: [dataobs-poc]
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELK_VERSION: ${ELK_VERSION:-9.3.3}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    volumes:
      - fleet_token:/fleet_token
      - agent_enrollment_token:/agent_enrollment_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KIBANA="http://kibana:5601"
        AUTH="elastic:$$ELASTIC_PASSWORD"

        # ── Wait for Fleet to be ready ────────────────────────────────────
        i=0
        until [ $$i -ge 30 ]; do
          HTTP=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$AUTH" \
            -X POST "$$KIBANA/api/fleet/setup" -H "kbn-xsrf: true")
          [ "$$HTTP" = "200" ] || [ "$$HTTP" = "201" ] && break
          i=$$(($$i+1)); sleep 5
        done

        # ── Default output → Elasticsearch ───────────────────────────────
        curl -sf -u "$$AUTH" \
          -X PUT "$$KIBANA/api/fleet/outputs/fleet-default-output" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"name":"default","type":"elasticsearch","hosts":["http://elasticsearch:9200"],"is_default":true,"is_default_monitoring":true}' || true

        # ── Fleet Server host ─────────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/fleet_server_hosts" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"default-fleet-server","name":"default","host_urls":["http://fleet-server:8220"],"is_default":true}' || true

        # ── Fleet Server policy ───────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","monitoring_enabled":[],"is_default_fleet_server":true}' || true

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/fleet_server/1.6.0" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"name":"fleet-server-1","namespace":"default","policy_id":"fleet-server-policy","package":{"name":"fleet_server","version":"1.6.0"},"inputs":[{"type":"fleet-server","enabled":true,"streams":[],"vars":{"max_agents":{"value":1000},"custom":{"value":""}}}]}' || true

        # ── DataObs Agent policy (APM + System + Docker) ──────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"dataobs-agent-policy","name":"DataObs Agent Policy","namespace":"default","monitoring_enabled":["logs","metrics"]}' || true

        # Install APM package
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/apm/$${ELK_VERSION}" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true

        # APM integration on dataobs-agent-policy
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"apm-1\",\"namespace\":\"default\",\"policy_id\":\"dataobs-agent-policy\",\"package\":{\"name\":\"apm\",\"version\":\"$${ELK_VERSION}\"},\"inputs\":[{\"type\":\"apm\",\"enabled\":true,\"streams\":[],\"vars\":{\"host\":{\"value\":\"0.0.0.0:8200\"},\"url\":{\"value\":\"http://elastic-agent:8200\"},\"secret_token\":{\"value\":\"$${APM_SECRET_TOKEN}\"},\"api_key_enabled\":{\"value\":false},\"enable_rum\":{\"value\":true},\"tls_enabled\":{\"value\":false},\"tail_sampling_enabled\":{\"value\":false}}}]}" || true

        # Install System package and add to agent policy
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/system/latest" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"name":"system-1","namespace":"default","policy_id":"dataobs-agent-policy","package":{"name":"system","version":"latest"},"inputs":[{"type":"logfile","enabled":true,"streams":[{"enabled":true,"data_stream":{"type":"logs","dataset":"system.syslog"},"vars":{"paths":{"value":["/var/log/syslog","/var/log/messages"]}}}]},{"type":"system/metrics","enabled":true,"streams":[{"enabled":true,"data_stream":{"type":"metrics","dataset":"system.cpu"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"system.memory"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"system.diskio"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"system.network"},"vars":{"period":{"value":"10s"}}}]}]}' || true

        # Install Docker package and add to agent policy
        # This enables container metrics, logs, and events via Elastic Agent
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/docker/latest" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"name":"docker-1","namespace":"default","policy_id":"dataobs-agent-policy","package":{"name":"docker","version":"latest"},"inputs":[{"type":"docker/metrics","enabled":true,"streams":[{"enabled":true,"data_stream":{"type":"metrics","dataset":"docker.container"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"docker.cpu"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"docker.memory"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"docker.network"},"vars":{"period":{"value":"10s"}}},{"enabled":true,"data_stream":{"type":"metrics","dataset":"docker.diskio"},"vars":{"period":{"value":"10s"}}}]},{"type":"logfile","enabled":true,"streams":[{"enabled":true,"data_stream":{"type":"logs","dataset":"docker.container_logs"},"vars":{"paths":{"value":["/var/lib/docker/containers/*/*-json.log"]}}}]}]}' || true

        # ── Generate enrollment tokens ─────────────────────────────────────
        # Token for dataobs-agent-policy (elastic-agent)
        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/enrollment_api_keys" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"dataobs-agent-token-$$(date +%s)\",\"policy_id\":\"dataobs-agent-policy\"}")
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*\"api_key\":\"\([^\"]*\)\".*/\1/p')
        printf '%s' "$$TOKEN" > /agent_enrollment_token/token.txt

        # Fleet Server service token
        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/service_tokens" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"remote":false}')
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*\"value\":\"\([^\"]*\)\".*/\1/p')
        printf '%s' "$$TOKEN" > /fleet_token/token.txt

        echo "[kibana-setup] Done — Fleet, APM, System, Docker integrations configured."

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-fleet-server
    mem_limit: 1g
    depends_on:
      es-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /fleet_token/token.txt
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      FLEET_SERVER_INSECURE_HTTP: true
    volumes:
      - fleet_token:/fleet_token:ro
      - fleet_data:/usr/share/elastic-agent/data
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [dataobs-poc]

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-elastic-agent
    mem_limit: 2g
    # FIX: privileged mode required for the Docker integration to access
    # /proc and cgroup stats per container, and for Elastic APM to bind 8200.
    privileged: true
    user: root
    depends_on:
      fleet-server:
        condition: service_healthy
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "1"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_APM_SERVER_URL: http://0.0.0.0:8200
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      # Docker integration needs DOCKER_HOST so the agent can talk to dockerd
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - agent_data:/usr/share/elastic-agent/data
      - agent_enrollment_token:/agent_enrollment_token:ro
      # FIX: mount Docker socket so the Docker integration can collect
      # container metrics, logs, and events via the Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount container logs for the Docker logfile input
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Mount /proc and /sys for system metrics collection
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export FLEET_ENROLLMENT_TOKEN="$$(cat /agent_enrollment_token/token.txt)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8200/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [dataobs-poc]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dataobs-poc-cadvisor
    mem_limit: 512m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks: [dataobs-poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: dataobs-poc-otel
    mem_limit: 768m
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-poc.yaml:/etc/otel/config.yaml:ro
      - /:/hostfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # FIX: mount Docker socket for docker_stats receiver
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      APM_SERVER_URL: ${APM_SERVER_URL:-elastic-agent:8200}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      DOCKER_API_VERSION: "1.41"
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-local}
      CLOUD_REGION: ${CLOUD_REGION:-local}
      HOST_NAME: ${HOST_NAME:-dataobs-poc-host}
    depends_on:
      elastic-agent:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks: [dataobs-poc]

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: dataobs-poc-pipeline
    mem_limit: 4g
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ELASTICHOST: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_URL: http://kibana:5601
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: dataobs-pipeline
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc,service.namespace=dataobs
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_LOGS_TIMEOUT: 30000
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 512
      OTEL_BSP_SCHEDULE_DELAY: 5000
      DATAOBS_CONFIG: /app/config/dataobs_poc.yaml
      DATAOBS_TENANT_ID: poc
      DATAOBS_STORE_BACKEND: elasticsearch
      SPARK_MASTER: local[*]
      PYTHONPATH: /app
      DEPLOYMENT_ENV: poc
      SPARK_SUBMIT_OPTS: >-
        -Dotel.service.name=spark-driver
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4318
        -Dotel.exporter.otlp.protocol=http/protobuf
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.resource.attributes=deployment.environment=poc,service.namespace=dataobs
    volumes:
      - ./config:/app/config:ro
      - ./kibana:/app/kibana:ro
      - poc_pipeline_tmp:/tmp/dataobs
    command: ["python", "-m", "src.poc.pipeline_runner"]
    restart: "no"
    # FIX (root cause of otel-collector DNS failure): pipeline must be on the
    # same Docker network as otel-collector so the hostname resolves.
    # Without this, `docker compose run --rm pipeline` attaches to the default
    # bridge network where otel-collector is NOT reachable by service name.
    networks: [dataobs-poc]

volumes:
  es_poc_data: { driver: local }
  kibana_poc_data: { driver: local }
  fleet_token: { driver: local }
  agent_enrollment_token: { driver: local }
  fleet_data: { driver: local }
  agent_data: { driver: local }
  poc_pipeline_tmp: { driver: local }

networks:
  dataobs-poc:
    driver: bridge
    name: dataobs-poc
