# ============================================================
#  DataObs — POC Docker Compose  (Elastic Stack 9.3.3)
#  UNIFIED: Single ES cluster for Observability + Test Data
#
#  Full observability stack:
#    Elasticsearch + Kibana + Fleet Server + Elastic Agent
#    (APM Server built-in to ES 9.x) + OTel Collector + Pipeline
#    + cAdvisor (Docker container metrics)
#
#  ┌─ Elasticsearch — Unified Cluster ──────────────────────────┐
#  │  SINGLE cluster serves BOTH:                               │
#  │  1. Observability: traces-apm-*, metrics-otel-*, logs-otel-│
#  │  2. Test Data:     dataobs-test-data, dataobs-spark-results │
#  │                    dataobs-lineage                          │
#  └─────────────────────────────────────────────────────────────┘
#
#  ┌─ Docker Environment Monitoring ────────────────────────────┐
#  │  cAdvisor  → OTel Collector (Prometheus scrape :8080)      │
#  │  hostmetrics receiver → CPU/memory/disk/network of host    │
#  │  docker_stats receiver → per-container resource usage      │
#  └─────────────────────────────────────────────────────────────┘
#
#  ┌─ Spark Instrumentation ─────────────────────────────────────┐
#  │  pipeline container runs pipeline_runner.py                 │
#  │  SparkOtelInstrumentation wraps every Spark job             │
#  │  → traces, metrics, logs all flow via OTel Collector        │
#  │  → visible in Kibana APM Services + Metrics Explorer        │
#  └─────────────────────────────────────────────────────────────┘
#
#  Service startup order:
#    1. elasticsearch   — single-node, security enabled
#    2. es-setup        — one-shot: sets passwords + ILM policies
#    3. kibana          — waits for es-setup
#    4. kibana-setup    — fleet + APM integration bootstrap
#    5. fleet-server    — waits for kibana-setup
#    6. elastic-agent   — APM :8200, waits for fleet-server
#    7. cadvisor        — Docker host metrics
#    8. otel-collector  — waits for elasticsearch + elastic-agent
#    9. pipeline        — waits for all above (run-once)
#
#  Quick start:
#    cp .env.poc .env.poc.local
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local \
#      up -d elasticsearch kibana fleet-server elastic-agent cadvisor otel-collector
#    # wait ~90s for healthy, then:
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local \
#      run --rm pipeline
#
#  Tear down:
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local down -v
# ============================================================

x-es-env: &es-env
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
  ES_JAVA_OPTS:     "-Xms1g -Xmx1g"

services:

  # ──────────────────────────────────────────────────────────
  # 1. Elasticsearch 9.3.3 — UNIFIED cluster
  #    Single cluster for: observability data + test/pipeline data
  # ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es
    mem_limit: 3g
    environment:
      <<: *es-env
      node.name: es-poc
      cluster.name: dataobs-poc-unified
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # Allow both observability data streams and custom indices
      action.auto_create_index: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_poc_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    labels:
      com.dataobs.service: "elasticsearch"
      com.dataobs.role: "unified-store"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -s -u elastic:${ELASTIC_PASSWORD} \
            http://localhost:9200/_cluster/health \
            | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 2. ES Setup — creates test-data indices + ILM policies
  # ──────────────────────────────────────────────────────────
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es-setup
    mem_limit: 512m
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        HOST=http://elasticsearch:9200
        AUTH="elastic:$${ELASTIC_PASSWORD}"

        echo "[es-setup] Setting kibana_system password..."
        curl -sf -X POST -u "$$AUTH" \
          -H 'Content-Type: application/json' \
          "$$HOST/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
        echo " done."

        echo "[es-setup] Creating test-data index template..."
        curl -sf -X PUT -u "$$AUTH" \
          -H 'Content-Type: application/json' \
          "$$HOST/_index_template/dataobs-test-data" \
          -d '{
            "index_patterns": ["dataobs-test-data*", "dataobs-spark-results*", "dataobs-lineage*"],
            "template": {
              "settings": {"number_of_shards": 1, "number_of_replicas": 0},
              "mappings": {
                "properties": {
                  "@timestamp":    {"type": "date"},
                  "run_id":        {"type": "keyword"},
                  "record_id":     {"type": "long"},
                  "value":         {"type": "double"},
                  "value_doubled": {"type": "double"},
                  "source":        {"type": "keyword"},
                  "tenant":        {"type": "keyword"},
                  "lineage_type":  {"type": "keyword"},
                  "pipeline":      {"type": "keyword"}
                }
              }
            }
          }' || echo "[es-setup] index template already exists"

        echo "[es-setup] Creating otel-metrics index template..."
        curl -sf -X PUT -u "$$AUTH" \
          -H 'Content-Type: application/json' \
          "$$HOST/_index_template/metrics-otel-poc" \
          -d '{
            "index_patterns": ["metrics-otel-poc*"],
            "template": {
              "settings": {"number_of_shards": 1, "number_of_replicas": 0}
            }
          }' || echo "[es-setup] otel-metrics template already exists"

        echo "[es-setup] Done."
    networks:
      - dataobs-poc
    restart: "no"

  # ──────────────────────────────────────────────────────────
  # 3. Kibana 9.3.3
  # ──────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-kibana
    mem_limit: 2g
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      SERVER_NAME: dataobs-poc-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "true"
      XPACK_FLEET_ENABLED: "true"
      XPACK_APM_ENABLED: "true"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["http://fleet-server:8220"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "dataobspoc9x32charenckey12345678"
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_poc_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    labels:
      com.dataobs.service: "kibana"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -s http://localhost:5601/api/status \
            | grep -q '"level":"available"'
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks:
      - dataobs-poc

  # ─────────────────────────────────────────────────────────
  # 3.5. Kibana Fleet Setup
  # ─────────────────────────────────────────────────────────
  kibana-setup:
    image: curlimages/curl:latest
    container_name: dataobs-poc-kibana-setup
    mem_limit: 256m
    user: root
    restart: "no"
    networks:
      - dataobs-poc
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELK_VERSION: ${ELK_VERSION:-9.3.3}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    volumes:
      - fleet_token:/fleet_token
      - agent_enrollment_token:/agent_enrollment_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KIBANA="http://kibana:5601"
        AUTH="elastic:$$ELASTIC_PASSWORD"

        echo "[kibana-setup] Waiting for Fleet API to be ready..."
        RETRIES=30
        i=0
        while [ $$i -lt $$RETRIES ]; do
          HTTP=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$AUTH" \
            -X POST "$$KIBANA/api/fleet/setup" \
            -H "kbn-xsrf: true")
          if [ "$$HTTP" = "200" ] || [ "$$HTTP" = "201" ]; then
            echo "[kibana-setup] Fleet setup OK (HTTP $$HTTP)"
            break
          fi
          i=$$(($$i+1))
          echo "[kibana-setup] Fleet not ready (HTTP $$HTTP), attempt $$i/$$RETRIES, retrying in 5s..."
          sleep 5
          if [ $$i -eq $$RETRIES ]; then
            echo "[kibana-setup] ERROR: Fleet setup failed after $$RETRIES attempts"
            exit 1
          fi
        done

        echo "[kibana-setup] Configuring Fleet default Elasticsearch output..."
        curl -sf -u "$$AUTH" \
          -X PUT "$$KIBANA/api/fleet/outputs/fleet-default-output" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"name":"default","type":"elasticsearch","hosts":["http://elasticsearch:9200"],"is_default":true,"is_default_monitoring":true}' \
          || echo "[kibana-setup] Fleet output update skipped, continuing."

        echo "[kibana-setup] Configuring Fleet Server host..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/fleet_server_hosts" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"id":"default-fleet-server","name":"default","host_urls":["http://fleet-server:8220"],"is_default":true}' \
          || echo "[kibana-setup] Fleet Server host already exists, continuing."

        echo "[kibana-setup] Creating fleet-server-policy..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","monitoring_enabled":[],"is_default_fleet_server":true}' \
          || echo "[kibana-setup] Policy already exists, continuing."

        echo "[kibana-setup] Installing Fleet Server integration..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/fleet_server/1.6.0" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{}' \
          || echo "[kibana-setup] Fleet Server integration already installed, continuing."

        echo "[kibana-setup] Attaching Fleet Server integration to policy..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"name":"fleet-server-1","namespace":"default","policy_id":"fleet-server-policy","package":{"name":"fleet_server","version":"1.6.0"},"inputs":[{"type":"fleet-server","enabled":true,"streams":[],"vars":{"max_agents":{"value":1000},"custom":{"value":""}}}]}' \
          || echo "[kibana-setup] Fleet Server package policy already exists, continuing."

        echo "[kibana-setup] Creating APM agent policy..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"id":"apm-agent-policy","name":"APM Agent Policy","namespace":"default","monitoring_enabled":[]}' \
          || echo "[kibana-setup] APM agent policy already exists, continuing."

        echo "[kibana-setup] Installing APM integration..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/apm/$${ELK_VERSION}" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{}' \
          || echo "[kibana-setup] APM integration already installed, continuing."

        echo "[kibana-setup] Attaching APM integration to agent policy..."
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"apm-1\",\"namespace\":\"default\",\"policy_id\":\"apm-agent-policy\",\"package\":{\"name\":\"apm\",\"version\":\"$${ELK_VERSION}\"},\"inputs\":[{\"type\":\"apm\",\"enabled\":true,\"streams\":[],\"vars\":{\"host\":{\"value\":\"0.0.0.0:8200\"},\"url\":{\"value\":\"http://elastic-agent:8200\"},\"secret_token\":{\"value\":\"$${APM_SECRET_TOKEN}\"},\"api_key_enabled\":{\"value\":false},\"enable_rum\":{\"value\":true},\"tls_enabled\":{\"value\":false},\"tail_sampling_enabled\":{\"value\":false}}}]}" \
          || echo "[kibana-setup] APM package policy already exists, continuing."

        echo "[kibana-setup] Creating APM agent enrollment token..."
        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/enrollment_api_keys" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"apm-agent-token-$$(date +%s)\",\"policy_id\":\"apm-agent-policy\"}")
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then
          echo "[kibana-setup] ERROR: APM enrollment token extraction failed. Response: $$RESPONSE"
          exit 1
        fi
        printf '%s' "$$TOKEN" > /agent_enrollment_token/token.txt
        chmod 644 /agent_enrollment_token/token.txt
        echo "[kibana-setup] APM enrollment token written."

        echo "[kibana-setup] Creating Fleet service token..."
        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/service_tokens" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{"remote":false}')
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then
          echo "[kibana-setup] ERROR: token extraction failed. Response: $$RESPONSE"
          exit 1
        fi
        printf '%s' "$$TOKEN" > /fleet_token/token.txt
        chmod 644 /fleet_token/token.txt
        echo "[kibana-setup] Done."

  # ───────────────────────────────────────────────────────────
  # 4. Fleet Server
  # ──────────────────────────────────────────────────────────
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-fleet-server
    mem_limit: 1g
    depends_on:
      es-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /fleet_token/token.txt
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      FLEET_SERVER_INSECURE_HTTP: true
    volumes:
      - fleet_token:/fleet_token:ro
      - fleet_data:/usr/share/elastic-agent/data
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 5. Elastic Agent — APM Server
  # ──────────────────────────────────────────────────────────
  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-elastic-agent
    mem_limit: 2g
    depends_on:
      fleet-server:
        condition: service_healthy
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "1"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_APM_SERVER_URL: http://0.0.0.0:8200
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - agent_data:/usr/share/elastic-agent/data
      - agent_enrollment_token:/agent_enrollment_token:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export FLEET_ENROLLMENT_TOKEN="$$(cat /agent_enrollment_token/token.txt)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    ports:
      - "8200:8200"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8200/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 6. cAdvisor — Docker container resource metrics
  #    Exports per-container CPU/memory/network/filesystem
  #    metrics via Prometheus endpoint :8080
  #    OTel Collector scrapes this via the prometheus receiver.
  # ──────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dataobs-poc-cadvisor
    mem_limit: 512m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    labels:
      com.dataobs.service: "cadvisor"
      com.dataobs.role: "docker-monitoring"
    networks:
      - dataobs-poc
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # 7. OpenTelemetry Collector (contrib 0.99.0)
  #    - Receives OTLP from pipeline + Spark jobs
  #    - Scrapes cAdvisor Prometheus endpoint
  #    - Collects host metrics + docker_stats
  #    - Routes to ES (metrics) + APM (traces/logs)
  # ──────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: dataobs-poc-otel
    mem_limit: 1g
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-poc.yaml:/etc/otel/config.yaml:ro
      # Mount Docker socket so docker_stats receiver can connect
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics (Prometheus)
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICHOST: http://elasticsearch:9200
      APM_SERVER_URL: elastic-agent:8200
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-agent:
        condition: service_healthy
      cadvisor:
        condition: service_started
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - dataobs-poc
    labels:
      com.dataobs.service: "otel-collector"

  # ──────────────────────────────────────────────────────────
  # 8. DataObs POC Pipeline (run-once)
  #    Now uses pipeline_runner.py with full OTel instrumentation
  #    including Spark job spans visible in Kibana APM
  # ──────────────────────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: dataobs-poc-pipeline
    mem_limit: 4g
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      ELASTICHOST:                    http://elasticsearch:9200
      ELASTIC_PASSWORD:               ${ELASTIC_PASSWORD}
      KIBANA_URL:                     http://kibana:5601
      OTEL_EXPORTER_OTLP_ENDPOINT:   http://otel-collector:4318
      OTEL_SERVICE_NAME:              dataobs-pipeline
      OTEL_RESOURCE_ATTRIBUTES:       "deployment.environment=poc,service.namespace=dataobs"
      DATAOBS_CONFIG:                 /app/config/dataobs_poc.yaml
      DATAOBS_TENANT_ID:              poc
      DATAOBS_STORE_BACKEND:          elasticsearch
      SPARK_MASTER:                   "local[*]"
      PYTHONPATH:                     /app
      DEPLOYMENT_ENV:                 poc
      # Spark OTel Java agent (ships in Dockerfile.poc)
      SPARK_SUBMIT_OPTS: >-
        -Dotel.service.name=spark-driver
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4318
        -Dotel.exporter.otlp.protocol=http/protobuf
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.resource.attributes=deployment.environment=poc,service.namespace=dataobs
    volumes:
      - ./config:/app/config:ro
      - ./kibana:/app/kibana:ro
      - poc_pipeline_tmp:/tmp/dataobs
    command: ["python", "-m", "src.poc.pipeline_runner"]
    restart: "no"
    networks:
      - dataobs-poc
    labels:
      com.dataobs.service: "pipeline"
      com.dataobs.role: "data-pipeline"

volumes:
  es_poc_data:            { driver: local }
  kibana_poc_data:        { driver: local }
  fleet_token:            { driver: local }
  agent_enrollment_token: { driver: local }
  fleet_data:             { driver: local }
  agent_data:             { driver: local }
  poc_pipeline_tmp:       { driver: local }

networks:
  dataobs-poc:
    driver: bridge
    name: dataobs-poc
