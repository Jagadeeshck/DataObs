# ============================================================
#  DataObs — POC Docker Compose  (Elastic Stack 9.3.3)
#  Full observability stack:
#    Elasticsearch + Kibana + Fleet Server + Elastic Agent
#    (APM Server built-in to ES 9.x) + OTel Collector + Pipeline
#
#  ┌─ APM Architecture note ─────────────────────────────────┐
#  │  In Elastic Stack 9.x, APM Server is NOT a separate     │
#  │  container. It runs inside Elastic Agent, managed by     │
#  │  Fleet Server. The APM intake is on port 8200 and        │
#  │  accepts both Elastic APM protocol and OTLP natively.    │
#  └─────────────────────────────────────────────────────────┘
#
#  IMPORTANT — Elastic Agent image path changed in 9.x:
#    OLD (8.x): docker.elastic.co/beats/elastic-agent
#    NEW (9.x): docker.elastic.co/elastic-agent/elastic-agent
#
#  Service startup order (auto-managed via healthchecks):
#    1. elasticsearch   — single-node, security enabled
#    2. es-setup        — one-shot: sets passwords + Fleet token
#    3. kibana          — waits for es-setup completion
#    4. fleet-server    — waits for es-setup + kibana healthy
#    5. elastic-agent   — waits for fleet-server healthy (APM :8200)
#    6. otel-collector  — waits for elasticsearch + elastic-agent
#    7. pipeline        — waits for all above (run-once)
#
#  Quick start:
#    cp .env.poc .env.poc.local
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local \
#      up -d elasticsearch kibana fleet-server elastic-agent otel-collector
#    # wait ~60-90s for healthy, then:
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local \
#      run --rm pipeline
#
#  Tear down (removes all volumes):
#    docker compose -f docker-compose.poc.yml --env-file .env.poc.local down -v
# ============================================================

x-es-env: &es-env
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
  ES_JAVA_OPTS:     "-Xms768m -Xmx768m"

services:

  # ──────────────────────────────────────────────────────────
  # 1. Elasticsearch 9.3.3
  # ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es
    environment:
      <<: *es-env
      node.name: es-poc
      cluster.name: dataobs-poc
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      xpack.fleet.enabled: "true"
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_poc_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -s -u elastic:${ELASTIC_PASSWORD} \
            http://localhost:9200/_cluster/health \
            | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 2. ES Setup (one-shot init container)
  #    Runs once after ES is healthy:
  #      a) Sets kibana_system password
  #      b) Creates Fleet service token → writes to shared volume
  #
  #    NOTE: $$ is used for shell variables (AUTH, HOST, TOKEN)
  #    to prevent Docker Compose interpolating them as Compose vars.
  # ──────────────────────────────────────────────────────────
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
    volumes:
      - fleet_token:/fleet_token
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        HOST=http://elasticsearch:9200
        AUTH="elastic:$${ELASTIC_PASSWORD}"

        echo "[es-setup] Setting kibana_system password..."
        curl -sf -X POST -u "$$AUTH" \
          -H 'Content-Type: application/json' \
          "$$HOST/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
        echo " done."

        echo "[es-setup] Creating Fleet service token..."
        TOKEN=$(curl -sf -X POST -u "$$AUTH" \
          "$$HOST/_security/service/elastic/fleet-server/credential/token/poc-fleet-token" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['token']['value'])")
        echo "$$TOKEN" > /fleet_token/token.txt
        echo "[es-setup] Fleet token written to /fleet_token/token.txt"
        echo "[es-setup] Done."
    networks:
      - dataobs-poc
    restart: "no"

  # ──────────────────────────────────────────────────────────
  # 3. Kibana 9.3.3
  # ──────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-kibana
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      SERVER_NAME: dataobs-poc-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "true"
      XPACK_FLEET_ENABLED: "true"
      XPACK_APM_ENABLED: "true"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "dataobs-poc-9x-32char-enc-key!!"
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_poc_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -s http://localhost:5601/api/status \
            | grep -q '"level":"available"'
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 4. Fleet Server
  #    Uses elastic-agent/elastic-agent image (new 9.x path).
  #    Reads Fleet token from shared volume written by es-setup.
  # ──────────────────────────────────────────────────────────
  fleet-server:
    # NEW 9.x image path: elastic-agent/elastic-agent (not beats/elastic-agent)
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-fleet-server
    depends_on:
      es-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /fleet_token/token.txt
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - fleet_token:/fleet_token:ro
      - fleet_data:/usr/share/elastic-agent/data
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 5. Elastic Agent — APM Server (ES 9.x integrated)
  #    NEW 9.x image path: elastic-agent/elastic-agent
  #    Exposes APM intake on port 8200.
  #    Accepts: Elastic APM protocol + OTLP gRPC/HTTP natively.
  #    Traces land in traces-apm-* → Kibana APM UI.
  # ──────────────────────────────────────────────────────────
  elastic-agent:
    # NEW 9.x image path: elastic-agent/elastic-agent (not beats/elastic-agent)
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.3.3}
    container_name: dataobs-poc-elastic-agent
    depends_on:
      fleet-server:
        condition: service_healthy
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_ENROLLMENT_TOKEN: ${FLEET_ENROLLMENT_TOKEN:-}
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_APM_SERVER_URL: http://0.0.0.0:8200
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - agent_data:/usr/share/elastic-agent/data
    ports:
      - "8200:8200"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/ | grep -q 'apm-server'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 6. OpenTelemetry Collector (contrib 0.99.0)
  #    Receives OTLP from the pipeline and routes:
  #      traces  → Elastic Agent APM :8200 (otlp/apm exporter)
  #      metrics → Elasticsearch :9200 directly
  #      logs    → Elasticsearch :9200 directly
  # ──────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: dataobs-poc-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-poc.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics (Prometheus)
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICHOST: http://elasticsearch:9200
      APM_SERVER_URL: http://elastic-agent:8200
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - dataobs-poc

  # ──────────────────────────────────────────────────────────
  # 7. DataObs POC Pipeline (run-once)
  #    Run manually after the stack is healthy:
  #      docker compose -f docker-compose.poc.yml \
  #        --env-file .env.poc.local run --rm pipeline
  # ──────────────────────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: dataobs-poc-pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      ELASTICHOST:                    http://elasticsearch:9200
      ELASTIC_PASSWORD:               ${ELASTIC_PASSWORD}
      KIBANA_URL:                     http://kibana:5601
      OTEL_EXPORTER_OTLP_ENDPOINT:   http://otel-collector:4318
      DATAOBS_CONFIG:                 /app/config/dataobs_poc.yaml
      DATAOBS_TENANT_ID:              poc
      DATAOBS_STORE_BACKEND:          elasticsearch
      SPARK_MASTER:                   "local[*]"
      PYTHONPATH:                     /app
    volumes:
      - ./config:/app/config:ro
      - ./kibana:/app/kibana:ro
      - poc_pipeline_tmp:/tmp/dataobs
    command: ["/app/scripts/run_poc_pipeline.sh"]
    restart: "no"
    networks:
      - dataobs-poc

volumes:
  es_poc_data:       { driver: local }
  kibana_poc_data:   { driver: local }
  fleet_token:       { driver: local }
  fleet_data:        { driver: local }
  agent_data:        { driver: local }
  poc_pipeline_tmp:  { driver: local }

networks:
  dataobs-poc:
    driver: bridge
    name: dataobs-poc
