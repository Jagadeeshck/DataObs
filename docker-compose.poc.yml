# ============================================================
#  DataObs — POC Docker Compose  (Elastic Stack 9.4.0)
#  macOS-safe runtime profile for Docker Desktop
#
#  FIX-SUMMARY (fix/poc-elastic-otel-data-ingest):
#  1. Elastic stack bumped to 9.4.0 (latest); single ELK_VERSION variable
#     drives every Elastic image so future bumps are one-line changes.
#  2. Single-node Elasticsearch (service `es01`, discovery.type=single-node)
#     for local POC simplicity. ES 9.x requires transport TLS once the
#     cluster bootstraps with multiple master-eligible nodes; single-node
#     mode skips that bootstrap check entirely so the POC starts cleanly
#     on a laptop. Production / AWS reference architecture uses a
#     multi-node cluster with proper transport TLS / cert setup — see
#     docs/poc-setup.md for the upgrade path.
#  3. Fleet "package version was not a valid semver" fixed: every
#     package_policies POST now references PINNED versions (resolved
#     dynamically from the registry) instead of the literal string
#     "latest", which Fleet's splitPkgKey rejects.
#  4. Spark/pipeline data is bulk-indexed into well-defined POC indices
#     (dataobs-poc-*) with explicit mappings via es-setup, plus the
#     data-observability indices used by Soda/Monte-Carlo/Acceldata
#     style monitors (assets/quality/freshness/volume/schema/lineage/alerts).
#  5. Verification script `scripts/verify_poc.sh` + Make-style helpers
#     so the user can confirm indices, schemas and document counts.
# ============================================================

services:
  # ── Elasticsearch — single-node POC ──────────────────────────
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.4.0}
    container_name: dataobs-poc-es01
    mem_limit: ${ES_MEM_LIMIT:-2g}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
      ES_JAVA_OPTS:     "-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}"
      cluster.name: dataobs-poc-unified
      node.name: es01
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: trial
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.auto_create_index: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es01_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks: [dataobs-poc]

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.4.0}
    container_name: dataobs-poc-es-setup
    mem_limit: 512m
    user: root
    depends_on:
      es01: { condition: service_healthy }
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD:  ${KIBANA_PASSWORD}
    volumes:
      - ./config/elasticsearch/poc-templates.json:/setup/poc-templates.json:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        HOST=http://es01:9200
        AUTH="elastic:$${ELASTIC_PASSWORD}"

        # ── kibana_system password ──────────────────────────────────────
        curl -sf -X POST -u "$$AUTH" -H 'Content-Type: application/json' \
          "$$HOST/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" || true

        # ── ILM policies ────────────────────────────────────────────────
        curl -sf -X PUT -u "$$AUTH" -H 'Content-Type: application/json' \
          "$$HOST/_ilm/policy/dataobs-otel-ilm" \
          -d '{"policy":{"phases":{"hot":{"actions":{"rollover":{"max_size":"5gb","max_age":"7d"}}},"delete":{"min_age":"30d","actions":{"delete":{}}}}}}' || true

        # ── Index templates: POC data + observability monitors ──────────
        # poc-templates.json has every template/mapping in one file so it is
        # easy to inspect/update. See config/elasticsearch/poc-templates.json.
        for tpl in $$(jq -c '.templates[]' /setup/poc-templates.json 2>/dev/null || cat /setup/poc-templates.json | python3 -c 'import sys,json;[print(json.dumps(t)) for t in json.load(sys.stdin)["templates"]]'); do
          NAME=$$(echo "$$tpl" | python3 -c 'import sys,json;print(json.load(sys.stdin)["name"])')
          BODY=$$(echo "$$tpl" | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin)["body"]))')
          curl -sf -X PUT -u "$$AUTH" -H 'Content-Type: application/json' \
            "$$HOST/_index_template/$$NAME" -d "$$BODY" \
            && echo "[es-setup] template: $$NAME" \
            || echo "[es-setup] FAILED template: $$NAME"
        done
    networks: [dataobs-poc]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.4.0}
    container_name: dataobs-poc-kibana
    mem_limit: 2g
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: '["http://es01:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      SERVER_NAME: dataobs-poc-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "true"
      XPACK_FLEET_ENABLED: "true"
      XPACK_APM_ENABLED: "true"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://es01:9200"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["http://fleet-server:8220"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "dataobspoc9x32charenckey12345678"
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_poc_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks: [dataobs-poc]

  # ── Fleet bootstrap (FIXED: pin every package version) ────────
  # Root cause of the original Fleet error
  #   "Package key parsing failed: package version was not a valid semver"
  # was that package_policies POST bodies contained `"version":"latest"`.
  # Fleet's splitPkgKey() requires a real semver such as "9.4.0". The
  # epm/packages/<pkg>/latest install-from-registry endpoint accepts
  # "latest" as a path segment, but the package_policies API does not.
  # We now resolve the installed version once and reuse it everywhere.
  kibana-setup:
    image: curlimages/curl:latest
    container_name: dataobs-poc-kibana-setup
    mem_limit: 256m
    user: root
    restart: "no"
    networks: [dataobs-poc]
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELK_VERSION: ${ELK_VERSION:-9.4.0}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
    volumes:
      - fleet_token:/fleet_token
      - agent_enrollment_token:/agent_enrollment_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KIBANA="http://kibana:5601"
        AUTH="elastic:$$ELASTIC_PASSWORD"

        # Helper to resolve the version of an installed Fleet package.
        # Fleet's package_policies API rejects "latest" as a version, so
        # we install via /epm/packages/<pkg> (which accepts "latest") and
        # then read back the actual semver before creating the policy.
        resolve_pkg_version() {
          PKG="$$1"
          for try in 1 2 3 4 5; do
            VER=$$(curl -sf -u "$$AUTH" -H "kbn-xsrf: true" \
              "$$KIBANA/api/fleet/epm/packages/$$PKG" \
              | sed -n 's/.*"latestVersion":"\([^"]*\)".*/\1/p' | head -n1)
            [ -n "$$VER" ] && echo "$$VER" && return 0
            sleep 3
          done
          echo "0.0.0"
        }

        # ── Wait for Fleet setup endpoint ──────────────────────────────
        i=0
        until [ $$i -ge 30 ]; do
          HTTP=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$AUTH" \
            -X POST "$$KIBANA/api/fleet/setup" -H "kbn-xsrf: true")
          [ "$$HTTP" = "200" ] || [ "$$HTTP" = "201" ] && break
          i=$$(($$i+1)); sleep 5
        done

        # ── Default output → ES (single-node POC) ──────────────────────
        curl -sf -u "$$AUTH" \
          -X PUT "$$KIBANA/api/fleet/outputs/fleet-default-output" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"name":"default","type":"elasticsearch","hosts":["http://es01:9200"],"is_default":true,"is_default_monitoring":true}' || true

        # ── Fleet Server host ───────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/fleet_server_hosts" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"default-fleet-server","name":"default","host_urls":["http://fleet-server:8220"],"is_default":true}' || true

        # ── Fleet Server policy ─────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","monitoring_enabled":[],"is_default_fleet_server":true}' || true

        # Install fleet_server package via "latest" path-segment, then
        # resolve the real version for the package_policies POST.
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/fleet_server" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        FLEET_SERVER_VER=$$(resolve_pkg_version fleet_server)
        echo "[kibana-setup] fleet_server pkg version: $$FLEET_SERVER_VER"

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"fleet-server-1\",\"namespace\":\"default\",\"policy_id\":\"fleet-server-policy\",\"package\":{\"name\":\"fleet_server\",\"version\":\"$${FLEET_SERVER_VER}\"},\"inputs\":[{\"type\":\"fleet-server\",\"enabled\":true,\"streams\":[],\"vars\":{\"max_agents\":{\"value\":1000},\"custom\":{\"value\":\"\"}}}]}" || true

        # ── DataObs Agent policy ────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/agent_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"dataobs-agent-policy","name":"DataObs Agent Policy","namespace":"default","monitoring_enabled":["logs","metrics"]}' || true

        # ── APM package (version follows ELK_VERSION) ──────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/apm" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        APM_VER=$$(resolve_pkg_version apm)
        echo "[kibana-setup] apm pkg version: $$APM_VER"

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"apm-1\",\"namespace\":\"default\",\"policy_id\":\"dataobs-agent-policy\",\"package\":{\"name\":\"apm\",\"version\":\"$${APM_VER}\"},\"inputs\":[{\"type\":\"apm\",\"enabled\":true,\"streams\":[],\"vars\":{\"host\":{\"value\":\"0.0.0.0:8200\"},\"url\":{\"value\":\"http://elastic-agent:8200\"},\"secret_token\":{\"value\":\"$${APM_SECRET_TOKEN}\"},\"api_key_enabled\":{\"value\":false},\"enable_rum\":{\"value\":true},\"tls_enabled\":{\"value\":false},\"tail_sampling_enabled\":{\"value\":false}}}]}" || true

        # ── System integration ─────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/system" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        SYS_VER=$$(resolve_pkg_version system)
        echo "[kibana-setup] system pkg version: $$SYS_VER"

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"system-1\",\"namespace\":\"default\",\"policy_id\":\"dataobs-agent-policy\",\"package\":{\"name\":\"system\",\"version\":\"$${SYS_VER}\"},\"inputs\":[{\"type\":\"logfile\",\"enabled\":true,\"streams\":[{\"enabled\":true,\"data_stream\":{\"type\":\"logs\",\"dataset\":\"system.syslog\"},\"vars\":{\"paths\":{\"value\":[\"/var/log/syslog\",\"/var/log/messages\"]}}}]},{\"type\":\"system/metrics\",\"enabled\":true,\"streams\":[{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"system.cpu\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"system.memory\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"system.diskio\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"system.network\"},\"vars\":{\"period\":{\"value\":\"10s\"}}}]}]}" || true

        # ── Docker integration ────────────────────────────────────────
        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/epm/packages/docker" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{}' || true
        DOCKER_VER=$$(resolve_pkg_version docker)
        echo "[kibana-setup] docker pkg version: $$DOCKER_VER"

        curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/package_policies" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"docker-1\",\"namespace\":\"default\",\"policy_id\":\"dataobs-agent-policy\",\"package\":{\"name\":\"docker\",\"version\":\"$${DOCKER_VER}\"},\"inputs\":[{\"type\":\"docker/metrics\",\"enabled\":true,\"streams\":[{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"docker.container\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"docker.cpu\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"docker.memory\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"docker.network\"},\"vars\":{\"period\":{\"value\":\"10s\"}}},{\"enabled\":true,\"data_stream\":{\"type\":\"metrics\",\"dataset\":\"docker.diskio\"},\"vars\":{\"period\":{\"value\":\"10s\"}}}]},{\"type\":\"logfile\",\"enabled\":true,\"streams\":[{\"enabled\":true,\"data_stream\":{\"type\":\"logs\",\"dataset\":\"docker.container_logs\"},\"vars\":{\"paths\":{\"value\":[\"/var/lib/docker/containers/*/*-json.log\"]}}}]}]}" || true

        # ── Tokens ─────────────────────────────────────────────────────
        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/enrollment_api_keys" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d "{\"name\":\"dataobs-agent-token-$$(date +%s)\",\"policy_id\":\"dataobs-agent-policy\"}")
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*\"api_key\":\"\([^\"]*\)\".*/\1/p')
        printf '%s' "$$TOKEN" > /agent_enrollment_token/token.txt

        RESPONSE=$$(curl -sf -u "$$AUTH" \
          -X POST "$$KIBANA/api/fleet/service_tokens" \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"remote":false}')
        TOKEN=$$(echo "$$RESPONSE" | sed -n 's/.*\"value\":\"\([^\"]*\)\".*/\1/p')
        printf '%s' "$$TOKEN" > /fleet_token/token.txt

        echo "[kibana-setup] Done — Fleet, APM, System, Docker integrations configured (versions pinned)."

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.4.0}
    container_name: dataobs-poc-fleet-server
    mem_limit: 1g
    depends_on:
      es-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://es01:9200
      FLEET_SERVER_ELASTICSEARCH_HOSTS: http://es01:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /fleet_token/token.txt
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      FLEET_SERVER_INSECURE_HTTP: true
    volumes:
      - fleet_token:/fleet_token:ro
      - fleet_data:/usr/share/elastic-agent/data
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [dataobs-poc]

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELK_VERSION:-9.4.0}
    container_name: dataobs-poc-elastic-agent
    mem_limit: 2g
    privileged: true
    user: root
    depends_on:
      fleet-server:
        condition: service_healthy
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "1"
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_APM_SERVER_URL: http://0.0.0.0:8200
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTICSEARCH_HOST: http://es01:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - agent_data:/usr/share/elastic-agent/data
      - agent_enrollment_token:/agent_enrollment_token:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export FLEET_ENROLLMENT_TOKEN="$$(cat /agent_enrollment_token/token.txt)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8200/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [dataobs-poc]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dataobs-poc-cadvisor
    mem_limit: 512m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks: [dataobs-poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: dataobs-poc-otel
    mem_limit: 768m
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-poc.yaml:/etc/otel/config.yaml:ro
      - /:/hostfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      APM_SERVER_URL: ${APM_SERVER_URL:-elastic-agent:8200}
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-dataobs_poc_apm_token}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://es01:9200}
      DOCKER_API_VERSION: "1.41"
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-local}
      CLOUD_REGION: ${CLOUD_REGION:-local}
      HOST_NAME: ${HOST_NAME:-dataobs-poc-host}
    depends_on:
      elastic-agent:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    # Multiple DNS aliases so producers can reach the collector by either
    # `otel-collector` (Compose service name) or `otel` (short alias —
    # matches the container suffix `dataobs-poc-otel` and avoids hyphenated-
    # name DNS edge cases observed on `docker compose run --rm pipeline`).
    networks:
      dataobs-poc:
        aliases:
          - otel
          - otel-collector

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: dataobs-poc-pipeline
    mem_limit: 4g
    depends_on:
      es01: { condition: service_healthy }
      kibana: { condition: service_healthy }
      # service_healthy (not service_started) so the pipeline only starts
      # once the collector is actually accepting OTLP requests. Avoids the
      # NameResolutionError("Failed to resolve 'otel-collector'") race where
      # the freshly-created `docker compose run --rm pipeline` container
      # tries to export traces before Docker DNS has fully propagated.
      otel-collector: { condition: service_healthy }
    environment:
      ELASTICHOST: http://es01:9200
      ELASTICSEARCH_URL: http://es01:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_URL: http://kibana:5601
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: dataobs-pipeline
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc,service.namespace=dataobs
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 30000
      OTEL_EXPORTER_OTLP_LOGS_TIMEOUT: 30000
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 512
      OTEL_BSP_SCHEDULE_DELAY: 5000
      DATAOBS_CONFIG: /app/config/dataobs_poc.yaml
      DATAOBS_TENANT_ID: poc
      DATAOBS_STORE_BACKEND: elasticsearch
      SPARK_MASTER: local[*]
      PYTHONPATH: /app
      DEPLOYMENT_ENV: poc
      SPARK_SUBMIT_OPTS: >-
        -Dotel.service.name=spark-driver
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4318
        -Dotel.exporter.otlp.protocol=http/protobuf
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.resource.attributes=deployment.environment=poc,service.namespace=dataobs
    volumes:
      - ./config:/app/config:ro
      - ./kibana:/app/kibana:ro
      - poc_pipeline_tmp:/tmp/dataobs
    command: ["python", "-m", "src.poc.pipeline_runner"]
    restart: "no"
    networks: [dataobs-poc]

volumes:
  es01_data: { driver: local }
  kibana_poc_data: { driver: local }
  fleet_token: { driver: local }
  agent_enrollment_token: { driver: local }
  fleet_data: { driver: local }
  agent_data: { driver: local }
  poc_pipeline_tmp: { driver: local }

networks:
  dataobs-poc:
    driver: bridge
    name: dataobs-poc
