services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dataobs_demo
      POSTGRES_USER: dataobs_metadata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DATAOBS_SENTINEL_PASSWORD_DO_NOT_PERSIST}
    ports: ["5432:5432"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATAOBS_STORE_BACKEND: elasticsearch
      DATAOBS_ELASTICSEARCH_URL: http://elasticsearch:9200
      DATAOBS_AUTH_ALLOW_UNAUTHENTICATED_DEV: "true"
    ports: ["8000:8000"]
    depends_on: [elasticsearch]
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DATAOBS_SENTINEL_PASSWORD_DO_NOT_PERSIST}
      DATAOBS_API_TOKEN: dev-token
    depends_on: [api, postgres]
