version: '3.8'

# ============================================================================
# DataObs — Full Stack Local Deployment
# ============================================================================
# Backends (choose via --profile or DATAOBS_BACKEND env var):
#   default                  → Elasticsearch AIOps + Kibana (default)
#   --profile opensearch     → OpenSearch self-managed + Data Prepper + Dashboards
#   --profile aws_grafana    → AWS Grafana stub (uses local AMP + Grafana)
#   --profile grafana_cloud  → Grafana Cloud (Alloy → Grafana Cloud OTLP)
#
# REQUIRED: Copy .env.example to .env and fill in all values before running.
# Run:  cp .env.example .env && docker compose up -d
#       docker compose --profile opensearch up -d    # OpenSearch backend
# ============================================================================

services:

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND A — Elasticsearch 9.x AIOps (default profile)
  # ════════════════════════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.4.2}
    container_name: dataobs-es01
    environment:
      - node.name=dataobs-es01
      - cluster.name=dataobs-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - copy .env.example to .env}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          curl -s -u "elastic:$$ELASTIC_PASSWORD" \
            http://localhost:9200/_cluster/health \
          | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dataobs-net

  # ────────────────────────────────────────────────────────────────────────────
  # es-setup: one-shot init container that bootstraps the kibana_system password
  # before Kibana is allowed to start.
  #
  # WHY THIS IS NEEDED:
  #   Elasticsearch ships with a built-in kibana_system user that has an empty
  #   (locked) password. Kibana 9.x refuses to connect until this password is
  #   set via the ES security API. Without this step you get:
  #     "Authentication of [kibana_system] was terminated by realm [reserved]"
  #   This container runs once after ES is healthy, sets the password from the
  #   KIBANA_PASSWORD env var, then exits 0 so Kibana's
  #   depends_on.condition: service_completed_successfully gate opens.
  # ────────────────────────────────────────────────────────────────────────────
  es-setup:
    image: curlimages/curl:8.7.1
    container_name: dataobs-es-setup
    labels:
      - "com.dataobs.role=init"
      - "com.dataobs.task=kibana_password_bootstrap"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:?KIBANA_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[es-setup] Waiting for Elasticsearch to be ready..."
        until curl -s -o /dev/null -w "%{http_code}" \
              -u "elastic:$${ELASTIC_PASSWORD}" \
              http://elasticsearch:9200/_cluster/health \
              | grep -qE '^(200)$$'; do
          echo "[es-setup] ES not ready yet, retrying in 5s..."
          sleep 5
        done
        echo "[es-setup] Elasticsearch is ready. Setting kibana_system password..."
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
        )
        if [ "$$HTTP_CODE" = "200" ]; then
          echo "[es-setup] kibana_system password set successfully (HTTP 200)."
        else
          echo "[es-setup] ERROR: Failed to set kibana_system password (HTTP $$HTTP_CODE). Aborting."
          exit 1
        fi
        echo "[es-setup] Bootstrap complete."
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - dataobs-net
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.4.2}
    container_name: dataobs-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?KIBANA_PASSWORD is required - copy .env.example to .env}
    ports:
      - "5601:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # LOCAL ELASTIC APM SERVER — demo intake for Elastic APM agents
  # ════════════════════════════════════════════════════════════════════════════
  # This service is intended for local/DataObs POC usage so external demo apps
  # such as SkillRadar can send Elastic APM traces directly to DataObs.
  # Anonymous intake is enabled only for local demos. Use API keys/secret tokens
  # and TLS for production-like deployments.
  apm-server:
    image: docker.elastic.co/apm/apm-server:${ELK_VERSION:-9.4.2}
    container_name: dataobs-apm-server
    command:
      - apm-server
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - -E
      - output.elasticsearch.username=elastic
      - -E
      - output.elasticsearch.password=${ELASTIC_PASSWORD}
      - -E
      - apm-server.auth.anonymous.enabled=true
      - -E
      - apm-server.rum.enabled=true
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://localhost:8200/ | grep -q 'publish_ready'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND B — OpenSearch self-managed (profile: opensearch)
  # ════════════════════════════════════════════════════════════════════════════
  opensearch:
    profiles: [opensearch]
    image: opensearchproject/opensearch:2.13.0
    container_name: dataobs-opensearch
    environment:
      - cluster.name=dataobs-opensearch
      - node.name=dataobs-os01
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
      - plugins.security.disabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    ports:
      - "9201:9200"
      - "9600:9600"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          curl -ks -u "admin:$$OPENSEARCH_PASSWORD" \
            https://localhost:9200/_cluster/health \
          | grep -qE '"status":"(green|yellow)"'
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dataobs-net

  opensearch-dashboards:
    profiles: [opensearch]
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: dataobs-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5602:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dataobs-net

  data-prepper:
    profiles: [opensearch]
    image: opensearchproject/data-prepper:2.7.0
    container_name: dataobs-data-prepper
    volumes:
      - ./config/opensearch/data-prepper-pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./config/opensearch/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    ports:
      - "21890:21890"
      - "4900:4900"
    environment:
      - OPENSEARCH_ENDPOINT=https://opensearch:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_INSECURE=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND C — Local Prometheus + Grafana (profile: aws_grafana)
  # ════════════════════════════════════════════════════════════════════════════
  prometheus:
    profiles: [aws_grafana]
    image: prom/prometheus:v2.51.0
    container_name: dataobs-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/aws_grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dataobs-net

  grafana:
    profiles: [aws_grafana]
    image: grafana/grafana:10.4.0
    container_name: dataobs-grafana-local
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-dataobs}
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics,traceToLogs,correlations
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./config/aws_grafana/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # OPENTELEMETRY COLLECTOR — latest contrib release
  # ════════════════════════════════════════════════════════════════════════════
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    container_name: dataobs-otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # Collector self-metrics
      - "8889:8889"     # Prometheus scrape endpoint
      - "13133:13133"   # Health check
    environment:
      - DATAOBS_BACKEND=${DATAOBS_BACKEND:-elasticsearch}
      - ELASTIC_ENDPOINT=http://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - OPENSEARCH_DATA_PREPPER_ENDPOINT=http://data-prepper:21890
      - OPENSEARCH_INSECURE=true
      - OSIS_PIPELINE_ENDPOINT=${OSIS_PIPELINE_ENDPOINT:-}
      - AMP_REMOTE_WRITE_URL=${AMP_REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID:-}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY:-}
      - DEPLOY_ENV=${DEPLOY_ENV:-local}
      - SERVICE_NAMESPACE=dataobs
      - DATAOBS_VERSION=${DATAOBS_VERSION:-dev}
      # OTLP_ALLOWED_ORIGINS: set to your internal origin, e.g. https://*.internal.example.com
      # Do NOT use "*" in production. Omit to use the secure default in otel-collector-config.yaml.
      - OTLP_ALLOWED_ORIGINS=${OTLP_ALLOWED_ORIGINS:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # DATAOBS QUALITY ENGINE
  # ════════════════════════════════════════════════════════════════════════════
  dataobs-quality:
    build:
      context: .
      dockerfile: Dockerfile.quality
    container_name: dataobs-quality-engine
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - DATAOBS_CONFIG=/app/config/dataobs.yaml
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=dataobs-quality-engine
      - OTEL_SERVICE_VERSION=${DATAOBS_VERSION:-dev}
      - OTEL_SERVICE_NAMESPACE=dataobs
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dataobs,deployment.environment.name=${DEPLOY_ENV:-local},deployment.environment=${DEPLOY_ENV:-local},service.instance.id=quality-engine-1,telemetry.sdk.language=python
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dataobs-net

  # ════════════════════════════════════════════════════════════════════════════
  # DATAOBS REST API
  # ════════════════════════════════════════════════════════════════════════════
  dataobs-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dataobs-api
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - DATAOBS_CONFIG=/app/config/dataobs.yaml
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=dataobs-api
      - OTEL_SERVICE_VERSION=${DATAOBS_VERSION:-dev}
      - OTEL_SERVICE_NAMESPACE=dataobs
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dataobs,deployment.environment.name=${DEPLOY_ENV:-local},deployment.environment=${DEPLOY_ENV:-local},service.instance.id=api-1,telemetry.sdk.language=python
      - API_TOKEN=${API_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - dataobs-net

  monitor-runtime:
    profiles: [monitor-runtime]
    build:
      context: .
      dockerfile: Dockerfile.monitor-runtime
    command: [run]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      DATAOBS_ELASTICSEARCH_URL: ${DATAOBS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
    depends_on: [elasticsearch]

volumes:
  esdata:
    driver: local
  opensearchdata:
    driver: local
  promdata:
    driver: local
  grafanadata:
    driver: local

networks:
  dataobs-net:
    driver: bridge
