version: 1
alerts:
  - id: api-readiness-unavailable
    title: Api Readiness Unavailable
    owner: team-0
    severity: warning
    source: platform-health
    expression: sustained_threshold
    for: 10m
    required_labels: [component]
    runbook: platform-health.md
    deduplication_key: alert_id/component
    recovery_condition: signal remains below threshold for 10m
    slo: api-serving-availability
    beta_critical: true
    default_enabled: true
