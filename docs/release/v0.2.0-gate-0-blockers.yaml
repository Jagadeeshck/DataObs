blockers:
  - id: T0-RC-HELM-PROFILES
    owner: Team 0
    workflow: beta-deployment-packaging.yml
    workflow_run_id: 40488946701
    workflow_url: https://github.com/Jagadeeshck/DataObs/actions/runs/40488946701
    first_meaningful_error: >-
      The values-profile loop invoked helm template without --kube-version, so
      Helm evaluated the chart as Kubernetes v1.20.0 and rejected the declared
      >=1.30.0-0 <1.31.0-0 range. Exact local reproduction then exposed two
      latent profile defects: the image-tag schema used unsupported RE2 negative
      lookahead and empty podAnnotations/env maps rendered invalid YAML.
    evidence_artifact: team-0-deployment-packaging-evidence
    artifact_id: 12725624998
    resolution: >-
      Pass Kubernetes 1.30.0 to every render, use production values plus
      deterministic non-publishable digest overrides for structural profiles,
      replace the redundant lookahead with an RE2-compatible pattern, and omit
      empty annotation/env fragments. Chart assertions now use the same inputs.
    hosted_state: fixed_locally_pending_rerun

  - id: T0-RC-BACKUP-EVIDENCE
    owner: Team 0
    workflow: beta-backup-restore.yml
    workflow_run_id: 40488946651
    workflow_url: https://github.com/Jagadeeshck/DataObs/actions/runs/40488946651
    first_meaningful_error: >-
      The destructive pytest step returned success, but the following evidence
      step exited before evidence/evidence.json was written. The standard writer
      succeeds when both inputs exist, isolating the failure to an absent or
      empty destructive-restore report rather than envelope signing or redaction.
    evidence_artifact: team-0-backup-restore-v1-evidence
    artifact_id: 12726571790
    resolution: >-
      Set the destructive-test opt-in and output path at job scope, report all
      pytest outcomes, inventory retained inputs, validate report semantics and
      nonempty resources with a dedicated fail-closed validator, and retain the
      envelope writer output. No missing report can be represented as passing.
    hosted_state: fixed_locally_pending_rerun

