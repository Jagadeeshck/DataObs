blockers:
  - id: T0-RC-HELM-PROFILES
    owner: Team 0
    workflow: beta-deployment-packaging.yml
    workflow_run_id: 40524617885
    workflow_url: https://github.com/Jagadeeshck/DataObs/actions/runs/40524617885
    first_meaningful_error: >-
      The repaired Helm renders passed and the job advanced to migration
      immutability, which exited 2. The workflow intentionally installs only
      release-tooling dependencies; packages.elastic_store.cli imported the
      Elasticsearch runtime client before dispatching its dependency-free plan
      command, so the check could not construct the current migration plan.
    evidence_artifact: team-0-deployment-packaging-evidence
    artifact_id: 12742928466
    resolution: >-
      Dispatch the plan command through the dependency-free migration manifest
      before importing runtime client/registry modules. Keep runtime imports for
      apply, status, doctor and rollback only. Add a guarded-import regression.
    hosted_state: fixed_locally_pending_rerun

