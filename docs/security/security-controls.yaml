schema_version: '1.0'
control_states:
- not_implemented
- implemented
- local_tested
- hosted_tested
- independently_verified
- blocked
- not_applicable
- unknown
owners:
- Authentication Team
- IAM Team
- Platform Team
- Operations Team
- Release Team
- Security Team
- Data Platform Team
controls:
- id: SEC-AUTHN-001
  title: JWT validation
  category: authentication
  description: JWT signature, issuer, audience, expiry and token type are fail closed.
  owner_team: Authentication Team
  applicability:
  - development
  - standard
  - production
  implementation_state: local_tested
  required_evidence:
  - unit-test
  release_gate: true
  severity_if_missing: critical
  verification_method: unit-test
  evidence_freshness_policy: source-bound
- id: SEC-AUTHN-002
  title: OIDC PKCE and JWKS
  category: authentication
  description: Browser authorization uses PKCE and JWKS failure denies access.
  owner_team: Authentication Team
  applicability:
  - development
  - standard
  - production
  implementation_state: implemented
  required_evidence:
  - oidc-hosted
  release_gate: false
  severity_if_missing: high
  verification_method: oidc-hosted
  evidence_freshness_policy: current-release
- id: SEC-AUTHN-003
  title: Service token replay constraints
  category: authentication
  description: Service tokens apply JTI and strong-auth rules.
  owner_team: Authentication Team
  applicability:
  - development
  - standard
  - production
