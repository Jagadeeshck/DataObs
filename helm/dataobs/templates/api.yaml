{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataobs.fullname" . }}-api
  labels: {{- include "dataobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/shared-config.yaml") . | sha256sum }}
{{ toYaml .Values.api.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "dataobs.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: {{ include "dataobs.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
{{ toYaml .Values.api.readinessProbe | indent 12 }}
          startupProbe:
{{ toYaml .Values.api.startupProbe | indent 12 }}
          livenessProbe:
{{ toYaml .Values.api.livenessProbe | indent 12 }}
          env:
{{ include "dataobs.commonEnv" . | indent 12 }}
            - {name: DATAOBS_AUTHORIZATION_SOURCE, value: {{ .Values.api.security.authorizationSource | quote }}}
            - {name: DATAOBS_SECURITY_BOOTSTRAP_ENABLED, value: {{ .Values.api.security.bootstrapEnabled | quote }}}
            - {name: DATAOBS_EXTERNAL_SCHEME, value: {{ .Values.api.security.externalScheme | quote }}}
            - {name: DATAOBS_TRUSTED_PROXY_CIDRS, value: {{ .Values.api.security.trustedProxyCidrs | toJson | quote }}}
            - {name: DATAOBS_CORS_ALLOWED_ORIGINS, value: {{ .Values.api.security.cors.allowedOrigins | toJson | quote }}}
            - {name: DATAOBS_CORS_ALLOWED_METHODS, value: {{ .Values.api.security.cors.allowedMethods | toJson | quote }}}
            - {name: DATAOBS_CORS_ALLOWED_HEADERS, value: {{ .Values.api.security.cors.allowedHeaders | toJson | quote }}}
            - {name: DATAOBS_CORS_EXPOSED_HEADERS, value: {{ .Values.api.security.cors.exposedHeaders | toJson | quote }}}
            - {name: DATAOBS_CORS_ALLOW_CREDENTIALS, value: {{ .Values.api.security.cors.allowCredentials | quote }}}
            - {name: DATAOBS_OIDC_MAXIMUM_TOKEN_LIFETIME_SECONDS, value: {{ .Values.api.oidc.maximumTokenLifetimeSeconds | quote }}}
            - {name: DATAOBS_OIDC_ALLOWED_AUTHORISED_PARTIES, value: {{ .Values.api.oidc.allowedAuthorisedParties | toJson | quote }}}
            - {name: DATAOBS_OIDC_ALLOWED_TOKEN_TYPES, value: {{ .Values.api.oidc.allowedTokenTypes | toJson | quote }}}
            - {name: DATAOBS_OIDC_REQUIRE_JTI_FOR_SERVICE_TOKENS, value: {{ .Values.api.oidc.requireJtiForServiceTokens | quote }}}
            - name: OIDC_ISSUER
              value: {{ .Values.external.oidc.issuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.external.oidc.audience | quote }}
            - name: CURSOR_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.api.secrets.cursorSecretName | quote }}, key: {{ .Values.api.secrets.cursorSecretKey | quote }}}}
            - name: SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.api.secrets.signingSecretName | quote }}, key: {{ .Values.api.secrets.signingSecretKey | quote }}}}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.api.secrets.encryptionSecretName | quote }}, key: {{ .Values.api.secrets.encryptionSecretKey | quote }}}}
            - {name: LOG_LEVEL, value: {{ .Values.api.logLevel | quote }}}
            - {name: REQUEST_TIMEOUT_SECONDS, value: {{ .Values.api.requestTimeoutSeconds | quote }}}
            - {name: DATAOBS_AUTHORIZATION_SOURCE, value: {{ .Values.api.security.authorizationSource | quote }}}
            - {name: DATAOBS_SECURITY_BOOTSTRAP_ENABLED, value: {{ .Values.api.security.bootstrapEnabled | quote }}}
            - {name: DATAOBS_OIDC_MAXIMUM_TOKEN_LIFETIME_SECONDS, value: {{ .Values.api.oidc.maximumTokenLifetimeSeconds | quote }}}
            - {name: DATAOBS_OIDC_ALLOWED_AUTHORISED_PARTIES, value: {{ .Values.api.oidc.allowedAuthorisedParties | toJson | quote }}}
            - {name: DATAOBS_OIDC_ALLOWED_TOKEN_TYPES, value: {{ .Values.api.oidc.allowedTokenTypes | toJson | quote }}}
            - {name: DATAOBS_OIDC_REQUIRE_JTI_FOR_SERVICE_TOKENS, value: {{ .Values.api.oidc.requireJtiForServiceTokens | quote }}}
            - {name: DATAOBS_CORS_ALLOWED_ORIGINS, value: {{ .Values.api.security.cors.allowedOrigins | toJson | quote }}}
{{ toYaml .Values.api.env | indent 12 }}
          envFrom: {{ toYaml .Values.api.envFrom | nindent 12 }}
          securityContext: {{ toYaml .Values.global.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
      nodeSelector: {{ toYaml (default .Values.global.nodeSelector .Values.api.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.affinity .Values.api.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.tolerations .Values.api.tolerations) | nindent 8 }}
      topologySpreadConstraints: {{ toYaml (default .Values.global.topologySpreadConstraints .Values.api.topologySpreadConstraints) | nindent 8 }}
{{- end }}
