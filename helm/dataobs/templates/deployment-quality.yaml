{{- if .Values.quality.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataobs.fullname" . }}-quality
  labels:
    app.kubernetes.io/name: {{ include "dataobs.name" . }}
    app.kubernetes.io/component: quality
spec:
  replicas: {{ .Values.quality.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dataobs.name" . }}
      app.kubernetes.io/component: quality
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dataobs.name" . }}
        app.kubernetes.io/component: quality
    spec:
      containers:
        - name: dataobs-quality
          image: "{{ .Values.quality.image.repository }}:{{ .Values.quality.image.tag }}"
          imagePullPolicy: {{ .Values.quality.image.pullPolicy }}
          env:
            - name: DATAOBS_CONFIG
              value: /app/config/dataobs.yaml
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://{{ include "dataobs.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.grpcPort }}
            - name: OTEL_SERVICE_NAME
              value: dataobs-quality
          volumeMounts:
            - name: dataobs-config
              mountPath: /app/config
              readOnly: true
          resources:
{{ toYaml .Values.quality.resources | indent 12 }}
      volumes:
        - name: dataobs-config
          configMap:
            name: {{ include "dataobs.fullname" . }}-config
{{- end }}
