{{- if .Values.monitorRuntime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataobs.fullname" . }}-monitor-runtime
  labels: {{- include "dataobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.monitorRuntime.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "monitor-runtime") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "monitor-runtime") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/shared-config.yaml") . | sha256sum }}
{{ toYaml .Values.monitorRuntime.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "dataobs.fullname" . }}-monitor-runtime
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.monitorRuntime.terminationGracePeriodSeconds }}
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: monitor-runtime
          image: {{ include "dataobs.image" (dict "root" . "image" .Values.monitorRuntime.image) | quote }}
          imagePullPolicy: {{ .Values.monitorRuntime.image.pullPolicy }}
          command: {{ toJson .Values.monitorRuntime.command }}
          env:
{{ include "dataobs.commonEnv" . | indent 12 }}
{{ toYaml .Values.monitorRuntime.env | indent 12 }}
          envFrom: {{ toYaml .Values.monitorRuntime.envFrom | nindent 12 }}
          securityContext: {{ toYaml .Values.global.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.monitorRuntime.resources | nindent 12 }}
      nodeSelector: {{ toYaml (default .Values.global.nodeSelector .Values.monitorRuntime.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.affinity .Values.monitorRuntime.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.tolerations .Values.monitorRuntime.tolerations) | nindent 8 }}
      topologySpreadConstraints: {{ toYaml (default .Values.global.topologySpreadConstraints .Values.monitorRuntime.topologySpreadConstraints) | nindent 8 }}
{{- end }}
