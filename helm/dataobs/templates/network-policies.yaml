{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "dataobs.fullname" . }}-default}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{namespaceSelector: {{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 8 }}}]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: {{ .Release.Name }}
    ports: [{protocol: TCP, port: 8080}]
  - to: [{namespaceSelector: {}}]
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  {{- range .Values.networkPolicy.additionalEgressCIDRs }}
  - to: [{ipBlock: {cidr: {{ . | quote }}}}]
  {{- end }}
{{- end }}
