{{- if and .Values.otelCollector.enabled (eq .Values.telemetry.mode "bundled") }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ include "dataobs.fullname" . }}-otel-config}
data:
  collector.yaml: |
    extensions: {health_check: {endpoint: 0.0.0.0:13133}, basicauth/elastic: {client_auth: {username: ${ELASTIC_USER}, password: ${ELASTIC_PASSWORD}}}}
    receivers: {otlp: {protocols: {grpc: {endpoint: 0.0.0.0:4317}, http: {endpoint: 0.0.0.0:4318}}}}
    processors: {memory_limiter: {check_interval: 1s, limit_mib: 384}, batch: {timeout: 10s}}
    exporters: {elasticsearch: {endpoints: [${ELASTIC_ENDPOINT}], auth: {authenticator: basicauth/elastic}}}
    service: {extensions: [health_check, basicauth/elastic], pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [elasticsearch]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [elasticsearch]}, logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [elasticsearch]}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "dataobs.fullname" . }}-otel-collector}
spec:
  replicas: {{ .Values.otelCollector.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "dataobs.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "dataobs.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: otel-collector}, annotations: {checksum/config: {{ toYaml .Values.external | sha256sum | quote }}}}
    spec:
      serviceAccountName: {{ include "dataobs.fullname" . }}-otel-collector
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
      - name: collector
        image: {{ include "dataobs.image" (dict "root" . "image" .Values.otelCollector.image) | quote }}
        args: ["--config=/etc/otel/collector.yaml"]
        ports: [{name: otlp-grpc, containerPort: 4317}, {name: otlp-http, containerPort: 4318}, {name: health, containerPort: 13133}]
        env:
{{ include "dataobs.commonEnv" . | indent 8 }}
        securityContext: {{ toYaml .Values.global.securityContext | nindent 10 }}
        resources: {{ toYaml .Values.otelCollector.resources | nindent 10 }}
        volumeMounts: [{name: config, mountPath: /etc/otel, readOnly: true}]
        readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 20}
      volumes: [{name: config, configMap: {name: {{ include "dataobs.fullname" . }}-otel-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "dataobs.fullname" . }}-otel-collector}
spec:
  selector: {app.kubernetes.io/name: {{ include "dataobs.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: otel-collector}
  ports: [{name: otlp-grpc, port: 4317}, {name: otlp-http, port: 4318}, {name: health, port: 13133}]
{{- end }}
