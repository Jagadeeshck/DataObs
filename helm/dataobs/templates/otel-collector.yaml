{{- if .Values.otelCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataobs.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: {{ include "dataobs.name" . }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dataobs.name" . }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dataobs.name" . }}
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
          ports:
            - containerPort: {{ .Values.otelCollector.service.grpcPort }}
            - containerPort: {{ .Values.otelCollector.service.httpPort }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
{{ toYaml .Values.otelCollector.resources | indent 12 }}
      volumes:
        - name: otel-config
          configMap:
            name: {{ include "dataobs.fullname" . }}-config
            items:
              - key: otel-collector-config.yaml
                path: otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataobs.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: {{ include "dataobs.name" . }}
    app.kubernetes.io/component: otel-collector
spec:
  type: {{ .Values.otelCollector.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dataobs.name" . }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.service.grpcPort }}
      targetPort: {{ .Values.otelCollector.service.grpcPort }}
    - name: otlp-http
      port: {{ .Values.otelCollector.service.httpPort }}
      targetPort: {{ .Values.otelCollector.service.httpPort }}
{{- end }}
