{{- if .Values.qualityWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataobs.fullname" . }}-quality-worker
  labels: {{- include "dataobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.qualityWorker.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "quality-worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dataobs.selector" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "quality-worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/shared-config.yaml") . | sha256sum }}
{{ toYaml .Values.qualityWorker.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "dataobs.fullname" . }}-quality-worker
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.qualityWorker.terminationGracePeriodSeconds }}
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: quality-worker
          image: {{ include "dataobs.image" (dict "root" . "image" .Values.qualityWorker.image) | quote }}
          imagePullPolicy: {{ .Values.qualityWorker.image.pullPolicy }}
          command: {{ toJson .Values.qualityWorker.command }}
          env:
{{ include "dataobs.commonEnv" . | indent 12 }}
{{ toYaml .Values.qualityWorker.env | indent 12 }}
          envFrom: {{ toYaml .Values.qualityWorker.envFrom | nindent 12 }}
          securityContext: {{ toYaml .Values.global.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.qualityWorker.resources | nindent 12 }}
      nodeSelector: {{ toYaml (default .Values.global.nodeSelector .Values.qualityWorker.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.affinity .Values.qualityWorker.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.tolerations .Values.qualityWorker.tolerations) | nindent 8 }}
      topologySpreadConstraints: {{ toYaml (default .Values.global.topologySpreadConstraints .Values.qualityWorker.topologySpreadConstraints) | nindent 8 }}
{{- end }}
