apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataobs.fullname" . }}-config
  labels: {{- include "dataobs.labels" . | nindent 4 }}
data:
  environment: {{ .Values.global.environment | quote }}
  tenant-mode: {{ .Values.global.tenantMode | quote }}
  elasticsearch-url: {{ .Values.external.elasticsearch.url | quote }}
  oidc-issuer: {{ .Values.external.oidc.issuer | quote }}
  oidc-audience: {{ .Values.external.oidc.audience | quote }}
  authorization-source: {{ .Values.api.security.authorizationSource | quote }}
  bootstrap-enabled: {{ .Values.api.security.bootstrapEnabled | quote }}
  external-scheme: {{ .Values.api.security.externalScheme | quote }}
  trusted-proxy-cidrs: {{ .Values.api.security.trustedProxyCidrs | toJson | quote }}
  cors: {{ .Values.api.security.cors | toJson | quote }}
  console-security-headers: {{ .Values.console.securityHeaders | toJson | quote }}
  console-runtime.js: |
    window.__DATAOBS_CONFIG__ = Object.freeze({apiBaseUrl: {{ .Values.console.apiBaseUrl | toJson }}, oidcIssuer: {{ .Values.external.oidc.issuer | toJson }}, oidcClientId: {{ .Values.external.oidc.clientId | toJson }}, observability: {{ .Values.console.observability | toJson }}});
  console-nginx.conf: |
    server {
      listen 8080;
      server_tokens off;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'" always;
      location = /healthz { access_log off; return 200 'ok'; }
      location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
      location / { try_files $uri $uri/ /index.html; }
      location /api/ {
        # No trailing slash: preserve /api/... when proxying to the FastAPI routes.
        proxy_pass http://{{ include "dataobs.fullname" . }}-api:8080;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
      }
    }
