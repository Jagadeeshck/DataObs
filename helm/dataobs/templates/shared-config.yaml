apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataobs.fullname" . }}-config
  labels: {{- include "dataobs.labels" . | nindent 4 }}
data:
  environment: {{ .Values.global.environment | quote }}
  tenant-mode: {{ .Values.global.tenantMode | quote }}
  elasticsearch-url: {{ .Values.external.elasticsearch.url | quote }}
  oidc-issuer: {{ .Values.external.oidc.issuer | quote }}
  oidc-audience: {{ .Values.external.oidc.audience | quote }}
  authorization-source: {{ .Values.api.security.authorizationSource | quote }}
  bootstrap-enabled: {{ .Values.api.security.bootstrapEnabled | quote }}
  external-scheme: {{ .Values.api.security.externalScheme | quote }}
  cors: {{ .Values.api.security.cors | toJson | quote }}
  console-security-headers: {{ .Values.console.securityHeaders | toJson | quote }}
  console-runtime.js: |
    window.__DATAOBS_CONFIG__ = Object.freeze({apiBaseUrl: {{ .Values.console.apiBaseUrl | toJson }}, oidcIssuer: {{ .Values.external.oidc.issuer | toJson }}, oidcClientId: {{ .Values.external.oidc.clientId | toJson }}});
