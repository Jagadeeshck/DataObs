scannerWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: jagadeeshck/dataobs-scanner-worker
    tag: 0.2.0
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  envFrom: []
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30
  command:
  - python
  - -m
  - services.scanner_worker.cli
  - --config
  - /etc/dataobs-scanner/config.yaml
  - run
  existingSecret: dataobs-scannerworker
  scanner:
    configSecretName: dataobs-scanner-sources
    configSecretKey: config.yaml
    maxConcurrency: 4
    schedule: '*/15 * * * *'
    sourceAllowlist: []
    tls:
      enabled: true
