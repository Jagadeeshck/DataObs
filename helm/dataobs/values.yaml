  command:
  - python
  - -m
  - packages.elastic_store.cli
  - apply
  terminalMigration: 0021_lineage_analysis_explorer
  activeDeadlineSeconds: 900
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
