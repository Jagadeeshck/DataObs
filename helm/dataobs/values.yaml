global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: ""

imagePullSecrets: []

config:
  dataobsYaml: |
    global:
      environment: production
      team: platform-engineering
      timezone: UTC
      log_level: INFO
    deployment:
      telemetry_mode: external_otel
      storage_mode: external_elasticsearch
    external_otel:
      enabled: true
      endpoint: http://{{ .Release.Name }}-otel-collector:4317
      protocol: grpc
      tls_enabled: false
      headers: {}
    elasticsearch:
      existing_cluster: true
      url: "http://elasticsearch.default.svc.cluster.local:9200"
      username: "elastic"
      # REQUIRED: override via --set or a Kubernetes Secret.
      # Never commit a real password here.
      # Example: helm upgrade dataobs . --set config.esPassword=mysecret
      password: ""
      verify_certs: false
      index_prefix: dataobs
  otelCollectorYaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/elastic:
        client_auth:
          username: "${ELASTIC_USER}"
          password: "${ELASTIC_PASSWORD}"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      awscloudwatch:
        region: "${AWS_REGION}"
      awsxray:
        endpoint: 0.0.0.0:2000
        transport: udp

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 500
        timeout: 10s
      resourcedetection:
        detectors: [env, system, docker]
        timeout: 10s
        override: false

    exporters:
      elasticsearch:
        endpoints: ["${ELASTIC_ENDPOINT}"]
        auth:
          authenticator: basicauth/elastic
        traces_index: "dataobs-traces"
        logs_index: "dataobs-logs"
        metrics_index: "dataobs-metrics"
        flush:
          bytes: 5242880
          interval: 30s
        retry:
          enabled: true
          max_requests: 3
          initial_interval: 1s
          max_interval: 30s
        mapping:
          mode: ecs
      # debug exporter kept for local troubleshooting only — not wired to any pipeline.
      debug:
        verbosity: basic

    service:
      extensions: [health_check, basicauth/elastic]
      pipelines:
        traces:
          receivers: [otlp, awsxray]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [elasticsearch]
        metrics:
          receivers: [otlp, awscloudwatch]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [elasticsearch]
        logs:
          receivers: [otlp, awscloudwatch]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [elasticsearch]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

api:
  enabled: true
  replicaCount: 2
  oidc:
    issuer: "https://identity.example.invalid/realms/dataobs"
    audience: "dataobs-api"
    clientId: "dataobs-console"
    allowedAlgorithms: ["RS256"]
    groupRoleMappings: '{}'
image:
    repository: ghcr.io/jagadeeshck/dataobs-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}

quality:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/jagadeeshck/dataobs-quality-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources: {}

otelCollector:
  enabled: true
  awsRegion: us-east-1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.98.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpcPort: 4317
    httpPort: 4318
    xrayUdpPort: 2000
  resources: {}
