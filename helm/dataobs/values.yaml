global:
  environment: production
  tenantMode: multi-tenant
  imageRegistry: ghcr.io
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''
  revisionHistoryLimit: 3
external:
  elasticsearch:
    url: https://elasticsearch.example.invalid:9200
    secretName: dataobs-elasticsearch
    usernameKey: username
    passwordKey: password
    verifyCertificates: true
    caSecretName: dataobs-elasticsearch-ca
    caKey: ca.crt
    fingerprintSecretName: dataobs-elasticsearch-fingerprint
    fingerprintKey: fingerprint
  oidc:
    issuer: https://identity.example.invalid
    audience: dataobs-api
    clientId: dataobs-console
    secretName: dataobs-oidc
telemetry:
  mode: bundled
  endpoint: ''
  protocol: grpc
  tls:
    enabled: false
    secretName: ''
networkPolicy:
  enabled: true
  additionalEgressCIDRs: []
  ingressNamespaceSelector: {}
api:
  security:
    authorizationSource: bindings
    bootstrapEnabled: false
    trustedProxyCidrs: []
    externalScheme: https
    cors:
      allowedOrigins: []
      allowedMethods: [GET, POST, PATCH, DELETE]
      allowedHeaders: [Authorization, Content-Type, X-Request-ID, X-DataObs-Tenant, X-DataObs-Environment, Idempotency-Key, If-Match]
      exposedHeaders: [X-Request-ID, ETag, Retry-After]
      allowCredentials: false
      maxAge: 600
  oidc:
    maximumTokenLifetimeSeconds: 3600
    allowedAuthorisedParties: []
    allowedTokenTypes: [Bearer, at+jwt]
    requireJtiForServiceTokens: true
  enabled: true
  replicaCount: 2
  image:
    repository: jagadeeshck/dataobs-api
    tag: 0.2.0
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  envFrom: []
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30
  service:
    type: ClusterIP
    port: 8080
  secrets:
    cursorSecretName: dataobs-api
    cursorSecretKey: cursor-secret
    signingSecretName: dataobs-api
    signingSecretKey: signing-secret
    encryptionSecretName: dataobs-api
    encryptionSecretKey: encryption-key
  logLevel: INFO
  requestTimeoutSeconds: 30
  security:
    authorizationSource: bindings
    bootstrapEnabled: false
    trustedProxyCidrs: []
    externalScheme: https
    cors:
      allowedOrigins: []
      allowedMethods: [GET, POST, PATCH, DELETE]
      allowedHeaders: [Authorization, Content-Type, X-Request-ID, X-DataObs-Tenant, X-DataObs-Environment, Idempotency-Key, If-Match]
      exposedHeaders: [X-Request-ID, ETag, Retry-After]
      allowCredentials: false
      maxAge: 600
  oidc:
    maximumTokenLifetimeSeconds: 3600
    allowedAuthorisedParties: []
    allowedTokenTypes: [Bearer, at+jwt]
    requireJtiForServiceTokens: true
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts: []
    tls: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
console:
  securityHeaders:
    contentSecurityPolicy: "default-src 'self'; connect-src 'self'; frame-ancestors 'none'"
    strictTransportSecurity: "max-age=31536000; includeSubDomains"
    xContentTypeOptions: nosniff
    referrerPolicy: no-referrer
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
  enabled: true
  replicaCount: 2
  image:
    repository: jagadeeshck/dataobs-console
    tag: 0.2.0
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  envFrom: []
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30
  apiBaseUrl: http://dataobs-api:8080
  # Browser telemetry is opt-in. Prefer a same-origin OTLP/HTTP gateway path.
  observability:
    enabled: false
    serviceName: dataobs-console
    serviceVersion: 0.2.0
    deploymentEnvironment: unknown
    otlpHttpEndpoint: /otel/v1/traces
    traceSampleRatio: 0.1
    captureWebVitals: true
    captureLongTasks: true
    captureResourceSummary: false
    propagateTraceHeaders: false
    tracePropagationAllowlist: []
    diagnosticsEnabled: false
    debug: false
    exportIntervalMs: 5000
    maxQueuedSpans: 256
    maxQueuedMetrics: 128
  csp: default-src 'self'; connect-src 'self'
  securityHeaders:
    contentSecurityPolicy: "default-src 'self'; connect-src 'self'"
    xContentTypeOptions: nosniff
    referrerPolicy: no-referrer
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    strictTransportSecurity: "max-age=31536000; includeSubDomains"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts: []
    tls: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
qualityWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: jagadeeshck/dataobs-quality-worker
    tag: 0.2.0
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  envFrom: []
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
