# ─────────────────────────────────────────────────────────────────────────────
# Grafana Cloud data sources — provisioned automatically on dashboard import.
# Replace the placeholder URLs/UIDs with your real Grafana Cloud stack values.
#
# Where to find these values:
#   Grafana Cloud → your stack → Details section
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

datasources:

  # ── Tempo (Traces) ──────────────────────────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: tempo-grafana-cloud
    access: proxy
    # Replace <stack-slug> with your Grafana Cloud stack slug
    url: https://<stack-slug>.grafana.net/tempo
    basicAuth: true
    basicAuthUser: "<GRAFANA_CLOUD_INSTANCE_ID>"
    secureJsonData:
      basicAuthPassword: "<GRAFANA_CLOUD_API_KEY>"
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-grafana-cloud   # links service map → metrics
      tracesToLogs:
        datasourceUid: loki-grafana-cloud
        filterByTraceID: true
        filterBySpanID: true
        mapTagNamesEnabled: true
        mappedTags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: prometheus-grafana-cloud
        tags:
          - key: service.name
            value: service
      lokiSearch:
        datasourceUid: loki-grafana-cloud
    isDefault: false

  # ── Loki (Logs) ─────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki-grafana-cloud
    access: proxy
    url: https://logs-prod-eu-west-0.grafana.net
    basicAuth: true
    basicAuthUser: "<GRAFANA_CLOUD_INSTANCE_ID>"
    secureJsonData:
      basicAuthPassword: "<GRAFANA_CLOUD_API_KEY>"
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo-grafana-cloud
    isDefault: false

  # ── Prometheus / Mimir (Metrics) ────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus-grafana-cloud
    access: proxy
    url: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom
    basicAuth: true
    basicAuthUser: "<GRAFANA_CLOUD_INSTANCE_ID>"
    secureJsonData:
      basicAuthPassword: "<GRAFANA_CLOUD_API_KEY>"
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo-grafana-cloud
    isDefault: true
