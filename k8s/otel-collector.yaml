apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataobs-otel-collector
  namespace: dataobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataobs-otel-collector
  template:
    metadata:
      labels:
        app: dataobs-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.98.0
          args: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
          env:
            - name: AWS_REGION
              value: us-east-1
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 2000
              protocol: UDP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: dataobs-config
            items:
              - key: otel-collector-config.yaml
                path: otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: dataobs-otel-collector
  namespace: dataobs
spec:
  selector:
    app: dataobs-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: aws-xray-udp
      port: 2000
      targetPort: 2000
      protocol: UDP
  type: ClusterIP
