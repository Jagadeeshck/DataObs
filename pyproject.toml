[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: marks tests that require external services or Docker Compose",
  "asyncio: marks async tests that need pytest-asyncio when enabled",
]

[tool.black]
line-length = 120
exclude = '''
/(
  \.git
  | \.venv
  | node_modules
)/
'''

[tool.ruff]
line-length = 120
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
# check_untyped_defs: enabled so mypy validates the body of functions that
# already have type annotations (even if the signature itself is untyped).
# This catches real bugs without requiring every function to be annotated first.
check_untyped_defs = true
allow_untyped_defs = true
# no_implicit_optional: prevents None silently becoming a valid value for a
# parameter that has a non-Optional default. Matches PEP 484 strict semantics.
no_implicit_optional = true
