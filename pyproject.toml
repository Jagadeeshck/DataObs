[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: marks tests that require external services or Docker Compose",
  "asyncio: marks async tests that need pytest-asyncio when enabled",
]

[tool.black]
line-length = 120
exclude = '''
/(
  \.git
  | \.venv
)/
'''

[tool.ruff]
line-length = 120
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
allow_untyped_defs = true
no_implicit_optional = false
