services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 18

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-test.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "13133:13133"
    depends_on:
      elasticsearch:
        condition: service_healthy

  dataobs-api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      - DATAOBS_STORE_BACKEND=elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - API_PORT=8000
      - DATAOBS_ALLOW_UNAUTHENTICATED_DEV=true
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  mock-webhook:
    image: python:3.11-alpine
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
                length = int(self.headers.get('content-length', '0'))
                self.rfile.read(length)
                self.send_response(202 if self.path.startswith('/pagerduty') else 201 if self.path.startswith('/servicenow') else 200)
                self.send_header('content-type', 'application/json' if not self.path.startswith('/slack') else 'text/plain')
                self.end_headers()
                if self.path.startswith('/slack'):
                    self.wfile.write(b'ok')
                elif self.path.startswith('/servicenow'):
                    self.wfile.write(json.dumps({'result': {'number': 'INC001'}}).encode())
                else:
                    self.wfile.write(json.dumps({'status': 'success', 'dedup_key': 'quality-orders-customer_id'}).encode())
        HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\ntry:\n urllib.request.urlopen('http://localhost:8080', timeout=1)\nexcept Exception:\n pass\nPY"]
      interval: 5s
      timeout: 3s
      retries: 12
