services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 18

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-test.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      elasticsearch:
        condition: service_healthy

  dataobs-api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      - DATAOBS_STORE_BACKEND=elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - API_PORT=8000
      - DATAOBS_ALLOW_UNAUTHENTICATED_DEV=true
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  mock-webhook:
    image: python:3.11-alpine
    command: ["python", "/app/mock_webhook.py"]
    volumes:
      - ./mock_webhook.py:/app/mock_webhook.py:ro
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
