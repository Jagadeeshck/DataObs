schema_version: "1.0"
load_harness: tests/performance/run_scale_certification.py
fault_proxy: toxiproxy
evidence_levels: [LEVEL_1_STATIC, LEVEL_2_FUNCTIONAL, LEVEL_3_HOSTED, LEVEL_4_CLOUD_DR]
mandatory:
  elasticsearch_latency:
    latency_ms: [50, 100, 250, 500]
    measure: [api_latency, elasticsearch_call_latency, retries, worker_backlog, readiness, timeout, resource_utilisation]
    assertions: [bounded_timeout, no_retry_storm]
  elasticsearch_outage:
    faults: [brief_outage, sustained_outage, connection_timeout, intermittent_503, intermittent_429]
    assertions: [livez_passes, readyz_fails, bounded_api_failure, worker_backoff, bounded_queue, no_silent_evidence_loss, safe_checkpoint, recovery]
    measure: [detection_duration, recovery_duration]
  elasticsearch_overload:
    faults: [http_429, rejection]
    assertions: [bounded_exponential_backoff, jitter, max_attempts, idempotency, no_non_idempotent_retry]
    measure: [retry_amplification_ratio]
  elasticsearch_resources:
    faults: [missing_alias, required_index_unavailable, incompatible_test_mapping]
    assertions: [health_accurate, readiness_fails, migration_check_fails, safe_recovery]
  oidc:
    provider: disposable
    faults: [jwks_outage, latency, expired_token, invalid_issuer, invalid_audience, unknown_key, key_rotation, retired_key]
    assertions: [authentication_fails_closed]
  otlp:
    faults: [unavailable, slow, rejecting, connection_reset]
    assertions: [api_continues, workers_continue, bounded_queue, drop_counter_increments, bounded_memory, bounded_shutdown]
  upgrade:
    source: actual_retained_release_required
    assertions: [forward_migration, workload_continues, api, workers, tenant_isolation, security, release_identity]
  rollback:
    allowed_outcomes: [passed, rollback_blocked_by_migration]
    assertions: [compatibility_contract_enforced, no_reverse_migration]
  migration:
    faults: [controlled_failure, concurrent_start, crash_restart, repeat_apply]
    assertions: [promotion_stops, readiness_incompatible, lock_guard, no_duplicate_mutation]
  backup_restore:
    scope: registered_dataobs_resources_only
    assertions: [real_snapshot_success, delete_confirmed, counts_match, fingerprints_match, tenant_isolation, migration_state, api, workers, control_plane]
  recovery_measurement:
    recovery_point: [T1, T2, TRecovered, observed_data_loss_window_seconds]
    recovery_time: [Tfailure, Trecovery_start, Tdata_restored, Tservice_ready, Tverification_complete, restore_duration, application_startup, verification, manual_intervention]
  dr_rehearsal:
    allowed_class: [simulation, single-region-recovery, cross-cluster-recovery, cross-region-recovery]
    assertions: [clean_target, correct_release, dependencies, restore, tenant_isolation, api, worker, security, workload, measured_recovery_time]
  multi_installation:
    installations: 2
    kind_classification: functional_simulation
    assertions: [installation_b_healthy, release_unchanged, tenant_state_unchanged, workers_unaffected, no_cross_claim, independent_observability]
  fencing:
    assertions: [expired_owner_rejected, stale_write_rejected, safe_takeover, monotonic_checkpoint]
  dns_ingress:
    assertions: [bounded_timeout, bounded_retry, recovery, accurate_readiness, no_infinite_blocking]
artifact:
  name: team-0-dr-dependency-resilience-certification-v1-evidence
  required_files:
    - evidence.json
    - certification-summary.json
    - topology-report.json
    - elasticsearch-latency-report.json
    - elasticsearch-outage-report.json
    - elasticsearch-overload-report.json
    - elasticsearch-resource-failure-report.json
    - oidc-resilience-report.json
    - jwks-rotation-report.json
    - telemetry-outage-report.json
    - dns-resilience-report.json
    - ingress-resilience-report.json
    - upgrade-report.json
    - rollback-report.json
    - migration-failure-report.json
    - migration-exclusivity-report.json
    - backup-report.json
    - restore-report.json
    - control-plane-restore-report.json
    - recovery-point-report.json
    - recovery-time-report.json
    - dr-rehearsal-report.json
    - multi-cluster-isolation-report.json
    - fencing-report.json
    - redaction-report.json
    - junit.xml
    - scenario-hashes.json
    - tool-versions.json
    - checksums.sha256
