server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Never emit absolute redirects: a directory redirect would otherwise build an
  # absolute URL using the internal listen port (8080), unreachable by external
  # clients behind the published port. Keeps any redirect relative.
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # SPA fallback: do NOT try "$uri/" — client-side routes like /assets are not real
  # directories, and the "$uri/" probe triggers a directory redirect that broke the
  # Asset Catalog deep-link. Serve the file if it exists, else the SPA shell.
  location / { try_files $uri /index.html; }
  location /api/ {
    # No trailing slash: preserve /api/... when proxying to the FastAPI routes.
    proxy_pass http://api:8080;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}
